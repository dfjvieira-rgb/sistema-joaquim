<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MPU ANALISTA MASTER</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 75px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --juris: #4338ca; --intel: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: var(--primary); height: 55px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000; 
        }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR MASTER ICON */
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 12px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .btn-side { 
            width: 55px; height: 55px; border: none; border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative; gap: 4px;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); transform: scale(1.05); }
        .btn-side i { font-size: 1.1rem; color: var(--gold); }
        .btn-side span { font-size: 8px; font-weight: 900; text-transform: uppercase; }

        /* EDITOR E PAPEL ESTILO FGV */
        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px; }
        
        .sticky-tools {
            width: 100%; max-width: 850px; background: #fff; padding: 10px;
            border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0;
            display: flex; gap: 10px; position: sticky; top: 0; z-index: 10;
        }

        .paper { 
            width: 100%; max-width: 850px; background: white; min-height: 2500px; 
            padding: 50px; color: #1e293b; box-shadow: 0 15px 40px rgba(0,0,0,0.4); 
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 28px; line-height: 28px;
        }
        #folha-total { outline: none; font-family: 'Courier New', monospace; font-size: 17px; }

        /* VIEWERS LATERAIS 50/50 */
        .viewer { width: 0; background: #334155; display: flex; flex-direction: column; overflow: hidden; transition: width 0.4s ease; }
        .viewer.active { width: 50%; border-left: 4px solid var(--gold); }
        .pdf-header { background: #0f172a; padding: 10px; display: flex; justify-content: space-between; color: white; font-size: 10px; font-weight: bold; }
        iframe { flex: 1; border: none; background: white; }

        /* MODAIS INTELIGÊNCIA */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 95%; max-width: 500px; padding: 25px; border-radius: 15px; color: #0f172a; }
        .search-box { width: 100%; padding: 12px; border: 2px solid var(--gold); border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        .opt-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ddd; background: #f8fafc; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .opt-btn:hover { background: #fef08a; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; letter-spacing: -1px;">JOAQUIM <span style="color:var(--gold)">MPU ANALISTA</span></div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold);">00:00:00</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.salvarPeca()">
            <i class="fas fa-save"></i><span>Salvar</span>
        </button>
        <button class="btn-side" onclick="window.abrirGavetas()">
            <i class="fas fa-archive"></i><span>Gavetas</span>
        </button>
        <hr style="width:60%; opacity:0.1">
        <button class="btn-side" style="background:var(--intel);" onclick="window.intel('PECA')">
            <i class="fas fa-gavel"></i><span>Peça?</span>
        </button>
        <button class="btn-side" style="background:var(--intel);" onclick="window.intel('TESES')">
            <i class="fas fa-balance-scale"></i><span>Teses</span>
        </button>
        <button class="btn-side" style="background:var(--intel);" onclick="window.intel('50Q')">
            <i class="fas fa-list-ol"></i><span>50 Quest</span>
        </button>
        <hr style="width:60%; opacity:0.1">
        <button class="btn-side" onclick="window.abrirPDF('lc75.pdf')">
            <i class="fas fa-book"></i><span>LC 75</span>
        </button>
        <button class="btn-side" onclick="window.abrirPDF('lei_improbidade.pdf')">
            <i class="fas fa-shield-alt"></i><span>LIA</span>
        </button>
        <button class="btn-side" style="background:var(--perigo); margin-top:auto" onclick="window.limpar()">
            <i class="fas fa-eraser"></i><span>Limpar</span>
        </button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container">
            <div class="sticky-tools">
                <button onclick="document.execCommand('bold')" style="padding:5px 10px;"><b>B</b></button>
                <div style="flex:1; text-align:center; font-weight:900; font-size:12px;" id="titulo-topo">FOLHA DE RESPOSTA OFICIAL</div>
                <button onclick="window.toggleDual()" style="background:var(--info); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">DUAL VIEW</button>
            </div>
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    Clique em "Peça?" ou "Teses" para começar o estudo inteligente.
                </div>
            </div>
        </section>
        
        <section class="viewer" id="viewer-v">
            <div class="pdf-header">
                <span id="pdf-nome">VADE MECUM</span>
                <button onclick="window.toggleDual()" style="background:red; color:white; border:none; cursor:pointer;">X</button>
            </div>
            <iframe id="frame-pdf"></iframe>
        </section>
    </div>
</main>

<div class="modal" id="modal-intel">
    <div class="modal-body">
        <h2 id="intel-titulo" style="border-bottom:3px solid var(--gold); margin-bottom:15px;"></h2>
        <input type="text" class="search-box" id="intel-search" placeholder="Pesquisar..." onkeyup="window.filtrarIntel()">
        <div id="intel-lista"></div>
        <button onclick="document.getElementById('modal-intel').style.display='none'" style="width:100%; margin-top:15px; padding:12px; background:black; color:white; border-radius:8px; cursor:pointer;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ", 
        authDomain: "masteroab-db5e1.firebaseapp.com", 
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com", 
        projectId: "masteroab-db5e1" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // BANCO DE DADOS DAS INTELIGÊNCIAS MPU
    const DATA_MPU = {
        PECA: [
            {t: "Parecer em Processo Administrativo Disciplinar", c: "Utilizado em consultas sobre punição de servidores. Base: Lei 8.112/90."},
            {t: "Ação Civil Pública (MPF)", c: "Proteção do patrimônio público e social. Base: Lei 7.347/85."},
            {t: "Recurso Administrativo", c: "Interposto contra decisões de comissões processantes."},
            {t: "Ação de Improbidade Administrativa", c: "Rito especial da Lei 8.429/92."}
        ],
        TESES: [
            {t: "Independência das Instâncias", c: "A absolvição criminal só afasta a administrativa se negar o fato ou a autoria."},
            {t: "Prescrição Intercorrente no PAD", c: "Paralisação do processo por mais de 3 anos (Lei 9.873/99)."},
            {t: "Princípio da Proporcionalidade", c: "Aplicação de sanção compatível com a gravidade da falta."},
            {t: "Poder Hierárquico e Autotutela", c: "Súmula 473 do STF."}
        ],
        "50Q": [
            {t: "Questão 01 - Autonomia MPU", c: "A destituição do PGR exige maioria absoluta do Senado? (CERTO)."},
            {t: "Questão 02 - Servidor 8.112", c: "O prazo para posse é de 30 dias contados da publicação do ato? (CERTO)."}
        ]
    };

    window.tipoAtivo = "";

    // FUNÇÕES DE PDF
    window.abrirPDF = (nome) => {
        const frame = document.getElementById('frame-pdf');
        frame.src = `./pdfs/${nome}`;
        document.getElementById('pdf-nome').innerText = nome.toUpperCase();
        document.getElementById('viewer-v').classList.add('active');
    };

    window.toggleDual = () => document.getElementById('viewer-v').classList.toggle('active');

    // SISTEMA DE INTELIGÊNCIA
    window.intel = (tipo) => {
        window.tipoAtivo = tipo;
        document.getElementById('intel-titulo').innerText = tipo === 'PECA' ? "QUAL É A PEÇA?" : (tipo === 'TESES' ? "TESES MPU" : "50 QUESTÕES");
        document.getElementById('modal-intel').style.display = 'flex';
        window.filtrarIntel();
    };

    window.filtrarIntel = () => {
        const busca = document.getElementById('intel-search').value.toLowerCase();
        const lista = document.getElementById('intel-lista');
        lista.innerHTML = "";
        
        DATA_MPU[window.tipoAtivo].forEach(item => {
            if(item.t.toLowerCase().includes(busca)) {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.innerHTML = `<span>${item.t}</span><i class="fas fa-plus-circle"></i>`;
                btn.onclick = () => {
                    document.getElementById('folha-total').innerHTML += `<p><strong>${item.t}:</strong> ${item.c}</p><br>`;
                    document.getElementById('modal-intel').style.display = 'none';
                };
                lista.appendChild(btn);
            }
        });
    };

    // GAVETAS E SALVAMENTO
    window.salvarPeca = async () => {
        const nome = prompt("Nome do arquivo para salvar na Gaveta:");
        if(nome) {
            await set(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${Date.now()}`), {
                nome,
                conteudo: document.getElementById('folha-total').innerHTML,
                data: new Date().toLocaleString()
            });
            alert("Sincronizado com as Gavetas!");
        }
    };

    window.abrirGavetas = async () => {
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS`));
        if(snap.exists()) {
            const dados = snap.val();
            let listaHtml = "";
            Object.keys(dados).forEach(id => {
                listaHtml += `<button class="opt-btn" onclick="window.carregarPeca('${id}')">${dados[id].nome} <small>${dados[id].data}</small></button>`;
            });
            document.getElementById('intel-titulo').innerText = "GAVETAS SALVAS";
            document.getElementById('intel-lista').innerHTML = listaHtml;
            document.getElementById('modal-intel').style.display = 'flex';
        } else {
            alert("Gaveta vazia.");
        }
    };

    window.carregarPeca = async (id) => {
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${id}`));
        document.getElementById('folha-total').innerHTML = snap.val().conteudo;
        document.getElementById('modal-intel').style.display = 'none';
    };

    window.limpar = () => confirm("Limpar tela de estudos?") && (document.getElementById('folha-total').innerHTML = "");

    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
