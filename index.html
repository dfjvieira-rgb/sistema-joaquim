<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA MPU | ESTAÇÃO DE TRABALHO DINÂMICA</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --mpu-green: #064e3b; --mpu-blue: #0c4a6e; --mpu-gold: #b45309;
            --sidebar-w: 60px; --work-panel-w: 450px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #020617; height: 100vh; display: flex; overflow: hidden; }

        /* BARRA DE FERRAMENTAS LATERAL (FIXA) */
        .sidebar-fixed { 
            width: var(--sidebar-w); background: #000; display: flex; flex-direction: column; 
            align-items: center; padding: 15px 0; border-right: 1px solid var(--mpu-gold); z-index: 1000;
        }
        .nav-icon { 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.1rem; margin-bottom: 15px; cursor: pointer; 
            border-radius: 8px; transition: 0.2s; background: rgba(255,255,255,0.05);
        }
        .nav-icon:hover { background: var(--mpu-gold); color: white; }
        .nav-icon.active-work { background: var(--mpu-blue); border: 1px solid white; }

        /* CONTAINER PRINCIPAL */
        .viewport { flex: 1; display: flex; position: relative; overflow: hidden; background: #0f172a; }

        /* ÁREA DE LEITURA (PDFs) */
        .reading-area { 
            flex: 1; display: flex; gap: 5px; padding: 5px; background: #1e293b;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pdf-frame-container { flex: 1; background: white; border-radius: 4px; display: flex; flex-direction: column; overflow: hidden; }
        .pdf-label { background: #f1f5f9; padding: 5px 10px; font-size: 10px; font-weight: 800; color: var(--mpu-blue); border-bottom: 1px solid #ddd; }
        iframe { width: 100%; height: 100%; border: none; }

        /* PAINEL DE TRABALHO (FOLHA RETRÁTIL) */
        .work-panel { 
            width: 0; background: white; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .work-panel.expanded { width: var(--work-panel-w); border-left: 4px solid var(--mpu-gold); }
        
        .work-header { 
            background: var(--mpu-blue); color: white; padding: 12px; font-size: 12px; 
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .work-content { flex: 1; padding: 30px; overflow-y: auto; color: #1e293b; }
        #folha-total { outline: none; min-height: 100%; font-size: 15px; line-height: 1.6; text-align: justify; }

        /* HEADER INFO */
        header { 
            position: absolute; top: 10px; left: 75px; z-index: 500; 
            display: flex; gap: 15px; align-items: center; pointer-events: none;
        }
        .status-pill { background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px; font-size: 10px; color: var(--mpu-gold); font-weight: bold; border: 1px solid var(--mpu-gold); }

        /* MODAIS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 400px; padding: 20px; border-radius: 8px; color: black; }
        .opt-btn { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; cursor: pointer; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; }
        .opt-btn:hover { background: var(--mpu-blue); color: white; }
    </style>
</head>
<body>

    <nav class="sidebar-fixed">
        <div class="nav-icon active-work" id="toggle-work" onclick="window.toggleWork()" title="Alternar Folha de Trabalho"><i class="fas fa-edit"></i></div>
        <div class="nav-icon" onclick="window.abrirBiblioteca()" title="Escolher PDFs"><i class="fas fa-book-open"></i></div>
        <div style="height: 1px; width: 30px; background: rgba(255,255,255,0.2); margin-bottom: 15px;"></div>
        <div class="nav-icon" onclick="window.salvarCloud()" title="Salvar Estudo"><i class="fas fa-cloud-upload-alt"></i></div>
        <div class="nav-icon" onclick="window.abrirGavetas()" title="Meus Estudos"><i class="fas fa-folder-open"></i></div>
        <div class="nav-icon" style="margin-top: auto; color: #ef4444;" onclick="window.limparTudo()" title="Limpar Tudo"><i class="fas fa-trash-alt"></i></div>
    </nav>

    <header>
        <div class="status-pill" id="display-titulo">ESTUDO: SEM TÍTULO</div>
        <div class="status-pill" id="sessao-timer">00:00:00</div>
    </header>

    <main class="viewport">
        <section class="reading-area" id="reading-area">
            <div class="pdf-frame-container">
                <div class="pdf-label" id="label-l">PDF ESQUERDA</div>
                <iframe id="frame-l" src="about:blank"></iframe>
            </div>
            <div class="pdf-frame-container">
                <div class="pdf-label" id="label-r">PDF DIREITA</div>
                <iframe id="frame-r" src="about:blank"></iframe>
            </div>
        </section>

        <section class="work-panel expanded" id="work-panel">
            <div class="work-header">
                <span>FOLHA DE TRABALHO</span>
                <i class="fas fa-chevron-right" style="cursor:pointer" onclick="window.toggleWork()"></i>
            </div>
            <div class="work-content">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p><b>Caderno de Resolução de Questões</b></p>
                    <hr style="margin: 10px 0;">
                </div>
            </div>
        </section>
    </main>

    <div class="modal" id="modal-sys">
        <div class="modal-body">
            <h3 id="modal-title" style="margin-bottom:15px; color:var(--mpu-blue); border-bottom:2px solid var(--mpu-gold)">SISTEMA</h3>
            <div id="modal-content"></div>
            <button onclick="document.getElementById('modal-sys').style.display='none'" style="width:100%; padding:10px; background:black; color:white; border:none; margin-top:15px; cursor:pointer;">FECHAR</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1",
        storageBucket: "masteroab-db5e1.appspot.com",
        messagingSenderId: "620234160245",
        appId: "1:620234160245:web:8651817c66144e59f42668"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- LÓGICA DE INTERFACE (RECUO DA FOLHA) ---
    window.toggleWork = () => {
        const panel = document.getElementById('work-panel');
        const btn = document.getElementById('toggle-work');
        panel.classList.toggle('expanded');
        btn.classList.toggle('active-work');
    };

    // --- BIBLIOTECA DE PDFs ---
    window.LISTA_PDFS = [
        { n: "PROVA ANALISTA MPU (FGV)", u: "AnalistaMPU.pdf" },
        { n: "GABARITO ANALISTA (FGV)", u: "AnalistaMPU_Gabarito.pdf" },
        { n: "PROVA ANALISTA (CESPE)", u: "mpu10_045.pdf" },
        { n: "GABARITO ANALISTA (CESPE)", u: "gabaritos_mpu45.pdf" },
        { n: "TABELA DE PEÇAS", u: "identificacaopecas.pdf" }
    ];

    window.abrirBiblioteca = () => {
        const modal = document.getElementById('modal-sys');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "ESCOLHA O PDF E O LADO";
        content.innerHTML = "";
        window.LISTA_PDFS.forEach(pdf => {
            const div = document.createElement('div');
            div.className = 'opt-btn';
            div.innerHTML = `<span>${pdf.n}</span>
                <div>
                    <button onclick="window.setPDF(1, '${pdf.u}', '${pdf.n}')" style="padding:4px 8px; cursor:pointer;">ESQ</button>
                    <button onclick="window.setPDF(2, '${pdf.u}', '${pdf.n}')" style="padding:4px 8px; cursor:pointer; background:var(--mpu-blue); color:white;">DIR</button>
                </div>`;
            content.appendChild(div);
        });
        modal.style.display = 'flex';
    };

    window.setPDF = (lado, url, nome) => {
        const frame = lado === 1 ? 'frame-l' : 'frame-r';
        const label = lado === 1 ? 'label-l' : 'label-r';
        document.getElementById(frame).src = url;
        document.getElementById(label).innerText = nome.substring(0, 25);
    };

    // --- SALVAMENTO E GAVETAS ---
    window.salvarCloud = async () => {
        const titulo = prompt("Nome para este estudo?", "ESTUDO MPU") || "ESTUDO_MPU";
        const html = document.getElementById('folha-total').innerHTML;
        const slug = titulo.replace(/\s+/g, '_').toLowerCase();
        await set(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/ESTUDOS/${slug}`), {
            nome: titulo.toUpperCase(), conteudo: html, data: new Date().toLocaleString()
        });
        document.getElementById('display-titulo').innerText = "ESTUDO: " + titulo.toUpperCase();
        alert("Sincronizado com as Gavetas!");
    };

    window.abrirGavetas = async () => {
        const modal = document.getElementById('modal-sys');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "MEUS ESTUDOS SALVOS";
        content.innerHTML = "Carregando...";
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/ESTUDOS`));
        content.innerHTML = "";
        if(snap.exists()) {
            Object.values(snap.val()).reverse().forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.innerHTML = `<span>${item.nome} <br><small>${item.data}</small></span>`;
                btn.onclick = () => {
                    document.getElementById('folha-total').innerHTML = item.conteudo;
                    document.getElementById('display-titulo').innerText = "ESTUDO: " + item.nome;
                    modal.style.display = 'none';
                    if(!document.getElementById('work-panel').classList.contains('expanded')) window.toggleWork();
                };
                content.appendChild(btn);
            });
        }
        modal.style.display = 'flex';
    };

    window.limparTudo = () => confirm("Limpar papel de rascunho?") && (document.getElementById('folha-total').innerHTML = "");

    // TIMER
    let segs = 0;
    setInterval(() => {
        segs++;
        const h = Math.floor(segs / 3600).toString().padStart(2, '0');
        const m = Math.floor((segs % 3600) / 60).toString().padStart(2, '0');
        const s = (segs % 60).toString().padStart(2, '0');
        document.getElementById('sessao-timer').innerText = `${h}:${m}:${s}`;
    }, 1000);
</script>
</body>
</html>
