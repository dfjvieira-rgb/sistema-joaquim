<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA JURÍDICO | MPU ARSENAL COMPLETO v6</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --mpu-green: #064e3b; --mpu-blue: #0c4a6e; --mpu-gold: #b45309;
            --bg-paper: #f1f5f9; --sidebar-w: 260px; --sucesso: #166534; --perigo: #991b1b;
            --juris: #4338ca; --redacao: #c2410c; --provas: #5b21b6; --plano: #0891b2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--mpu-blue); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: linear-gradient(90deg, #001a33 0%, var(--mpu-green) 100%); 
            height: 60px; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid var(--mpu-gold); z-index: 5000; 
        }
        
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { 
            width: var(--sidebar-w); background: #020617; display: flex; flex-direction: column; gap: 8px; 
            padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; 
        }
        
        .btn-side { 
            width: 100%; min-height: 42px; border: none; border-radius: 6px; 
            display: flex; align-items: center; padding: 0 15px; 
            color: white; font-weight: 600; cursor: pointer; gap: 10px; 
            font-size: 0.7rem; text-transform: uppercase; transition: 0.2s; 
            background: rgba(255,255,255,0.05); 
        }
        .btn-side:hover { background: rgba(255,255,255,0.12); border-left: 4px solid var(--mpu-gold); }

        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px; }
        
        .sticky-tools { 
            position: sticky; top: -20px; z-index: 1000; background: #fff; width: 100%; max-width: 850px; 
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 15px;
        }
        
        #identificador-peca { 
            padding: 12px; background: #f8fafc; font-weight: 800; color: var(--mpu-blue); 
            border-bottom: 2px solid var(--mpu-gold); cursor: pointer; font-size: 0.85rem; 
            display: flex; justify-content: space-between;
        }
        
        .paper { 
            width: 100%; max-width: 850px; background: white; min-height: 1000px; 
            padding: 70px; color: #1e293b; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        #folha-total { outline: none; min-height: 900px; line-height: 1.6; font-size: 16px; text-align: justify; }

        #pdf-viewer { 
            position: absolute; right: 0; top: 0; bottom: 0; width: 0; 
            background: white; transition: 0.3s ease-in-out; z-index: 6000;
            display: flex; flex-direction: column; overflow: hidden; visibility: hidden; 
        }
        #pdf-viewer.active { width: 100%; visibility: visible; }
        #pdf-viewer iframe { flex: 1; border: none; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 110000; align-items: center; justify-content: center; padding: 20px; }
        .modal-body { background: white; width: 100%; max-width: 600px; padding: 25px; border-radius: 12px; color: #0f172a; max-height: 90vh; overflow-y: auto; }
        
        .opt-btn { width: 100%; padding: 10px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #ddd; background: #f8fafc; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; font-size: 0.75rem; align-items: center; color: var(--mpu-blue); }
        .opt-btn:hover { background: var(--mpu-blue); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.75rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: var(--mpu-blue); color: white; }
        .tag-lei { font-size: 9px; background: var(--mpu-green); color: #fff; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-shield-alt"></i> MPU | <span>ESTRATEGIA TOTAL 2026</span></div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--mpu-gold);"></div>
</header>

<main>
    <aside class="sidebar">
        <div style="font-size: 9px; color: var(--mpu-gold); font-weight: 900; margin: 10px 0; letter-spacing: 1px; text-align:center;">MENU TÁTICO</div>
        <button class="btn-side" style="background:var(--plano);" onclick="window.abrirPlanoVoo()"><i class="fas fa-map-marked-alt"></i> PLANO DE VOO (EDITAL)</button>
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.salvarNasGavetas()"><i class="fas fa-cloud-upload-alt"></i> SALVAR PROGRESSO</button>
        
        <div style="margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        
        <button class="btn-side" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book"></i> NÚCLEO DURO (LEIS)</button>
        <button class="btn-side" style="background:var(--provas);" onclick="window.abrirProvasAnteriores()"><i class="fas fa-paste"></i> PASTA DE PROVAS</button>
        <button class="btn-side" style="background:var(--redacao);" onclick="window.abrirRedacao()"><i class="fas fa-pen-nib"></i> TREINO DISCURSIVO</button>
        <button class="btn-side" style="background:var(--juris);" onclick="window.abrirJurisprudencia()"><i class="fas fa-gavel"></i> JURIS / TRIBUNAIS</button>
        <button class="btn-side" style="background:#4b5563;" onclick="window.inteligenciaNaoConfunda()"><i class="fas fa-lightbulb"></i> NÃO CONFUNDA</button>
        <button class="btn-side" onclick="window.abrirGavetas()"><i class="fas fa-archive"></i> MEUS ARQUIVOS</button>

        <div style="margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        <button class="btn-side" style="background:var(--perigo);" onclick="window.limparTela()"><i class="fas fa-eraser"></i> LIMPAR TELA</button>
    </aside>

    <section class="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomear()">
                <span><i class="fas fa-pen-fancy"></i> <span>MPU: NOVO ARQUIVO</span></span>
                <span style="font-size: 10px; opacity: 0.6;">CLIQUE PARA RENOMEAR</span>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total" contenteditable="true" spellcheck="false">
                <p style="text-align: center; color: var(--mpu-blue); font-size: 18px;"><b>DIÁRIO DE ESTUDOS - MPU 2026</b></p>
                <hr style="margin: 20px 0;">
                <p><i>Bem-vindo ao sistema. Seu edital verticalizado e leis fundamentais estão no menu lateral.</i></p>
            </div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div style="background:#001a33; padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid var(--mpu-gold);">
            <span id="pdf-title" style="color:white; font-size:12px; font-weight:bold;">SISTEMA DE LEITURA</span>
            <button onclick="window.fecharPDF()" style="background:var(--mpu-gold); border:none; padding:8px 20px; border-radius:4px; font-weight:bold; cursor:pointer;">X VOLTAR</button>
        </div>
        <iframe id="pdf-frame" src=""></iframe>
    </section>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:15px; border-bottom:3px solid var(--mpu-blue); padding-bottom:10px; font-size:1rem; color:var(--mpu-blue)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; padding:10px; background:var(--mpu-blue); color:white; border-radius:6px; margin-top:15px; cursor:pointer; border:none; font-weight:bold;">VOLTAR AO SISTEMA</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1",
        storageBucket: "masteroab-db5e1.appspot.com",
        messagingSenderId: "620234160245",
        appId: "1:620234160245:web:8651817c66144e59f42668"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const BASE_PATH = "MPU_ESTUDOS_ELITE/GAVETAS";
    window.pecaNome = "MPU: NOVO ARQUIVO";

    const CATEGORIAS = [
        { id: "PECAS", nome: "Peças e Pareceres", icon: "fa-file-signature" },
        { id: "JURIS", nome: "Jurisprudência", icon: "fa-gavel" },
        { id: "NAO_CONFUNDA", nome: "Dicas/Não Confunda", icon: "fa-lightbulb" }
    ];

    window.abrirPlanoVoo = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "CRONOGRAMA DE ELITE MPU (8 SEMANAS)";
        content.innerHTML = `
            <table>
                <tr><th>Sem</th><th>Matéria</th><th>Tópico</th></tr>
                <tr><td>1</td><td>LOMPU</td><td>LC 75 (Org/Atribuições)</td></tr>
                <tr><td>2</td><td>Const</td><td>Arts 127-130A CF</td></tr>
                <tr><td>3</td><td>Adm</td><td>Lei 8.112 (Servidores)</td></tr>
                <tr><td>4</td><td>Adm</td><td>LIA e Licitações</td></tr>
                <tr><td>5</td><td>Processo</td><td>Ação Civil Pública</td></tr>
            </table>
            <div class="opt-btn" style="margin-top:15px; background:var(--plano); color:white;" onclick="window.injetarEdital()">
                <span><i class="fas fa-file-import"></i> INJETAR EDITAL VERTICALIZADO</span>
            </div>`;
        modal.style.display = 'flex';
    };

    window.injetarEdital = () => {
        document.getElementById('folha-total').innerHTML = `<h2>📍 EDITAL VERTICALIZADO MPU</h2><hr><p>[ ] LC 75/93 (Toda)</p><p>[ ] CF/88 (Arts 127 a 130-A)</p><p>[ ] Lei 8.429/92 (Atualizada)</p><p>[ ] Lei 14.133/21 (Licitações)</p>`;
        document.getElementById('modal-base').style.display = 'none';
    };

    window.abrirBibliotecaPDF = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "NÚCLEO DURO (LEI SECA)";
        const leis = [
            { n: "LC 75/93", t: "Lei Orgânica MPU", u: "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm" },
            { n: "CF/88", t: "Constituição Federal", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" },
            { n: "LIA", t: "Improbidade (L. 8.429)", u: "https://www.planalto.gov.br/ccivil_03/leis/l8429.htm" },
            { n: "ACP", t: "Ação Civil Pública", u: "https://www.planalto.gov.br/ccivil_03/leis/l7347orig.htm" }
        ];
        content.innerHTML = "";
        leis.forEach(l => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><span class="tag-lei">${l.n}</span> ${l.t}</span>`;
            btn.onclick = () => { document.getElementById('pdf-frame').src = l.u; document.getElementById('pdf-viewer').classList.add('active'); modal.style.display = 'none'; };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.abrirProvasAnteriores = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "PASTA DE PROVAS MPU";
        const provas = [
            { n: "PROVAS 2018", u: "https://www.pciconcursos.com.br/provas/mpu/" },
            { n: "FILTRO QCONCURSOS", u: "https://www.qconcursos.com.br/questoes-de-concursos/provas?concurso_id=101" }
        ];
        content.innerHTML = "<p style='font-size:10px; margin-bottom:10px; color:red;'>Links abrem em nova aba para download:</p>";
        provas.forEach(p => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas fa-file-pdf"></i> ${p.n}</span>`;
            btn.onclick = () => window.open(p.u, '_blank');
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.abrirJurisprudencia = () => {
        window.open("https://scon.stj.jus.br/SCON/", "_blank");
        window.open("https://portal.stf.jus.br/informativo/", "_blank");
    };

    window.salvarNasGavetas = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "SINCRONIZAR NA NUVEM";
        content.innerHTML = "";
        CATEGORIAS.forEach(cat => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas ${cat.icon}"></i> &nbsp; ${cat.nome}</span>`;
            btn.onclick = async () => {
                const conteudo = document.getElementById('folha-total').innerHTML;
                const path = `${BASE_PATH}/${cat.id}`;
                const snap = await get(ref(db, path));
                let keyEncontrada = null;
                if (snap.exists()) {
                    const dados = snap.val();
                    keyEncontrada = Object.keys(dados).find(key => dados[key].nome === window.pecaNome);
                }
                const finalKey = keyEncontrada || Date.now().toString();
                await set(ref(db, `${path}/${finalKey}`), { nome: window.pecaNome, data: new Date().toLocaleString(), conteudo: conteudo });
                alert("Sincronizado!"); modal.style.display = 'none';
            };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.abrirGavetas = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "MEUS ARQUIVOS";
        content.innerHTML = "";
        CATEGORIAS.forEach(cat => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas ${cat.icon}"></i> &nbsp; ${cat.nome}</span>`;
            btn.onclick = () => window.listarArquivos(cat.id, cat.nome);
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.listarArquivos = async (catId, catNome) => {
        const content = document.getElementById('modal-content');
        content.innerHTML = "Carregando...";
        const snap = await get(ref(db, `${BASE_PATH}/${catId}`));
        content.innerHTML = `<div onclick="window.abrirGavetas()" style="cursor:pointer; color:var(--mpu-blue); font-weight:bold; margin-bottom:10px;">← Voltar</div>`;
        if (snap.exists()) {
            Object.keys(snap.val()).reverse().forEach(k => {
                const item = snap.val()[k];
                const d = document.createElement('div'); d.className = 'opt-btn';
                d.innerHTML = `<span>${item.nome} <br><small style="font-size:9px;">${item.data}</small></span>`;
                d.onclick = () => {
                    document.getElementById('folha-total').innerHTML = item.conteudo;
                    window.pecaNome = item.nome;
                    document.getElementById('identificador-peca').querySelector('span span').innerText = item.nome;
                    document.getElementById('modal-base').style.display = 'none';
                };
                content.appendChild(d);
            });
        } else { content.innerHTML += "<p>Vazio.</p>"; }
    };

    window.inteligenciaNaoConfunda = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "NÃO CONFUNDA";
        const dicas = ["MPU (4 ramos) vs MPE (Estaduais)", "PGR (2 anos) vs AGU (sem mandato fixo)", "Atribuições MPF vs MPT"];
        content.innerHTML = "";
        dicas.forEach(d => {
            const b = document.createElement('div'); b.className = 'opt-btn';
            b.innerHTML = `<span>${d}</span>`;
            b.onclick = () => { document.getElementById('folha-total').innerHTML += `<p style="background:#fff3cd; padding:5px;"><b>DICA:</b> ${d}</p>`; modal.style.display='none'; };
            content.appendChild(b);
        });
        modal.style.display = 'flex';
    };

    window.fecharPDF = () => document.getElementById('pdf-viewer').classList.remove('active');
    window.renomear = () => { const n = prompt("TÍTULO:", window.pecaNome); if(n) { window.pecaNome = n.toUpperCase(); document.getElementById('identificador-peca').querySelector('span span').innerText = n; } };
    window.limparTela = () => confirm("Limpar tudo?") && (document.getElementById('folha-total').innerHTML = "");
    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString('pt-BR'); }, 1000);
</script>
</body>
</html>
