<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MASTER ICON FULL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --juris: #4338ca; --redacao: #f97316;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: var(--primary); height: 55px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000; 
        }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 12px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .btn-side { 
            width: 48px; height: 48px; border: none; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); transform: scale(1.05); }
        .btn-side i { font-size: 1.2rem; color: var(--gold); }

        .btn-side::after {
            content: attr(data-label); position: absolute; left: 65px; background: #000; 
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 10px; 
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000;
            border: 1px solid var(--gold); font-weight: bold;
        }
        .btn-side:hover::after { opacity: 1; }

        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 25px; }
        
        .sticky-header {
            width: 100%; max-width: 850px; background: #f8fafc; padding: 15px;
            border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0;
            color: #020617; font-weight: 900; text-align: center;
        }

        .paper { width: 100%; max-width: 850px; background: white; min-height: 2500px; padding: 60px; color: #1e293b; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        #folha-total { outline: none; min-height: 2000px; line-height: 1.8; font-size: 16px; text-align: justify; }

        .viewer { width: 0; background: #334155; display: flex; flex-direction: column; overflow: hidden; transition: width 0.4s ease; }
        .viewer.active { width: 50%; border-left: 3px solid var(--gold); }
        iframe { flex: 1; border: none; background: white; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 92%; max-width: 600px; padding: 30px; border-radius: 20px; color: #0f172a; max-height: 85vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; background: #f8fafc; font-weight: 800; cursor: pointer; text-align: left; }
        .opt-btn:hover { background: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:900;">JOAQUIM <span style="color:var(--gold)">ELITE</span> 2026</div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold);">00:00:00</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="SALVAR SIMULADO" style="background:var(--sucesso);" onclick="window.modalSalvar()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="GAVETAS" onclick="window.abrirGavetas()"><i class="fas fa-folder-open"></i></button>
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        <button class="btn-side" data-label="INJETAR PROVA INTEGRAL" style="background:var(--info);" onclick="window.abrirModalInjecao()"><i class="fas fa-file-signature"></i></button>
        <button class="btn-side" data-label="NÚCLEO DURO (LEIS)" style="background:var(--juris);" onclick="window.abrirNucleoDuro()"><i class="fas fa-balance-scale"></i></button>
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        <button class="btn-side" data-label="DUAL VIEW" onclick="window.toggleDual()"><i class="fas fa-columns"></i></button>
        <button class="btn-side" data-label="LIMPAR TELA" style="background:var(--perigo); margin-top:auto" onclick="window.limpar()"><i class="fas fa-eraser"></i></button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container">
            <div class="sticky-header">CADERNO DE PROVA - ANALISTA MPU</div>
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p style="text-align:center;"><i>Aguardando injeção do Caderno MPU...</i></p>
                </div>
            </div>
        </section>
        <section class="viewer" id="viewer-v"><iframe id="frame-v"></iframe></section>
    </div>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; margin-top:20px; padding:15px; background:black; color:white; border-radius:10px;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ", authDomain: "masteroab-db5e1.firebaseapp.com", databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com", projectId: "masteroab-db5e1" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CONTEUDO_PROVA = `
        <div style="background:#f8fafc; padding:30px; border:4px double #000; color:#1e293b; font-family: 'Times New Roman', serif;">
            <h2 style="text-align:center;">CADERNO DE QUESTÕES OBJETIVAS - ANALISTA MPU</h2>
            <p style="text-align:center; font-size:12px;">ESTILO CESPE: (C) CERTO | (E) ERRADO</p>
            <hr>
            <h3 style="background:#020617; color:#fff; padding:5px;">CONHECIMENTOS BÁSICOS</h3>
            <p><b>01.</b> No que concerne à Lei Complementar nº 75/1993, a destituição do Procurador-Geral da República, por iniciativa do Presidente da República, deverá ser precedida de autorização da maioria absoluta do Senado Federal. <b>( ) C ( ) E</b></p>
            <p><b>02.</b> O Ministério Público detém autonomia funcional, administrativa e financeira, sendo-lhe assegurada a iniciativa de sua proposta orçamentária dentro dos limites estabelecidos na lei de diretrizes orçamentárias. <b>( ) C ( ) E</b></p>
            <p><b>03.</b> A Constituição Federal veda ao membro do MP o exercício de qualquer outra função pública, ainda que em disponibilidade, salvo uma de magistério. <b>( ) C ( ) E</b></p>
            <p><b>04.</b> O Ministério Público da União compreende o Ministério Público Federal, o Ministério Público do Trabalho, o Ministério Público Militar e o Ministério Público do Distrito Federal e Territórios. <b>( ) C ( ) E</b></p>
            <p><b>05.</b> Compete ao STF julgar o Procurador-Geral da República nos crimes de responsabilidade. <b>( ) C ( ) E</b></p>
            <br>
            <h3 style="background:#020617; color:#fff; padding:5px;">CONHECIMENTOS ESPECÍFICOS (LEI 8.112/90)</h3>
            <p><b>06.</b> A demissão de servidor público por lesão aos cofres públicos implica em indisponibilidade de bens e ressarcimento ao erário, sem prejuízo da ação penal cabível. <b>( ) C ( ) E</b></p>
            <p><b>07.</b> O prazo para conclusão de processo administrativo disciplinar é de 60 dias, prorrogáveis por igual período. <b>( ) C ( ) E</b></p>
            <br>
            <h2 style="text-align:center; border-top:2px solid #000; padding-top:20px;">PROVA DISCURSIVA (ESTUDO DE CASO)</h2>
            <p><b>ENUNCIADO:</b> João, servidor ocupante de cargo efetivo no MPU, responde a Processo Administrativo Disciplinar por suposta infração capitulada como lesão aos cofres públicos. Discorra sobre:</p>
            <p>1. O prazo prescricional para aplicação da pena de demissão.</p>
            <p>2. O marco interruptivo da prescrição no PAD.</p>
            <p>3. A possibilidade de absolvição na esfera administrativa após absolvição criminal por negativa de autoria.</p>
        </div>
        <hr style="margin:40px 0; border:2px dashed var(--gold);">
        <h3 style="text-align:center;">--- ESPAÇO PARA RESPOSTA (EDITÁVEL) ---</h3>
        <p><br></p>
    `;

    window.abrirModalInjecao = () => {
        const c = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "CADERNO ANALISTA MPU";
        c.innerHTML = `
            <button class="opt-btn" onclick="window.injetarTudo()">
                <i class="fas fa-file-import"></i> INJETAR PROVA COMPLETA PARA TREINO
            </button>
            <button class="opt-btn" onclick="window.lerPDF()">
                <i class="fas fa-eye"></i> APENAS LER PDF (LATERAL)
            </button>
        `;
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.injetarTudo = () => {
        document.getElementById('folha-total').innerHTML = CONTEUDO_PROVA;
        document.getElementById('modal-base').style.display = 'none';
        alert("Ambiente Configurado! Prova Objetiva e Discursiva prontas para edição.");
    };

    window.lerPDF = () => {
        document.getElementById('frame-v').src = "AnalistaMPU.pdf";
        document.getElementById('viewer-v').classList.add('active');
        document.getElementById('modal-base').style.display = 'none';
    };

    window.abrirNucleoDuro = () => {
        const c = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "NÚCLEO DURO - LEGISLAÇÃO";
        const leis = [
            {n:"LC 75/93", u:"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm"},
            {n:"Lei 8.112/90", u:"https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm"}
        ];
        c.innerHTML = leis.map(l => `<button class="opt-btn" onclick="window.lerUrl('${l.u}')">${l.n}</button>`).join('');
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.lerUrl = (u) => { document.getElementById('frame-v').src = u; document.getElementById('viewer-v').classList.add('active'); document.getElementById('modal-base').style.display = 'none'; };
    window.toggleDual = () => document.getElementById('viewer-v').classList.toggle('active');
    window.limpar = () => confirm("Limpar?") && (document.getElementById('folha-total').innerHTML = "");
    
    window.modalSalvar = async () => {
        const nome = prompt("Nome do Simulado:");
        if(nome) {
            await set(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/QUESTOES/${Date.now()}`), { nome, conteudo: document.getElementById('folha-total').innerHTML });
            alert("Salvo!");
        }
    };

    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
