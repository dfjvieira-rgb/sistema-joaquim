<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MULTI-VIEW</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --juris: #4338ca; --redacao: #f97316;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: var(--primary); height: 50px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000; 
        }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR MASTER ICON */
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 12px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .btn-side { 
            width: 45px; height: 45px; border: none; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); }
        .btn-side i { font-size: 1.1rem; color: var(--gold); }

        .btn-side::after {
            content: attr(data-label); position: absolute; left: 60px; background: #000; 
            color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 10px; 
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000;
        }
        .btn-side:hover::after { opacity: 1; }

        /* ÁREAS DE CONTEÚDO */
        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }

        /* EDITOR */
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); 
            overflow-y: auto; align-items: center; padding: 20px;
        }
        .editor-container.hidden { display: none; } /* Para o modo PDF + PDF */

        .paper { 
            width: 100%; max-width: 800px; background: white; min-height: 1200px; 
            padding: 50px; color: #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #folha-total { outline: none; min-height: 1000px; line-height: 1.6; font-size: 16px; }

        /* VIEWERS DE PDF */
        .viewer { 
            width: 0; background: #334155; display: flex; flex-direction: column; 
            overflow: hidden; border-left: 0 solid var(--gold); transition: width 0.4s ease;
        }
        .viewer.active { width: 50%; border-left: 2px solid var(--gold); }
        .viewer.full { width: 100% !important; }

        .pdf-header { background: #0f172a; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: bold; }
        .pdf-header button { background: var(--gold); border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-weight: 900; }

        iframe { flex: 1; border: none; background: white; }

        /* MODAIS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 90%; max-width: 450px; padding: 20px; border-radius: 15px; color: #0f172a; }
        .opt-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ddd; background: #f8fafc; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; }
        .opt-btn:hover { background: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:900">JOAQUIM <span style="color:var(--gold)">ELITE</span> MULTI-VIEW</div>
    <div id="status-view" style="font-size:10px; color:var(--gold)">MODO: FOLHA TOTAL</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="SALVAR NA NUVEM" style="background:var(--sucesso);" onclick="window.salvar()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="MEUS ARQUIVOS" onclick="window.abrirGavetas()"><i class="fas fa-folder-open"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="btn-side" data-label="PROVAS (ESQUERDA)" style="background:var(--info);" onclick="window.abrirModal('PDF1')"><i class="fas fa-file-pdf"></i></button>
        <button class="btn-side" data-label="GABARITOS (DIREITA)" style="background:var(--juris);" onclick="window.abrirModal('PDF2')"><i class="fas fa-check-double"></i></button>
        <button class="btn-side" data-label="NÚCLEO DURO" onclick="window.abrirNucleo()"><i class="fas fa-gavel"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="btn-side" data-label="VER PDF + PDF" onclick="window.toggleDualPDF()"><i class="fas fa-columns"></i></button>
        <button class="btn-side" data-label="VOLTAR TELA ÚNICA" onclick="window.resetView()"><i class="fas fa-desktop"></i></button>
        
        <button class="btn-side" data-label="LIMPAR" style="background:var(--perigo); margin-top:auto" onclick="window.limpar()"><i class="fas fa-eraser"></i></button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container" id="container-folha">
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p style="text-align:center"><b>FOLHA DE RESPOSTAS - MASTER ICON</b></p><br>
                </div>
            </div>
        </section>

        <section class="viewer" id="viewer-1">
            <div class="pdf-header">
                <span id="title-1">PDF 1</span>
                <button onclick="window.fecharV(1)">X</button>
            </div>
            <iframe id="frame-1" src=""></iframe>
        </section>

        <section class="viewer" id="viewer-2">
            <div class="pdf-header">
                <span id="title-2">PDF 2</span>
                <button onclick="window.fecharV(2)">X</button>
            </div>
            <iframe id="frame-2" src=""></iframe>
        </section>
    </div>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:15px; border-bottom:2px solid var(--gold)">SELECIONAR ARQUIVO</h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; margin-top:15px; padding:10px; background:black; color:white; border:none; border-radius:5px; cursor:pointer">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ARQUIVOS = [
        { n: "PROVA ANALISTA 2025", u: "AnalistaMPU.pdf" },
        { n: "GABARITO ANALISTA 2025", u: "AnalistaMPU_Gabarito.pdf" },
        { n: "LC 75/93 (MPU)", u: "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm" },
        { n: "CF/88 (Arts 127)", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" }
    ];

    let alvoAtual = "";

    window.abrirModal = (alvo) => {
        alvoAtual = alvo;
        const content = document.getElementById('modal-content');
        content.innerHTML = "";
        ARQUIVOS.forEach(arq => {
            const btn = document.createElement('div');
            btn.className = 'opt-btn';
            btn.innerHTML = arq.n;
            btn.onclick = () => window.carregarPDF(arq.u, arq.n);
            content.appendChild(btn);
        });
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.carregarPDF = (url, nome) => {
        if(alvoAtual === 'PDF1') {
            document.getElementById('frame-1').src = url;
            document.getElementById('title-1').innerText = nome;
            document.getElementById('viewer-1').classList.add('active');
            document.getElementById('container-folha').classList.add('hidden');
        } else {
            document.getElementById('frame-2').src = url;
            document.getElementById('title-2').innerText = nome;
            document.getElementById('viewer-2').classList.add('active');
        }
        document.getElementById('modal-base').style.display = 'none';
        atualizarStatus();
    };

    window.toggleDualPDF = () => {
        // Modo PDF + PDF
        document.getElementById('container-folha').classList.add('hidden');
        document.getElementById('viewer-1').classList.add('active');
        document.getElementById('viewer-2').classList.add('active');
        atualizarStatus("MODO: PDF + PDF (COMPARATIVO)");
    };

    window.resetView = () => {
        document.getElementById('container-folha').classList.remove('hidden');
        document.getElementById('viewer-1').classList.remove('active');
        document.getElementById('viewer-2').classList.remove('active');
        atualizarStatus("MODO: FOLHA TOTAL");
    };

    window.fecharV = (n) => {
        document.getElementById(`viewer-${n}`).classList.remove('active');
        if(n === 1) document.getElementById('container-folha').classList.remove('hidden');
        atualizarStatus();
    };

    function atualizarStatus(msg) {
        document.getElementById('status-view').innerText = msg || "MODO DINÂMICO";
    }

    // FIREBASE GAVETAS
    window.salvar = async () => {
        const html = document.getElementById('folha-total').innerHTML;
        const nome = prompt("Nome do Estudo:") || "SEM TITULO";
        await set(ref(db, `JOAQUIM_ELITE/GAVETAS/${Date.now()}`), { nome, conteudo: html, data: new Date().toLocaleString() });
        alert("Sincronizado!");
    };

    window.abrirGavetas = async () => {
        const snap = await get(ref(db, `JOAQUIM_ELITE/GAVETAS`));
        const content = document.getElementById('modal-content');
        content.innerHTML = "";
        if(snap.exists()){
            Object.values(snap.val()).reverse().forEach(item => {
                const d = document.createElement('div'); d.className = 'opt-btn';
                d.innerHTML = `<span>${item.nome}</span>`;
                d.onclick = () => { document.getElementById('folha-total').innerHTML = item.conteudo; document.getElementById('modal-base').style.display='none'; };
                content.appendChild(d);
            });
        }
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.limpar = () => confirm("Limpar tela?") && (document.getElementById('folha-total').innerHTML = "");
</script>
</body>
</html>
