<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA JURÍDICO | MPU TELA DIVIDIDA</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --mpu-green: #064e3b; --mpu-blue: #0c4a6e; --mpu-gold: #b45309;
            --bg-paper: #f1f5f9; --sidebar-w: 260px; --sucesso: #166534; --perigo: #991b1b;
            --pdf-pink: #be185d; --split-bg: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--mpu-blue); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: linear-gradient(90deg, #001a33 0%, var(--mpu-green) 100%); 
            height: 60px; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid var(--mpu-gold); z-index: 5000; 
        }
        
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR */
        .sidebar { 
            width: var(--sidebar-w); background: #020617; display: flex; flex-direction: column; gap: 8px; 
            padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; z-index: 10;
        }
        
        .btn-side { 
            width: 100%; min-height: 42px; border: none; border-radius: 6px; 
            display: flex; align-items: center; padding: 0 15px; 
            color: white; font-weight: 600; cursor: pointer; gap: 10px; 
            font-size: 0.7rem; text-transform: uppercase; transition: 0.2s; 
            background: rgba(255,255,255,0.05); 
        }
        .btn-side:hover { background: rgba(255,255,255,0.12); border-left: 4px solid var(--mpu-gold); }

        /* EDITOR E TELA DIVIDIDA */
        .workspace { flex: 1; display: flex; transition: 0.4s ease-in-out; background: var(--bg-paper); overflow: hidden; }
        
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            padding: 20px; overflow-y: auto; transition: 0.4s;
        }
        
        .paper { 
            width: 100%; max-width: 800px; background: white; min-height: 1000px; 
            padding: 60px; color: #1e293b; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 4px;
        }
        
        #folha-total { outline: none; min-height: 900px; line-height: 1.6; font-size: 16px; text-align: justify; }

        /* PAINEL PDF (INTELIGÊNCIA OAB) */
        #pdf-split-panel { 
            width: 0; background: var(--split-bg); display: flex; flex-direction: column; 
            transition: 0.4s ease-in-out; border-left: 2px solid var(--mpu-gold);
        }
        #pdf-split-panel.active { width: 50%; } /* Divide a tela em 50/50 */

        #pdf-frame { width: 100%; flex: 1; border: none; background: white; }
        
        .pdf-toolbar { padding: 10px 15px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }

        /* MODAIS E BOTÕES */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 110000; align-items: center; justify-content: center; padding: 20px; }
        .modal-body { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 12px; color: #0f172a; }
        
        .opt-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ddd; background: #f8fafc; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; font-size: 0.8rem; align-items: center; color: var(--mpu-blue); }
        .opt-btn:hover { background: var(--mpu-blue); color: white; }
        
        .sticky-tools { position: sticky; top: -20px; z-index: 100; width: 100%; max-width: 800px; margin-bottom: 15px; }
        #identificador-peca { padding: 12px; background: #fff; border-bottom: 2px solid var(--mpu-gold); color: var(--mpu-blue); font-weight: 800; border-radius: 8px 8px 0 0; }

        @media (max-width: 768px) { #pdf-split-panel.active { width: 100%; position: absolute; height: 100%; z-index: 2000; } }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-columns"></i> MPU | <span>MÉTODO TELA DIVIDIDA</span></div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--mpu-gold);"></div>
</header>

<main>
    <aside class="sidebar">
        <div style="font-size: 9px; color: var(--mpu-gold); font-weight: 900; margin: 10px 0; letter-spacing: 1px; text-align:center;">ESTUDO ATIVO</div>
        
        <button class="btn-side" style="background:var(--pdf-pink);" onclick="window.abrirGavetaPDF()"><i class="fas fa-file-pdf"></i> MINHA GAVETA PDF</button>
        
        <button class="btn-side" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book"></i> VADE MECUM</button>
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.salvarNasGavetas()"><i class="fas fa-save"></i> SALVAR NO HISTÓRICO</button>
        
        <div style="margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        
        <button class="btn-side" onclick="window.abrirPlanoVoo()"><i class="fas fa-map"></i> PLANO DE VOO</button>
        <button class="btn-side" onclick="window.abrirGavetas()"><i class="fas fa-archive"></i> MEUS ARQUIVOS</button>
        
        <div style="margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        <button class="btn-side" style="background:var(--perigo);" onclick="window.limparGavetaPDF()"><i class="fas fa-trash-alt"></i> LIMPAR GAVETA PDF</button>
    </aside>

    <div class="workspace">
        <section class="editor-container">
            <div class="sticky-tools">
                <div id="identificador-peca" onclick="window.renomear()">
                    <i class="fas fa-pen-alt"></i> <span id="txt-nome-peca">ANÁLISE CARGO 45 (DIREITO)</span>
                </div>
            </div>
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p><b>DICA DE ESTUDO:</b> Abra o PDF na gaveta ao lado e faça suas anotações aqui.</p>
                </div>
            </div>
        </section>

        <section id="pdf-split-panel">
            <div class="pdf-toolbar">
                <span style="font-size: 11px; font-weight: bold; color: #94a3b8;"><i class="fas fa-glasses"></i> LEITURA ATIVA</span>
                <button onclick="window.fecharSplitPDF()" style="background:var(--mpu-gold); border:none; padding:4px 12px; border-radius:4px; font-weight:bold; cursor:pointer; font-size: 10px;">FECHAR X</button>
            </div>
            <iframe id="pdf-frame" src=""></iframe>
        </section>
    </div>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:15px; border-bottom:2px solid var(--mpu-blue); padding-bottom:5px; font-size:1rem;"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; padding:10px; background:var(--mpu-blue); color:white; border-radius:6px; margin-top:15px; cursor:pointer; border:none;">VOLTAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1",
        storageBucket: "masteroab-db5e1.appspot.com",
        messagingSenderId: "620234160245",
        appId: "1:620234160245:web:8651817c66144e59f42668"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.pecaNome = "ANÁLISE CARGO 45 (DIREITO)";

    // --- GAVETA DE PDF (TELA DIVIDIDA) ---
    window.abrirGavetaPDF = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "MINHA GAVETA DE PDFs";
        
        // Arquivos injetados do seu upload
        const arquivos = [
            { n: "PROVA ANALISTA 2010", file: "mpu10_045.pdf" },
            { n: "GABARITO ANALISTA 2010", file: "gabaritos_mpu45.pdf" }
        ];

        content.innerHTML = "";
        arquivos.forEach(arq => {
            const btn = document.createElement('div');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas fa-file-pdf"></i> ${arq.n}</span> <i class="fas fa-columns" title="Abrir em Tela Dividida"></i>`;
            btn.onclick = () => {
                // Simulação da inteligência de tela dividida
                document.getElementById('pdf-split-panel').classList.add('active');
                // Aqui o src seria o link real do arquivo no storage
                document.getElementById('pdf-frame').src = "about:blank"; // Simulando carga
                modal.style.display = 'none';
            };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.fecharSplitPDF = () => {
        document.getElementById('pdf-split-panel').classList.remove('active');
    };

    window.limparGavetaPDF = () => {
        if(confirm("Deseja limpar todos os PDFs salvos na gaveta de histórico?")) {
            const path = "MPU_ESTUDOS/PDF_HISTORY";
            remove(ref(db, path)).then(() => alert("Gaveta limpa com sucesso!"));
        }
    };

    // Funções de apoio
    window.renomear = () => {
        const n = prompt("Novo nome para o estudo:", window.pecaNome);
        if(n) {
            window.pecaNome = n.toUpperCase();
            document.getElementById('txt-nome-peca').innerText = window.pecaNome;
        }
    };

    window.abrirBibliotecaPDF = () => {
        // Lógica de Vade Mecum (CF/88, LC 75)
        document.getElementById('pdf-split-panel').classList.add('active');
        document.getElementById('pdf-frame').src = "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm";
    };

    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString('pt-BR'); }, 1000);
</script>
</body>
</html>
