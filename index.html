<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MASTER ICON FULL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --juris: #4338ca; --redacao: #f97316;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: var(--primary); height: 55px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000; 
        }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR MASTER ICON */
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 12px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .btn-side { 
            width: 48px; height: 48px; border: none; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); transform: scale(1.05); }
        .btn-side i { font-size: 1.2rem; color: var(--gold); }

        .btn-side::after {
            content: attr(data-label); position: absolute; left: 65px; background: #000; 
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 10px; 
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000;
            border: 1px solid var(--gold); font-weight: bold;
        }
        .btn-side:hover::after { opacity: 1; }

        /* EDITOR AREA */
        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 25px; }
        .sticky-header {
            width: 100%; max-width: 850px; background: #f8fafc; padding: 15px;
            border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0;
            color: #020617; font-weight: 900; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .paper { width: 100%; max-width: 850px; background: white; min-height: 1500px; padding: 60px; color: #1e293b; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        #folha-total { outline: none; min-height: 1200px; line-height: 1.8; font-size: 16px; text-align: justify; }

        /* VIEWERS */
        .viewer { width: 0; background: #334155; display: flex; flex-direction: column; overflow: hidden; border-left: 0 solid var(--gold); transition: width 0.4s ease; }
        .viewer.active { width: 50%; border-left: 3px solid var(--gold); }
        iframe { flex: 1; border: none; background: white; }

        /* MODAIS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 92%; max-width: 600px; padding: 30px; border-radius: 20px; color: #0f172a; max-height: 85vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ddd; background: #f8fafc; font-weight: 800; cursor: pointer; text-align: left; color: var(--primary); }
        .opt-btn:hover { background: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:900;">JOAQUIM <span style="color:var(--gold)">ELITE</span> 2026</div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold);">00:00:00</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="SALVAR / ATUALIZAR" style="background:var(--sucesso);" onclick="window.modalSalvar()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="ABRIR GAVETAS" onclick="window.abrirGavetas()"><i class="fas fa-folder-open"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="btn-side" data-label="INJETAR PROVA INTEGRAL" style="background:var(--info);" onclick="window.abrirModalInjecao()"><i class="fas fa-file-signature"></i></button>
        <button class="btn-side" data-label="NÚCLEO DURO (LEIS)" style="background:var(--juris);" onclick="window.abrirNucleoDuro()"><i class="fas fa-balance-scale"></i></button>
        <button class="btn-side" data-label="GABARITOS" onclick="window.abrirModal('PDF2')"><i class="fas fa-spell-check"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="btn-side" data-label="DUAL VIEW" onclick="window.toggleDualPDF()"><i class="fas fa-columns"></i></button>
        <button class="btn-side" data-label="MODO ESCRITA" onclick="window.resetView()"><i class="fas fa-pen-fancy"></i></button>
        
        <button class="btn-side" data-label="LIMPAR TELA" style="background:var(--perigo); margin-top:auto" onclick="window.limpar()"><i class="fas fa-eraser"></i></button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container" id="container-folha">
            <div class="sticky-header">
                <i class="fas fa-edit"></i> <span id="txt-titulo-topo">FOLHA DE RESPOSTAS - MPU ELITE</span>
            </div>
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p style="text-align: center;"><b>AMBIENTE SIMULADO - ANALISTA MPU</b></p>
                    <hr style="margin: 20px 0;">
                    <p><i>Clique no ícone de "Folha com Caneta" na barra lateral para injetar a prova completa...</i></p>
                </div>
            </div>
        </section>

        <section class="viewer" id="viewer-1">
            <iframe id="frame-1" src=""></iframe>
        </section>
        <section class="viewer" id="viewer-2">
            <iframe id="frame-2" src=""></iframe>
        </section>
    </div>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--gold); padding-bottom:10px;"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; margin-top:20px; padding:15px; background:black; color:white; border-radius:10px; cursor:pointer;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- NÚCLEO DURO ANALISTA MPU ---
    const NUCLEO_DURO = [
        { n: "Constituição Federal (MP/ADM)", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" },
        { n: "LC 75/93 (Estatuto do MPU)", u: "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm" },
        { n: "Lei 8.112/90 (Servidores)", u: "https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm" },
        { n: "Lei 8.429/92 (Improbidade)", u: "https://www.planalto.gov.br/ccivil_03/leis/l8429.htm" },
        { n: "Lei 9.784/99 (Processo ADM)", u: "https://www.planalto.gov.br/ccivil_03/leis/l9784.htm" }
    ];

    // --- PROVA INTEGRAL (TEXTO PARA INJEÇÃO) ---
    const PROVAS_INTEGRAIS = [
        {
            id: "MPU_2025_DISCURSIVA",
            titulo: "PROVA DISCURSIVA - ANALISTA MPU 2025",
            conteudo: `
                <div style="border: 2px solid #000; padding: 20px; margin-bottom: 30px;">
                    <h2 style="text-align:center;">CADERNO DE PROVA DISCURSIVA</h2>
                    <p><b>TEXTO MOTIVADOR:</b> O Ministério Público é instituição permanente, essencial à função jurisdicional do Estado, incumbindo-lhe a defesa da ordem jurídica, do regime democrático e dos interesses sociais e individuais indisponíveis.</p>
                    <hr>
                    <p><b>QUESTÃO 1:</b> Discorra sobre a legitimidade do MPU para ajuizamento de Ação Civil Pública em face de ente federado que descumpre normas de saúde pública. Aborde necessariamente: 1. Competência da Justiça Federal; 2. Prerrogativas de Intimação Pessoal; 3. Prazos Processuais diferenciados.</p>
                    <br>
                    <p><b>QUESTÃO 2:</b> Analise o regime jurídico da Lei 8.112/90 no que tange ao processo administrativo disciplinar (PAD), especificamente sobre a prescrição da pretensão punitiva administrativa.</p>
                </div>
                <p style="text-align:center; background: #eee;"><b>--- INÍCIO DA FOLHA DE RESPOSTAS ---</b></p>
                <p><br></p>
            `
        }
    ];

    window.abrirModalInjecao = () => {
        const c = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "INJETAR PROVA INTEGRAL";
        c.innerHTML = PROVAS_INTEGRAIS.map((p, i) => `
            <button class="opt-btn" onclick="window.injetarProva(${i})">
                <i class="fas fa-file-alt"></i> ${p.titulo}
            </button>
        `).join('');
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.injetarProva = (idx) => {
        const p = PROVAS_INTEGRAIS[idx];
        document.getElementById('folha-total').innerHTML = p.conteudo;
        document.getElementById('txt-titulo-topo').innerText = p.titulo;
        document.getElementById('modal-base').style.display = 'none';
        alert("PROVA INTEGRAL INJETADA! Agora você pode editar o enunciado e responder.");
    };

    window.abrirNucleoDuro = () => {
        const c = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "NÚCLEO DURO - LEGISLAÇÃO";
        c.innerHTML = NUCLEO_DURO.map(l => `
            <button class="opt-btn" onclick="window.carregarPDF('${l.u}', '${l.n}', 'PDF2')">
                <i class="fas fa-gavel"></i> ${l.n}
            </button>
        `).join('');
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.carregarPDF = (url, nome, alvo) => {
        const frame = alvo === 'PDF1' ? 'frame-1' : 'frame-2';
        const viewer = alvo === 'PDF1' ? 'viewer-1' : 'viewer-2';
        document.getElementById(frame).src = url;
        document.getElementById(viewer).classList.add('active');
        document.getElementById('modal-base').style.display = 'none';
    };

    window.toggleDualPDF = () => {
        document.getElementById('viewer-1').classList.add('active');
        document.getElementById('viewer-2').classList.add('active');
        document.getElementById('container-folha').style.display = 'none';
    };

    window.resetView = () => {
        document.getElementById('container-folha').style.display = 'flex';
        document.getElementById('viewer-1').classList.remove('active');
        document.getElementById('viewer-2').classList.remove('active');
    };

    window.limpar = () => confirm("Limpar tudo?") && (document.getElementById('folha-total').innerHTML = "");

    window.modalSalvar = () => {
        const nome = prompt("Nome do arquivo:", document.getElementById('txt-titulo-topo').innerText);
        if(nome) window.saveFirebase(nome);
    };

    window.saveFirebase = async (nome) => {
        const html = document.getElementById('folha-total').innerHTML;
        await set(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/PECAS/${Date.now()}`), { nome, conteudo: html, data: new Date().toLocaleString() });
        alert("Salvo!");
    };

    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
