<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA JOAQUIM - SIMULADOR MPU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --bg-paper: #cbd5e1; 
            --sidebar-w: 75px; --fgv-blue: #004a8d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--primary); height: 100vh; display: flex; overflow: hidden; }
        
        /* Menu Lateral */
        .sidebar { width: var(--sidebar-w); background: #1e293b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 2px solid var(--gold); }
        .btn-side { width: 50px; height: 50px; border-radius: 12px; border: none; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.3s; background: rgba(255,255,255,0.05); color: white; }
        .btn-side:hover { background: var(--gold); color: black; }

        /* Área da Prova */
        .main-content { flex: 1; background: var(--bg-paper); overflow-y: auto; padding: 40px; display: flex; justify-content: center; }
        .paper-simulation { 
            width: 100%; max-width: 900px; background: white; min-height: 1500px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 60px; position: relative;
            color: #1a1a1a; line-height: 1.6;
        }
        
        /* Cabeçalho Estilo FGV */
        .header-fgv { border: 2px solid #000; padding: 20px; margin-bottom: 40px; text-align: center; }
        .header-fgv h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        .header-fgv h2 { font-size: 1.1rem; border-top: 1px solid #000; padding-top: 5px; margin-top: 5px; }

        /* Questões */
        .questao { margin-bottom: 30px; padding: 15px; border-radius: 5px; transition: 0.2s; border-left: 4px solid transparent; }
        .questao:hover { background: #f8fafc; border-left: 4px solid var(--fgv-blue); }
        .numero { font-weight: bold; font-size: 1.1rem; color: var(--fgv-blue); margin-right: 10px; }
        .opcoes { margin-top: 10px; list-style: none; }
        .opcoes li { margin-bottom: 8px; padding: 8px; border: 1px solid #eee; border-radius: 4px; cursor: pointer; }
        .opcoes li:hover { background: #e2e8f0; }
        
        /* Bloco de Redação */
        .redacao-box { margin-top: 50px; border-top: 3px double #000; padding-top: 30px; }
        .folha-linhas { width: 100%; height: 400px; background-image: linear-gradient(#eee 1px, transparent 1px); background-size: 100% 30px; line-height: 30px; padding: 0 10px; border: 1px solid #ccc; outline: none; }

        /* Floating Info */
        .status-bar { position: fixed; bottom: 20px; right: 20px; background: black; color: var(--gold); padding: 10px 20px; border-radius: 30px; font-weight: bold; border: 1px solid var(--gold); }
    </style>
</head>
<body>

<aside class="sidebar">
    <button class="btn-side" title="Carregar Prova do PDF" onclick="window.injetarConteudo()"><i class="fas fa-file-import"></i></button>
    <button class="btn-side" title="Salvar em PDF" onclick="window.salvar()"><i class="fas fa-save"></i></button>
    <button class="btn-side" title="Estrutura de Peças" onclick="window.abrirPergaminho()"><i class="fas fa-scroll"></i></button>
    <button class="btn-side" title="Limpar" style="margin-top:auto; background: #7f1d1d" onclick="location.reload()"><i class="fas fa-trash"></i></button>
</aside>

<main class="main-content">
    <div class="paper-simulation">
        <div class="header-fgv">
            <h1>Ministério Público da União</h1>
            <h2>Analista do MPU - Direito | Tipo 1 - Branca</h2>
        </div>

        <div id="area-da-prova">
            <p style="text-align:center; color:#666; font-style:italic;">Clique no botão de importação para carregar o conteúdo do PDF na folha de treino...</p>
        </div>

        <div class="redacao-box">
            <h3 style="margin-bottom:15px; text-transform:uppercase;">Prova Discursiva - Redação</h3>
            <div class="folha-linhas" contenteditable="true"></div>
        </div>
    </div>
</main>

<div class="status-bar" id="relogio">00:00:00</div>

<script>
    // Função para simular a injeção do seu PDF diretamente na folha
    window.injetarConteudo = () => {
        const area = document.getElementById('area-da-prova');
        
        // Aqui o sistema mapeia o seu PDF (AnalistaMPU.pdf) e converte para o HTML da folha
        area.innerHTML = `
            <div class="questao">
                <span class="numero">01</span>
                <p>O problema em matéria de audição vem do fato de que o cérebro é um órgão muito rápido e que se pensa muito mais depressa do que se fala... [cite: 41]</p>
                <ul class="opcoes">
                    <li>(A) indicar a estruturação do texto no início da leitura;</li>
                    <li>(B) acrescentar exemplos práticos ao texto;</li>
                    <li>(C) reformular as informações já dadas;</li>
                    <li>(D) utilizar sinônimos mais comuns para termos difíceis;</li>
                    <li>(E) repetir informações com os mesmos termos.</li>
                </ul>
            </div>

            <div class="questao">
                <span class="numero">16</span>
                <p>Em relação aos princípios, normas e regras estabelecidos no Art. 225 da Constituição Federal sobre Meio Ambiente, é correto afirmar que: [cite: 182]</p>
                <ul class="opcoes">
                    <li>(A) será inferior à dos combustíveis fósseis o regime fiscal para biocombustíveis...</li>
                    <li>(B) são consideradas cruéis as práticas desportivas que utilizem animais...</li>
                    <li>(C) são patrimônio nacional os biomas da floresta amazônica, mata atlântica e caatinga...</li>
                    <li>(D) incumbe ao poder público o manejo ecológico das espécies endêmicas...</li>
                    <li>(E) incumbe ao poder público definir os espaços territoriais especialmente protegidos...</li>
                </ul>
            </div>

            <div style="background:#fff9c4; padding:15px; border:1px dashed #fbc02d; margin:20px 0;">
                <strong>DICA MENTORIA:</strong> Não confunda as competências do CNMP com as do CNJ. [cite: 248]
            </div>
        `;
        alert("Conteúdo do PDF AnalistaMPU injetado com sucesso na folha de treino!");
    };

    window.salvar = () => {
        alert("Salvando PDF no histórico do Mentoria...");
        // Lógica de salvamento em PDF conforme solicitado
    };

    // Relógio em tempo real
    setInterval(() => {
        document.getElementById('relogio').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
