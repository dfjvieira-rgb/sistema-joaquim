<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MODO SIMULADO</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --juris: #4338ca;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: var(--primary); height: 55px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000; 
        }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 12px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .btn-side { 
            width: 48px; height: 48px; border: none; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); transform: scale(1.05); }
        .btn-side i { font-size: 1.2rem; color: var(--gold); }

        .btn-side::after {
            content: attr(data-label); position: absolute; left: 65px; background: #000; 
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 10px; 
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000;
            border: 1px solid var(--gold); font-weight: bold;
        }
        .btn-side:hover::after { opacity: 1; }

        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }

        .editor-container { 
            flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); 
            overflow-y: auto; align-items: center; padding: 25px;
        }
        .editor-container.hidden { display: none; }

        .sticky-header {
            width: 100%; max-width: 850px; background: #f8fafc; padding: 15px;
            border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0;
            color: #020617; font-weight: 900; text-align: center;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .paper { 
            width: 100%; max-width: 850px; background: white; min-height: 1200px; 
            padding: 60px; color: #1e293b; box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        #folha-total { outline: none; min-height: 1000px; line-height: 1.8; font-size: 16px; text-align: justify; }

        .viewer { 
            width: 0; background: #334155; display: flex; flex-direction: column; 
            overflow: hidden; border-left: 0 solid var(--gold); transition: width 0.4s ease;
        }
        .viewer.active { width: 50%; border-left: 3px solid var(--gold); }

        .pdf-header { background: #0f172a; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: white; }
        .pdf-header button { background: var(--gold); border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: 900; }

        iframe { flex: 1; border: none; background: white; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 92%; max-width: 500px; padding: 30px; border-radius: 20px; color: #0f172a; max-height: 85vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--primary); }
        .opt-btn:hover { background: var(--gold); }
        
        .btn-inject { background: #dcfce7 !important; border: 2px solid #166534 !important; }

        .folder-tag { font-size: 9px; background: var(--primary); color: white; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:900; letter-spacing: 1px;">JOAQUIM <span style="color:var(--gold)">ELITE</span> 2026</div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold);">00:00:00</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="SALVAR / ATUALIZAR" style="background:var(--sucesso);" onclick="window.modalSalvar()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="ABRIR GAVETAS" onclick="window.abrirGavetas()"><i class="fas fa-folder-open"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="btn-side" data-label="BIBLIOTECA (SIMULADO)" style="background:var(--info);" onclick="window.abrirModal('PDF1')"><i class="fas fa-file-pdf"></i></button>
        <button class="btn-side" data-label="GABARITOS (DIREITA)" style="background:var(--juris);" onclick="window.abrirModal('PDF2')"><i class="fas fa-spell-check"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="btn-side" data-label="LIMPAR TELA" style="background:var(--perigo); margin-top:auto" onclick="window.limpar()"><i class="fas fa-eraser"></i></button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container" id="container-folha">
            <div class="sticky-header">
                <i class="fas fa-edit"></i> <span id="txt-titulo-topo">AMBIENTE SIMULADO - EDITÁVEL</span>
            </div>
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p style="text-align: center;"><b>FOLHA DE RESPOSTAS E ENUNCIADO EDITÁVEL</b></p>
                    <hr style="margin: 20px 0;">
                    <div id="area-enunciado" style="background: #f1f5f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 5px solid var(--gold);">
                        <i>Selecione uma prova na biblioteca para injetar o texto aqui e começar a responder...</i>
                    </div>
                    <div id="area-resposta">
                        <p><b>RESPOSTA:</b></p>
                        <p>Escreva aqui sua tese...</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="viewer" id="viewer-1">
            <div class="pdf-header"><span id="title-1">VISUALIZADOR 1</span><button onclick="window.fecharV(1)">X</button></div>
            <iframe id="frame-1" src=""></iframe>
        </section>

        <section class="viewer" id="viewer-2">
            <div class="pdf-header"><span id="title-2">VISUALIZADOR 2</span><button onclick="window.fecharV(2)">X</button></div>
            <iframe id="frame-2" src=""></iframe>
        </section>
    </div>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--gold); padding-bottom:10px;"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; margin-top:20px; padding:15px; background:black; color:white; border-radius:10px; cursor:pointer;">VOLTAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const PASTAS = ["PECAS", "TESES", "PRELIMINARES", "QUESTOES"];
    
    // Simulação de banco de dados de textos de provas (Enunciados convertidos)
    const BIBLIOTECA_SIMULADA = [
        { 
            n: "PROVA MPU 2025 - ANALISTA", 
            u: "AnalistaMPU.pdf",
            texto: "<h3>QUESTÃO 1</h3><p>O Ministério Público da União ajuizou ação civil pública... [TEXTO DA PROVA CONVERTIDO]</p>"
        },
        { 
            n: "OAB EXAME 42 - PEÇA", 
            u: "Exame42.pdf",
            texto: "<h3>ENUNCIADO DA PEÇA</h3><p>João da Silva, empregado da empresa X, foi demitido... [TEXTO DA PEÇA CONVERTIDO]</p>"
        }
    ];

    let alvoPDF = "";

    window.modalSalvar = () => {
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "SALVAR SIMULADO";
        content.innerHTML = `
            <input type="text" id="save-name" placeholder="NOME DO SIMULADO" value="${document.getElementById('txt-titulo-topo').innerText}" style="width:100%; padding:15px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc; font-weight:bold;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                ${PASTAS.map(p => `<button class="opt-btn" onclick="window.verificarEExecutarSalvar('${p}')">${p}</button>`).join('')}
            </div>
        `;
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.verificarEExecutarSalvar = async (pasta) => {
        const nome = document.getElementById('save-name').value.toUpperCase();
        const html = document.getElementById('folha-total').innerHTML;
        const caminho = `SISTEMA_MPU_ELITE/GAVETAS/${pasta}`;
        const novoId = Date.now();
        await set(ref(db, `${caminho}/${novoId}`), { nome, conteudo: html, data: new Date().toLocaleString() });
        alert(`Simulado Salvo em ${pasta}!`);
        document.getElementById('modal-base').style.display = 'none';
    };

    window.abrirModal = (alvo) => {
        alvoPDF = alvo;
        document.getElementById('modal-title').innerText = "ESCOLHER PROVA";
        let html = BIBLIOTECA_SIMULADA.map((p, index) => `
            <div style="margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                <p style="font-weight:bold; margin-bottom:5px;">${p.n}</p>
                <div style="display:flex; gap:5px;">
                    <button class="opt-btn" style="font-size:11px;" onclick="window.carregarPDF('${p.u}', '${p.n}')">APENAS VER PDF</button>
                    <button class="opt-btn btn-inject" style="font-size:11px;" onclick="window.injetarProva(${index})">INJETAR E EDITAR</button>
                </div>
            </div>
        `).join('');
        document.getElementById('modal-content').innerHTML = html;
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.injetarProva = (index) => {
        const prova = BIBLIOTECA_SIMULADA[index];
        document.getElementById('area-enunciado').innerHTML = prova.texto;
        document.getElementById('txt-titulo-topo').innerText = "SIMULANDO: " + prova.n;
        window.resetView(); // Garante que a folha apareça
        document.getElementById('modal-base').style.display = 'none';
        alert("Enunciado injetado! Você pode editar o texto da prova e responder abaixo.");
    };

    window.carregarPDF = (u, n) => {
        const frame = alvoPDF === 'PDF1' ? 'frame-1' : 'frame-2';
        const viewer = alvoPDF === 'PDF1' ? 'viewer-1' : 'viewer-2';
        document.getElementById(frame).src = u;
        document.getElementById(`title-${alvoPDF === 'PDF1' ? '1' : '2'}`).innerText = n;
        document.getElementById(viewer).classList.add('active');
        document.getElementById('modal-base').style.display = 'none';
    };

    window.resetView = () => {
        document.getElementById('container-folha').classList.remove('hidden');
        document.getElementById('viewer-1').classList.remove('active');
        document.getElementById('viewer-2').classList.remove('active');
    };

    window.fecharV = (n) => {
        document.getElementById(`viewer-${n}`).classList.remove('active');
    };

    window.limpar = () => confirm("Limpar simulado?") && (document.getElementById('area-enunciado').innerHTML = "<i>Aguardando enunciado...</i>");
    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
