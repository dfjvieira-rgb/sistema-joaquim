<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MPU MASTER</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --bg-paper: #cbd5e1;
            --sidebar-w: 75px; --perigo: #ef4444; --questoes: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }

        header { background: var(--primary); height: 50px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { width: var(--sidebar-w); background: #1e293b; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; border-right: 1px solid rgba(255,255,255,0.1); }

        .btn-side { width: 60px; height: 60px; border: none; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; cursor: pointer; background: rgba(255,255,255,0.05); gap: 4px; }
        .btn-side i { font-size: 1.2rem; color: var(--gold); }
        .btn-side span { font-size: 8px; font-weight: bold; text-transform: uppercase; }

        /* DIVISÃO 50/50 */
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; transition: 0.3s; }
        .editor-container.split { flex: 0.5; }

        .sticky-tools { position: sticky; top: 0; z-index: 1000; background: white; width: 100%; border-bottom: 2px solid var(--gold); }
        #identificador-peca { padding: 10px; text-align: center; font-weight: 900; color: #0f172a; border-bottom: 1px solid #ddd; }
        
        .toolbar { display: flex; background: #fff; padding: 5px; gap: 5px; align-items: center; justify-content: center; }
        .btn-lib { padding: 8px 12px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 11px; }

        .color-dot { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; border: 1px solid #000; }

        .paper { width: 100%; max-width: 800px; background: white; min-height: 2000px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        #pdf-viewer { width: 0; background: #334155; transition: 0.3s; display: flex; flex-direction: column; border-left: 0 solid var(--gold); }
        #pdf-viewer.active { width: 50%; border-left-width: 4px; }
        
        .pdf-bar { background: #0f172a; padding: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: bold; }
        iframe { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900">JOAQUIM ELITE 2026</div>
    <div id="status-bar" style="font-size:10px; color:var(--gold)">PRONTO</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" onclick="window.verPDF('LP')"><i class="fas fa-book"></i><span>LC 75</span></button>
        <button class="btn-side" onclick="window.verPDF('LM')"><i class="fas fa-shield-alt"></i><span>LIA</span></button>
        <button class="btn-side" onclick="window.verPDF('V')"><i class="fas fa-balance-scale"></i><span>VADE</span></button>
        <hr style="width:70%; opacity:0.2">
        <button class="btn-side" onclick="window.limparFolha()"><i class="fas fa-eraser"></i><span>LIMPAR</span></button>
        <button class="btn-side" style="background:var(--perigo)" onclick="window.finalizarPeca()"><i class="fas fa-save"></i><span>SALVAR</span></button>
    </aside>

    <section class="editor-container" id="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca">NOVO TREINO MPU</div>
            <div class="toolbar">
                <button class="btn-lib" onclick="document.execCommand('undo')"><i class="fas fa-undo"></i></button>
                <button class="btn-lib" id="btn-highlight" onclick="window.toggleMarcaTexto()"><i class="fas fa-highlighter"></i></button>
                <div class="color-dot" style="background:#fef08a;" onclick="window.setHighlightColor('#fef08a')"></div>
                <div class="color-dot" style="background:#bbf7d0;" onclick="window.setHighlightColor('#bbf7d0')"></div>
                <div class="color-dot" style="background:#bfdbfe;" onclick="window.setHighlightColor('#bfdbfe')"></div>
                <button class="btn-lib" onclick="window.toggleFullPDF()">TELA CHEIA</button>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total"></div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-bar">
            <span id="pdf-title">DOCUMENTO</span>
            <button onclick="window.fecharPDF()" style="background:var(--perigo); border:none; color:white; padding:4px 8px; cursor:pointer">FECHAR X</button>
        </div>
        <iframe id="pdf-frame" src=""></iframe>
    </section>
</main>

<script type="module">
    import { db } from './firebase-config.js';
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { FolhaEngine } from './folha-engine.js';

    // Globais para garantir que os botões funcionem
    window.marcaTextoAtivo = false;
    window.currentColor = '#fef08a';

    window.onload = () => {
        // Inicializa a FolhaEngine (Verifique se o arquivo folha-engine.js está na mesma pasta)
        if(typeof FolhaEngine !== 'undefined') {
            FolhaEngine.montar('folha-total');
        }

        // Lógica de Marca-Texto
        document.addEventListener('mouseup', () => {
            if(window.marcaTextoAtivo) {
                const sel = window.getSelection();
                if(sel.toString().length > 0) {
                    document.execCommand('backColor', false, window.currentColor);
                }
            }
        });
    };

    // FUNÇÕES DE PDF CORRIGIDAS
    window.verPDF = (tipo) => {
        const viewer = document.getElementById('pdf-viewer');
        const frame = document.getElementById('pdf-frame');
        const container = document.getElementById('editor-container');
        let arquivo = "";

        if(tipo === 'LP') arquivo = "lc75.pdf";
        else if(tipo === 'LM') arquivo = "lei_improbidade.pdf";
        else if(tipo === 'V') arquivo = "vade_mpu.pdf";

        // O segredo está em garantir o caminho relativo correto
        const path = `./pdfs/${arquivo}`;
        
        frame.src = path;
        document.getElementById('pdf-title').innerText = arquivo.toUpperCase();
        
        viewer.classList.add('active');
        container.classList.add('split');
    };

    window.fecharPDF = () => {
        document.getElementById('pdf-viewer').classList.remove('active');
        document.getElementById('editor-container').classList.remove('split');
        document.getElementById('pdf-frame').src = "";
    };

    window.toggleFullPDF = () => {
        const viewer = document.getElementById('pdf-viewer');
        if(viewer.style.width === "100%") {
            viewer.style.width = "50%";
        } else {
            viewer.style.width = "100%";
        }
    };

    window.setHighlightColor = (cor) => {
        window.currentColor = cor;
        window.marcaTextoAtivo = true;
        document.getElementById('btn-highlight').style.background = cor;
    };

    window.toggleMarcaTexto = () => {
        window.marcaTextoAtivo = !window.marcaTextoAtivo;
        document.getElementById('btn-highlight').style.background = window.marcaTextoAtivo ? window.currentColor : "#fff";
    };

    window.limparFolha = () => {
        if(confirm("Deseja apagar toda a folha?")) {
            const ed = document.getElementById('editor-principal');
            if(ed) ed.innerHTML = "";
        }
    };

    window.finalizarPeca = async () => {
        const ed = document.getElementById('editor-principal');
        if(!ed) return;
        try {
            await set(ref(db, `SISTEMA_MPU/RASCUNHO`), { conteudo: ed.innerHTML, data: new Date().toISOString() });
            alert("Estudo salvo com sucesso!");
        } catch (e) {
            alert("Erro ao salvar no Firebase.");
        }
    };
</script>
</body>
</html>
