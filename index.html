<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MPU MASTER</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --paper-color: #ffffff; 
            --mentoria: #a855f7; --sidebar-w: 75px; --perigo: #ef4444;
            --questoes: #3b82f6; --teses: #f97316; --biblioteca: #475569;
        }

        body.dark-mode { --bg-paper: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }

        header { background: var(--primary); height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); z-index: 5000; }
        .logo { font-size: 1.2rem; font-weight: 900; }
        .logo span { color: var(--gold); }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR AJUSTADA */
        .sidebar { width: var(--sidebar-w); background: #1e293b; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; }

        .btn-side { width: 55px; min-height: 55px; border: none; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.05); position: relative; gap: 4px; }
        .btn-side:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .btn-side i { font-size: 1.1rem; color: var(--gold); }
        .btn-side span.label-icon { font-size: 8px; font-weight: bold; text-transform: uppercase; color: #fff; text-align: center; }

        /* EDITOR E TELA 50/50 */
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px; transition: 0.4s; }
        .editor-container.collapsed { flex: 1; max-width: 50%; }

        .sticky-tools { position: sticky; top: -20px; z-index: 1000; background: white; width: 100%; max-width: 850px; border-radius: 0 0 12px 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 10px; }
        #identificador-peca { padding: 12px; background: #f8fafc; text-align: center; font-weight: 900; color: #0f172a; border-bottom: 3px solid var(--gold); cursor: pointer; }
        
        .toolbar-liberdade { display: flex; background: #fff; flex-wrap: wrap; align-items: center; }
        .btn-lib { flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; font-weight: 800; font-size: 0.7rem; color: #64748b; border-right: 1px solid #f1f5f9; }

        .highlight-box { display: flex; align-items: center; background: #f1f5f9; padding: 0 10px; gap: 8px; height: 45px; }
        .color-dot { width: 18px; height: 18px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }
        .color-dot.active { border: 2px solid #000; transform: scale(1.2); }

        .paper { width: 100%; max-width: 850px; background: white; box-shadow: 0 20px 50px rgba(0,0,0,0.4); min-height: 5250px; position: relative; }

        /* PDF VIEWER FIXO 50/50 */
        #pdf-viewer { width: 0; background: #334155; transition: 0.4s; display: flex; flex-direction: column; overflow: hidden; }
        #pdf-viewer.active { width: 50%; border-left: 4px solid var(--gold); }
        #pdf-viewer.full-view { width: 100% !important; position: absolute; left:0; top:0; z-index: 8000; height: 100%; }

        .pdf-controls { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; color: white; font-weight: 900; font-size: 11px; align-items: center; }
        iframe { width: 100%; flex: 1; border: none; background: white; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 95%; max-width: 450px; padding: 25px; border-radius: 20px; color: #0f172a; }
        .opt-btn { width: 100%; padding: 15px; margin-bottom: 8px; border-radius: 10px; border: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer; font-weight: bold; align-items: center; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo">JOAQUIM <span>ELITE MPU</span></div>
    <div style="color:var(--gold); font-size:10px; font-weight:bold;">MODO: <span id="ex-display">--</span></div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" style="background:var(--gold); color:#000" onclick="window.abrirExames()">
            <i class="fas fa-university"></i>
            <span class="label-icon">PROVAS</span>
        </button>
        <button class="btn-side" style="background:#facc15; color:#000" onclick="window.ativarTreinoLivre()">
            <i class="fas fa-edit"></i>
            <span class="label-icon">PEÇAS</span>
        </button>
        <button class="btn-side" style="background:var(--questoes);" onclick="window.ativarModoQuestoes()">
            <i class="fas fa-question-circle"></i>
            <span class="label-icon">QUESTÕES</span>
        </button>
        <button class="btn-side" style="background:#334155;" onclick="window.gerenciadorPasta()">
            <i class="fas fa-archive"></i>
            <span class="label-icon">GAVETAS</span>
        </button>
        <hr style="width:70%; opacity:0.1; margin:5px 0">
        <button class="btn-side" style="background:#3b82f6;" onclick="window.verPDF('LP')">
            <i class="fas fa-book"></i>
            <span class="label-icon">LC 75</span>
        </button>
        <button class="btn-side" style="background:#10b981;" onclick="window.verPDF('LM')">
            <i class="fas fa-shield-alt"></i>
            <span class="label-icon">LIA</span>
        </button>
        <button class="btn-side" style="background:#000; border:1px solid var(--gold)" onclick="window.verPDF('V')">
            <i class="fas fa-balance-scale"></i>
            <span class="label-icon">VADE</span>
        </button>
        <hr style="width:70%; opacity:0.1; margin:5px 0">
        <button class="btn-side" style="background:var(--perigo);" onclick="window.finalizarPeca()">
            <i class="fas fa-save"></i>
            <span class="label-icon">SALVAR</span>
        </button>
    </aside>

    <section class="editor-container" id="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomearTreino()">INICIAR...</div>
            <div class="toolbar-liberdade">
                <button class="btn-lib" onclick="window.desfazer()"><i class="fas fa-undo"></i></button>
                <div class="highlight-box">
                    <button class="btn-lib" id="btn-highlight" onclick="window.toggleMarcaTexto()" style="border:none; flex:none;"><i class="fas fa-highlighter"></i></button>
                    <div class="color-dot active" id="dot-yellow" style="background:#fef08a;" onclick="window.setHighlightColor('#fef08a', 'dot-yellow')"></div>
                    <div class="color-dot" id="dot-green" style="background:#bbf7d0;" onclick="window.setHighlightColor('#bbf7d0', 'dot-green')"></div>
                    <div class="color-dot" id="dot-orange" style="background:#fed7aa;" onclick="window.setHighlightColor('#fed7aa', 'dot-orange')"></div>
                    <div class="color-dot" id="dot-blue" style="background:#bfdbfe;" onclick="window.setHighlightColor('#bfdbfe', 'dot-blue')"></div>
                </div>
                <button class="btn-lib" onclick="window.limparFolha()"><i class="fas fa-trash"></i></button>
                <button class="btn-lib" onclick="window.toggleModoCheio()"><i class="fas fa-expand"></i> FOCO PDF</button>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total"></div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-controls">
            <div><button onclick="window.toggleModoCheio()" style="background:none; border:1px solid var(--gold); color:var(--gold); padding:4px 8px; cursor:pointer; font-size: 9px;">TELA CHEIA</button> <span id="pdf-title">DOCUMENTO</span></div>
            <button onclick="window.fecharPDF()" style="background:var(--gold); border:none; padding:4px 10px; font-weight:bold; cursor:pointer">FECHAR X</button>
        </div>
        <iframe id="pdf-frame"></iframe>
    </section>
</main>

<div class="modal" id="universal-modal">
    <div class="modal-body">
        <h2 id="modal-title" style="margin: 15px 0; border-bottom:2px solid var(--gold)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('universal-modal').style.display='none'" style="width:100%; padding:15px; background:#000; color:#fff; border-radius:10px; margin-top:15px; font-weight:bold; cursor:pointer;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { FolhaEngine } from './folha-engine.js';

    window.db = db;
    window.pecaAtualNome = localStorage.getItem('pecaAtualNome') || "NOVO ESTUDO";
    window.marcaTextoAtivo = false;
    window.currentColor = '#fef08a';

    window.onload = async () => {
        atualizarDisplayModo();
        FolhaEngine.montar('folha-total');
        
        setTimeout(() => {
            const ed = document.getElementById('editor-principal');
            if(ed) {
                ed.addEventListener('mouseup', () => {
                    if(window.marcaTextoAtivo) {
                        const sel = window.getSelection();
                        if (sel.toString().length > 0) document.execCommand('backColor', false, window.currentColor);
                    }
                });
            }
        }, 1000);
        await carregarRascunho();
    };

    // --- PDF ENGINE (CORREÇÃO DE CAMINHOS) ---
    window.verPDF = (t) => {
        const v = document.getElementById('pdf-viewer');
        const f = document.getElementById('pdf-frame');
        const container = document.getElementById('editor-container');
        let arq = "";
        
        // Caminhos exatos conforme solicitado
        if(t === 'LP') arq = "lc75.pdf";
        else if(t === 'LM') arq = "lei_improbidade.pdf";
        else if(t === 'V') arq = "vade_mpu.pdf";
        
        // Atribui o SRC garantindo a pasta pdfs/
        f.src = `./pdfs/${arq}`;
        document.getElementById('pdf-title').innerText = arq.toUpperCase();
        
        // Ativa a visão 50/50
        v.classList.add('active');
        container.classList.add('collapsed');
    };

    window.fecharPDF = () => {
        document.getElementById('pdf-viewer').classList.remove('active', 'full-view');
        document.getElementById('editor-container').classList.remove('collapsed');
        document.getElementById('pdf-frame').src = "";
    };

    window.toggleModoCheio = () => {
        document.getElementById('pdf-viewer').classList.toggle('full-view');
    };

    // --- MARCA TEXTO ---
    window.setHighlightColor = (color, id) => {
        window.currentColor = color;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.toggleMarcaTexto(true);
    };

    window.toggleMarcaTexto = (forcar = null) => {
        window.marcaTextoAtivo = (forcar !== null) ? forcar : !window.marcaTextoAtivo;
        const btn = document.getElementById('btn-highlight');
        btn.style.background = window.marcaTextoAtivo ? window.currentColor : "transparent";
    };

    // --- AUXILIARES ---
    window.atualizarDisplayModo = () => {
        document.getElementById('identificador-peca').innerText = window.pecaAtualNome;
    };
    window.renomearTreino = () => { 
        const n = prompt("Nome do Estudo:", window.pecaAtualNome); 
        if(n) { window.pecaAtualNome = n; atualizarDisplayModo(); } 
    };
    window.desfazer = () => document.execCommand('undo');
    window.limparFolha = () => confirm("Limpar tudo?") && (document.getElementById('editor-principal').innerHTML = "");
    
    async function carregarRascunho() { 
        const snap = await get(ref(db, `SISTEMA_MPU/RASCUNHO`)); 
        if(snap.exists()) document.getElementById('editor-principal').innerHTML = snap.val().conteudo; 
    }
</script>
</body>
</html>
