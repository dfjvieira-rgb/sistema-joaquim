<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA LEGISLATIVO - SENADO FEDERAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* PALETA OFICIAL SENADO FEDERAL */
            --primary: #00274d; 
            --secondary: #1e3a8a;
            --accent: #e5e7eb; 
            --gold-senado: #c5a059; 
            --bg-paper: #f1f5f9; 
            --paper-color: #ffffff; 
            --sidebar-w: 260px;
            --perigo: #991b1b;
            --sucesso: #166534;
            --legislativo: #1e40af;
        }

        body.dark-mode { --bg-paper: #0f172a; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--primary); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            color: white;
        }

        header { 
            background: linear-gradient(90deg, var(--primary) 0%, #004080 100%); 
            height: 65px; 
            padding: 0 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--gold-senado); 
            z-index: 5000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--gold-senado); font-size: 1.5rem; }
        .logo span { color: var(--accent); font-weight: 300; }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* BARRA LATERAL */
        .sidebar { 
            width: var(--sidebar-w); 
            background: #001f3d; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            padding: 15px; 
            border-right: 1px solid rgba(255,255,255,0.1); 
            overflow-y: auto; 
        }

        .btn-side { 
            width: 100%; min-height: 45px; border: none; border-radius: 6px; 
            display: flex; align-items: center; padding: 0 15px; color: white; 
            font-weight: 600; cursor: pointer; gap: 12px; font-size: 0.75rem; 
            text-transform: uppercase; transition: 0.2s; background: rgba(255,255,255,0.05);
            border-left: 3px solid transparent;
        }
        .btn-side:hover { background: rgba(255,255,255,0.12); border-left-color: var(--gold-senado); }
        .btn-side i { width: 18px; font-size: 0.9rem; color: var(--gold-senado); }

        /* ÁREA DO EDITOR */
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .editor-container.collapsed { flex: 0.2; opacity: 0.4; pointer-events: none; }

        .sticky-tools { 
            position: sticky; top: -20px; z-index: 1000; background: #ffffff; 
            width: 100%; max-width: 900px; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        #identificador-peca { 
            padding: 14px; background: #f8fafc; text-align: left; padding-left: 20px;
            font-weight: 800; color: var(--primary); border-bottom: 2px solid #e2e8f0;
            cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
        }

        .paper { 
            width: 100%; max-width: 900px; background: white; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            min-height: 29.7cm; position: relative; padding: 40px !important;
        }

        /* VISUALIZADOR DE PDF / LEGISLAÇÃO */
        #pdf-viewer { width: 0; background: #1e293b; transition: 0.4s; display: flex; flex-direction: column; overflow: hidden; }
        #pdf-viewer.active { width: 50%; border-left: 4px solid var(--gold-senado); }
        #pdf-viewer iframe { flex: 1; border: none; background: white; }

        .pdf-controls { 
            background: var(--primary); padding: 12px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* MODAIS */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,39,77,0.9); 
            z-index: 110000; align-items: center; justify-content: center; backdrop-filter: blur(4px); 
        }
        .modal-body { 
            background: white; width: 95%; max-width: 500px; padding: 30px; 
            border-radius: 12px; color: #0f172a; border-top: 8px solid var(--gold-senado); 
        }
        .opt-btn { 
            width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; 
            border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 700; 
            display: flex; justify-content: space-between; cursor: pointer; color: var(--primary); 
        }
        .opt-btn:hover { background: var(--primary); color: white; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            #pdf-viewer.active { width: 100%; position: absolute; z-index: 8000; height: 100%; }
        }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo"><i class="fas fa-landmark"></i> SENADO <span>FEDERAL</span></div>
    <div style="background: rgba(255,255,255,0.1); padding: 6px 15px; border-radius: 4px; font-size: 11px; font-weight: bold;">
        ÁREA TÉCNICA: <span id="ex-display" style="color:var(--gold-senado)">TRABALHO & PREVIDÊNCIA</span>
    </div>
</header>

<main>
    <aside class="sidebar" id="sidebar-main">
        <div style="font-size: 10px; color: var(--gold-senado); font-weight: 900; margin-bottom: 10px; opacity: 0.8; letter-spacing: 1px;">CONSULTORIA LEGISLATIVA</div>
        
        <button class="btn-side" style="background:var(--secondary);" onclick="window.abrirPergaminho()"><i class="fas fa-scroll"></i> MODELOS DE PARECER</button>
        <button class="btn-side" style="background:var(--legislativo);" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book"></i> ESTUDO EM TELA (LEIS)</button>
        <button class="btn-side" onclick="window.gerenciadorPasta()"><i class="fas fa-folder-open"></i> GAVETAS DE ARQUIVOS</button>
        
        <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.finalizarPeca()"><i class="fas fa-save"></i> FINALIZAR E SALVAR</button>
        <button class="btn-side" style="background:#334155;" onclick="window.limparFolha()"><i class="fas fa-eraser"></i> LIMPAR TELA</button>
    </aside>

    <section class="editor-container" id="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomearTreino()">
                <i class="fas fa-file-signature"></i> <span>CARREGANDO DOCUMENTO...</span>
            </div>
            <div style="padding: 8px; display: flex; gap: 10px; background: #fff; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                <button class="btn-side" style="color:var(--primary); width: auto; background: #f1f5f9;" onclick="window.toggleRecolherEditor()"><i class="fas fa-columns"></i> DIVIDIR TELA</button>
                <button class="btn-side" style="color:var(--primary); width: auto; background: #f1f5f9;" onclick="window.print()"><i class="fas fa-print"></i> EXPORTAR PDF</button>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total"></div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-controls">
            <span id="pdf-title" style="color:white; font-size:11px; font-weight:800; text-transform: uppercase;">REFERÊNCIA TÉCNICA</span>
            <button onclick="window.fecharPDF()" style="background:var(--gold-senado); border:none; padding:5px 12px; border-radius:4px; font-weight:bold; cursor:pointer; color:var(--primary)">FECHAR X</button>
        </div>
        <iframe id="pdf-frame" src="about:blank"></iframe>
    </section>
</main>

<div class="modal" id="universal-modal">
    <div class="modal-body">
        <div id="modal-back-btn" style="display:none; margin-bottom:15px; cursor:pointer; font-weight:bold; color:var(--primary)" onclick="window.gerenciadorPasta()">← VOLTAR</div>
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--gold-senado); padding-bottom:10px; font-size:1.1rem; color:var(--primary)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('universal-modal').style.display='none'" style="width:100%; padding:15px; background:var(--primary); color:#fff; border-radius:8px; margin-top:15px; font-weight:bold; cursor:pointer; border:none;">CONCLUÍDO</button>
    </div>
</div>
<script type="module">
    import { db } from './firebase-config.js';
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { FolhaEngine } from './folha-engine.js';

    // ================================================================
    // CONFIGURAÇÃO BLINDADA: PROJETO SENADO FEDERAL
    // ================================================================
    const PROJETO_ID = "SISTEMA_SENADO_FEDERAL"; 
    
    // Chaves de memória exclusivas para o Senado (não chocam com a OAB)
    window.pecaAtualNome = localStorage.getItem('senado_peca_nome') || "NOVO PARECER TÉCNICO";

    // BIBLIOTECA VIVA (LINKS DIRETOS DO PLANALTO/SENADO)
    window.LISTA_PDF_BIBLIOTECA = [
        { nome: "REGIMENTO INTERNO (SENADO)", url: "https://legis.senado.leg.br/norma/561237/publicacao/15759100" },
        { nome: "CLT - CONSOLIDADA", url: "https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452.htm" },
        { nome: "CONSTITUIÇÃO FEDERAL", url: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" },
        { nome: "LEI 8.112/90 (ESTATUTO)", url: "https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm" },
        { nome: "MANUAL DE REDAÇÃO LEGISLATIVA", url: "https://www12.senado.leg.br/manualderedacao" }
    ];

    window.onload = async () => {
        // Inicializa o motor da folha
        FolhaEngine.montar('folha-total');
        
        // Atualiza Interface
        document.getElementById('identificador-peca').querySelector('span').innerText = window.pecaAtualNome;
        
        // Recupera último trabalho do Firebase
        await carregarRascunho();
        
        // Auto-save a cada 30 segundos
        setInterval(salvarAutomatico, 30000);
    };

    // --- FUNÇÃO PERGAMINHO: MODELOS PARA CONSULTOR ---
    window.abrirPergaminho = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📜 ESTRUTURAS: TRABALHO & PREV";
        
        content.innerHTML = `
            <div class="opt-btn" onclick="window.injetarEstrutura('PARECER_MÉRITO')"><span>PARECER DE MÉRITO (CLT)</span> <i class="fas fa-file-contract"></i></div>
            <div class="opt-btn" onclick="window.injetarEstrutura('PARECER_CONST')"><span>PARECER CONSTITUCIONALIDADE</span> <i class="fas fa-shield-alt"></i></div>
            <div class="opt-btn" onclick="window.injetarEstrutura('MINUTA_PL')"><span>MINUTA DE PROJETO DE LEI</span> <i class="fas fa-pen-nib"></i></div>
        `;
        modal.style.display = 'flex';
    };

    window.injetarEstrutura = (tipo) => {
        const ed = document.getElementById('editor-principal');
        let html = "";
        const ano = new Date().getFullYear();

        if(tipo === 'PARECER_MÉRITO') {
            html = `<h2>PARECER Nº ____, DE ${ano}</h2><p><strong>COMISSÃO DE ASSUNTOS SOCIAIS</strong></p><p><strong>I – RELATÓRIO:</strong> [Descreva a proposta de alteração trabalhista/previdenciária]</p><p><strong>II – ANÁLISE:</strong> [Avalie a conveniência, oportunidade e impacto social]</p><p><strong>III – VOTO:</strong> Pela Aprovação...</p>`;
        } else if(tipo === 'PARECER_CONST') {
            html = `<h2>PARECER Nº ____, DE ${ano} (CCJ)</h2><p><strong>ASSUNTO:</strong> Juridicidade e Constitucionalidade.</p><p><strong>ANÁLISE:</strong> A proposição não fere cláusulas pétreas...</p><p><strong>CONCLUSÃO:</strong> Voto pela constitucionalidade.</p>`;
        } else if(tipo === 'MINUTA_PL') {
            html = `<h2>PROJETO DE LEI Nº ____, DE ${ano}</h2><p><em>Altera a CLT para dispor sobre...</em></p><p>O CONGRESSO NACIONAL decreta:</p><p>Art. 1º ...</p><p><strong>JUSTIFICAÇÃO:</strong> [Argumentação técnica]</p>`;
        }

        ed.innerHTML = html;
        document.getElementById('universal-modal').style.display = 'none';
        salvarAutomatico();
    };

    // --- ESTUDO EM TELA (BIBLIOTECA) ---
    window.abrirBibliotecaPDF = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📚 ESTUDO EM TELA (DIVIDIDA)";
        content.innerHTML = "";
        
        window.LISTA_PDF_BIBLIOTECA.forEach(item => {
            const div = document.createElement('div');
            div.className = 'opt-btn';
            div.innerHTML = `<span>${item.nome}</span> <i class="fas fa-external-link-alt"></i>`;
            div.onclick = () => {
                document.getElementById('pdf-frame').src = item.url;
                document.getElementById('pdf-title').innerText = item.nome;
                document.getElementById('pdf-viewer').classList.add('active');
                document.getElementById('editor-container').classList.add('collapsed');
                modal.style.display = 'none';
            };
            content.appendChild(div);
        });
        modal.style.display = 'flex';
    };

    // --- GESTÃO DE ARQUIVOS (GAVETAS) ---
    window.finalizarPeca = async () => {
        const ed = document.getElementById('editor-principal');
        if(!ed) return;
        if(!confirm("Deseja salvar este Parecer na base do Senado?")) return;

        try {
            const id = Date.now().toString();
            await set(ref(db, `${PROJETO_ID}/HISTORICO/${id}`), {
                peca: `${window.pecaAtualNome} (${new Date().toLocaleDateString()})`,
                conteudo: ed.innerHTML
            });
            alert("✅ DOCUMENTO SALVO NAS GAVETAS DO SENADO!");
        } catch (e) { alert("Erro ao salvar no Firebase."); }
    };

    window.gerenciadorPasta = async () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📂 GAVETA DE ESTUDOS";
        content.innerHTML = "Buscando arquivos...";
        
        try {
            const snap = await get(ref(db, `${PROJETO_ID}/HISTORICO`));
            content.innerHTML = "";
            if (snap.exists()) {
                Object.keys(snap.val()).reverse().forEach(id => {
                    const item = snap.val()[id];
                    const div = document.createElement('div');
                    div.className = 'opt-btn';
                    div.innerHTML = `<span>${item.peca}</span>`;
                    div.onclick = () => {
                        document.getElementById('editor-principal').innerHTML = item.conteudo;
                        modal.style.display = 'none';
                    };
                    content.appendChild(div);
                });
            } else { content.innerHTML = "Nenhum parecer salvo."; }
        } catch (e) { content.innerHTML = "Erro ao carregar gaveta."; }
        modal.style.display = 'flex';
    };

    // --- UTILITÁRIOS ---
    window.toggleRecolherEditor = () => {
        document.getElementById('editor-container').classList.toggle('collapsed');
        document.getElementById('pdf-viewer').classList.toggle('active');
    };

    window.fecharPDF = () => {
        document.getElementById('pdf-viewer').classList.remove('active');
        document.getElementById('editor-container').classList.remove('collapsed');
        document.getElementById('pdf-frame').src = "about:blank";
    };

    window.renomearTreino = () => {
        const novo = prompt("Nome do Parecer/Estudo:", window.pecaAtualNome);
        if(novo) {
            window.pecaAtualNome = novo;
            localStorage.setItem('senado_peca_nome', novo);
            document.getElementById('identificador-peca').querySelector('span').innerText = novo;
        }
    };

    window.limparFolha = () => {
        if(confirm("Limpar toda a tela de estudo?")) {
            document.getElementById('editor-principal').innerHTML = "";
            salvarAutomatico();
        }
    };

    async function salvarAutomatico() {
        const ed = document.getElementById('editor-principal');
        if(ed) await set(ref(db, `${PROJETO_ID}/RASCUNHO_LIVE`), { conteudo: ed.innerHTML });
    }

    async function carregarRascunho() {
        const snap = await get(ref(db, `${PROJETO_ID}/RASCUNHO_LIVE`));
        if(snap.exists()) document.getElementById('editor-principal').innerHTML = snap.val().conteudo;
    }
</script>

<style>
    /* Ajustes finais de scroll e editor */
    #editor-principal { 
        outline: none; 
        min-height: 800px; 
        font-size: 16px; 
        line-height: 1.8; 
        color: #1a1a1a;
        text-align: justify;
    }
    #editor-principal h2 { color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid #eee; }
    .opt-btn span { flex: 1; }
</style>

</body>
</html>
