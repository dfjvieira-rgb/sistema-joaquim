<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA JURÍDICO | NÚCLEO DURO MPU v3</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --mpu-green: #006400; --mpu-blue: #003366; --mpu-gold: #d4af37;
            --bg-paper: #e2e8f0; --sidebar-w: 260px; --sucesso: #15803d; --perigo: #b91c1c;
            --juris: #7c3aed;
        }
        body.dark-mode { --bg-paper: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--mpu-blue); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: linear-gradient(90deg, var(--mpu-blue) 0%, var(--mpu-green) 100%); 
            height: 60px; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 4px solid var(--mpu-gold); z-index: 5000; 
        }
        
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { 
            width: var(--sidebar-w); background: #001a33; display: flex; flex-direction: column; gap: 8px; 
            padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; 
        }
        
        .btn-side { 
            width: 100%; min-height: 45px; border: none; border-radius: 4px; 
            display: flex; align-items: center; padding: 0 15px; 
            color: white; font-weight: 600; cursor: pointer; gap: 12px; 
            font-size: 0.72rem; text-transform: uppercase; transition: 0.3s; 
            background: rgba(255,255,255,0.08); 
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 5px solid var(--mpu-gold); color: var(--mpu-gold); }

        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px; }
        
        .sticky-tools { 
            position: sticky; top: -20px; z-index: 1000; background: white; width: 100%; max-width: 850px; 
            border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; border-top: 3px solid var(--mpu-green);
        }
        
        #identificador-peca { padding: 15px; background: #fff; font-weight: 800; color: var(--mpu-blue); cursor: pointer; font-size: 0.9rem; }
        
        .paper { width: 100%; max-width: 850px; background: white; min-height: 1000px; padding: 60px; color: #1e293b; border: 1px solid #d1d5db; }
        
        #folha-total { outline: none; min-height: 900px; line-height: 1.8; font-size: 16px; }

        #pdf-viewer { 
            position: absolute; right: 0; top: 0; bottom: 0; width: 0; 
            background: white; transition: 0.4s ease-in-out; z-index: 6000;
            display: flex; flex-direction: column; overflow: hidden; visibility: hidden; 
        }
        #pdf-viewer.active { width: 100%; visibility: visible; }
        #pdf-viewer iframe { flex: 1; border: none; width: 100%; height: 100%; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,40,80,0.9); z-index: 110000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-body { background: white; width: 100%; max-width: 550px; padding: 30px; border-radius: 8px; color: #0f172a; max-height: 90vh; overflow-y: auto; border-top: 10px solid var(--mpu-green); }
        
        .opt-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; font-size: 0.8rem; color: var(--mpu-blue); }
        .opt-btn:hover { background: var(--mpu-blue); color: white; }
        .tag-lei { font-size: 9px; background: var(--mpu-green); color: #fff; padding: 3px 8px; border-radius: 3px; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo"><i class="fas fa-shield-halved"></i> MPU | <span>ALTA PERFORMANCE</span></div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--mpu-gold);"></div>
</header>

<main>
    <aside class="sidebar">
        <div style="font-size: 10px; color: var(--mpu-gold); font-weight: 900; margin-bottom: 10px; letter-spacing: 2px; text-align: center;">TERMINAL JURÍDICO</div>
        
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.salvarNasGavetas()"><i class="fas fa-sync-alt"></i> SALVAR / ATUALIZAR</button>
        <button class="btn-side" onclick="window.abrirGavetas()"><i class="fas fa-folder"></i> MINHAS GAVETAS</button>
        
        <div style="margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        
        <button class="btn-side" style="background:var(--mpu-blue); color:var(--mpu-gold);" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book-open"></i> NÚCLEO DURO (LEIS)</button>
        <button class="btn-side" style="background:var(--juris);" onclick="window.abrirJurisprudencia()"><i class="fas fa-gavel"></i> JURISPRUDÊNCIA STF/STJ</button>
        <button class="btn-side" style="background:#0891b2;" onclick="window.abrirTemasElite()"><i class="fas fa-star"></i> TEMAS DE ELITE</button>

        <div style="margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        <button class="btn-side" style="background:var(--perigo);" onclick="window.limparTela()"><i class="fas fa-trash-alt"></i> LIMPAR TELA</button>
    </aside>

    <section class="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomear()">
                <i class="fas fa-file-invoice"></i> <span>ESTUDO MPU: SEM TÍTULO</span>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total" contenteditable="true" spellcheck="false">
                <p style="text-align: center;"><b>PLANO DE ATAQUE - MPU</b></p>
                <hr style="margin: 15px 0; opacity: 0.2;">
                <p><i>Inicie seus resumos de Jurisprudência e Temas de Elite aqui.</i></p>
            </div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div style="background:var(--mpu-blue); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid var(--mpu-gold);">
            <span id="pdf-title" style="color:white; font-size:12px; font-weight:bold;">SISTEMA DE LEITURA</span>
            <button onclick="window.fecharPDF()" style="background:var(--mpu-gold); border:none; padding:8px 20px; border-radius:4px; font-weight:bold; cursor:pointer;">X VOLTAR AO FOCO</button>
        </div>
        <iframe id="pdf-frame" src=""></iframe>
    </section>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--mpu-green); padding-bottom:10px; font-size:1.1rem; color:var(--mpu-blue)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; padding:12px; background:var(--mpu-blue); color:white; border-radius:4px; margin-top:20px; cursor:pointer; border:none; font-weight: bold;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1",
        storageBucket: "masteroab-db5e1.appspot.com",
        messagingSenderId: "620234160245",
        appId: "1:620234160245:web:8651817c66144e59f42668"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const BASE_PATH = "MPU_ESTUDOS_ELITE/GAVETAS";

    window.pecaNome = "ESTUDO MPU: SEM TÍTULO";

    const CATEGORIAS = [
        { id: "PECAS", nome: "Peças e Pareceres", icon: "fa-file-signature" },
        { id: "DISCURSIVAS", nome: "Questões Discursivas", icon: "fa-pen-fancy" },
        { id: "JURIS", nome: "Informativos STF/STJ", icon: "fa-gavel" },
        { id: "TEMAS", nome: "Temas de Elite", icon: "fa-trophy" }
    ];

    window.salvarNasGavetas = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "SINCRONIZAR NA GAVETA MPU";
        content.innerHTML = "";
        CATEGORIAS.forEach(cat => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas ${cat.icon}"></i> &nbsp; ${cat.nome}</span>`;
            btn.onclick = async () => {
                const conteudo = document.getElementById('folha-total').innerHTML;
                const path = `${BASE_PATH}/${cat.id}`;
                const snap = await get(ref(db, path));
                let keyEncontrada = null;
                if (snap.exists()) {
                    const dados = snap.val();
                    keyEncontrada = Object.keys(dados).find(key => dados[key].nome === window.pecaNome);
                }
                const finalKey = keyEncontrada || Date.now().toString();
                await set(ref(db, `${path}/${finalKey}`), { nome: window.pecaNome, data: new Date().toLocaleString(), conteudo: conteudo });
                alert("Sincronizado com Sucesso!");
                modal.style.display = 'none';
            };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.abrirGavetas = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "MEUS ESTUDOS SALVOS";
        content.innerHTML = "";
        CATEGORIAS.forEach(cat => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas ${cat.icon}"></i> &nbsp; ${cat.nome}</span>`;
            btn.onclick = () => window.listarArquivos(cat.id, cat.nome);
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.listarArquivos = async (catId, catNome) => {
        const content = document.getElementById('modal-content');
        content.innerHTML = "Acessando banco de dados...";
        const snap = await get(ref(db, `${BASE_PATH}/${catId}`));
        content.innerHTML = `<div onclick="window.abrirGavetas()" style="cursor:pointer; color:var(--mpu-green); font-weight:bold; margin-bottom:10px;">← Voltar</div>`;
        if (snap.exists()) {
            Object.keys(snap.val()).reverse().forEach(k => {
                const item = snap.val()[k];
                const d = document.createElement('div'); d.className = 'opt-btn';
                d.innerHTML = `<span>${item.nome} <br><small style="font-size:9px;">${item.data}</small></span>`;
                d.onclick = () => {
                    document.getElementById('folha-total').innerHTML = item.conteudo;
                    window.pecaNome = item.nome;
                    document.getElementById('identificador-peca').querySelector('span').innerText = item.nome;
                    document.getElementById('modal-base').style.display = 'none';
                };
                content.appendChild(d);
            });
        } else { content.innerHTML += "<p>Vazio.</p>"; }
    };

    window.abrirBibliotecaPDF = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "VADE MECUM: NÚCLEO DURO";
        const leis = [
            { n: "CF/88", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" },
            { n: "LC 75/93", u: "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm" },
            { n: "L. 8.112", u: "https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm" },
            { n: "L. 8.429", u: "https://www.planalto.gov.br/ccivil_03/leis/l8429.htm" },
            { n: "L. 14.133", u: "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm" }
        ];
        content.innerHTML = "";
        leis.forEach(lei => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><span class="tag-lei">${lei.n}</span> Abrir Lei Seca</span>`;
            btn.onclick = () => { document.getElementById('pdf-frame').src = lei.u; document.getElementById('pdf-viewer').classList.add('active'); modal.style.display = 'none'; };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.abrirJurisprudencia = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "JURISPRUDÊNCIA ESTRATÉGICA";
        const sites = [
            { n: "STF", t: "Informativos STF", u: "https://portal.stf.jus.br/informativo/" },
            { n: "STJ", t: "Jurisprudência em Teses", u: "https://scon.stj.jus.br/SCON/jurisprudencia/toc.jsp" },
            { n: "Dizer o Direito", t: "Resumos Facilitados", u: "https://www.dizerodireito.com.br/" }
        ];
        content.innerHTML = "<p style='font-size:10px; margin-bottom:10px;'>Acompanhe os últimos informativos para não ser surpreendido:</p>";
        sites.forEach(s => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><b style='color:var(--juris)'>${s.n}</b> - ${s.t}</span>`;
            btn.onclick = () => { document.getElementById('pdf-frame').src = s.u; document.getElementById('pdf-viewer').classList.add('active'); modal.style.display = 'none'; };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.abrirTemasElite = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "TEMAS DE ELITE (ALTA INCIDÊNCIA)";
        const temas = [
            "Poder de Investigação Criminal do MP",
            "Legitimidade na Ação Civil Pública",
            "Controle de Constitucionalidade e o MP",
            "Princípio do Promotor Natural",
            "Autonomia Institucional e Financeira"
        ];
        content.innerHTML = "<p style='font-size:11px; margin-bottom:10px;'>Clique para carregar a base de tópicos no editor:</p>";
        temas.forEach(t => {
            const btn = document.createElement('div'); btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class='fas fa-chevron-right'></i> ${t}</span>`;
            btn.onclick = () => {
                document.getElementById('folha-total').innerHTML += `<br><h3 style='color:var(--mpu-blue)'>• ${t}</h3><p>Pesquise e resuma os pontos-chave deste tema aqui...</p><br>`;
                modal.style.display = 'none';
            };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.fecharPDF = () => document.getElementById('pdf-viewer').classList.remove('active');
    window.renomear = () => { const n = prompt("TÍTULO DO ESTUDO:", window.pecaNome); if(n) { window.pecaNome = n.toUpperCase(); document.getElementById('identificador-peca').querySelector('span').innerText = n; } };
    window.limparTela = () => confirm("Resetar área de trabalho?") && (document.getElementById('folha-total').innerHTML = "");
    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString('pt-BR'); }, 1000);
</script>
</body>
</html>
