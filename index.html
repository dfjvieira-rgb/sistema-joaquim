<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA MPU MASTER - ELITE 2026</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --paper-color: #ffffff; 
            --mentoria: #a855f7; --sidebar-w: 240px; --perigo: #ef4444;
            --questoes: #3b82f6; --teses: #f97316; --biblioteca: #475569;
        }

        body.dark-mode { --bg-paper: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }

        header { background: var(--primary); height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); z-index: 5000; }
        .logo { font-size: 1.2rem; font-weight: 900; }
        .logo span { color: var(--gold); }

        main { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; flex-direction: column; 
            padding: 10px; gap: 8px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; 
        }

        .btn-side { 
            width: 100%; padding: 12px; border: none; border-radius: 8px; 
            display: flex; align-items: center; gap: 12px; color: white; 
            cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.05);
            font-size: 11px; font-weight: bold; text-transform: uppercase;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); transform: translateX(5px); }
        .btn-side i { font-size: 1rem; width: 20px; text-align: center; color: var(--gold); }

        /* DIVISÃO 50/50 CONFIGURADA AQUI */
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--bg-paper); overflow-y: auto; align-items: center; 
            padding: 20px; transition: flex 0.4s ease; 
        }
        
        /* Quando o PDF ativa, o editor encolhe para 50% */
        .editor-container.split-view { flex: 0.5; }

        .sticky-tools { position: sticky; top: -20px; z-index: 1000; background: white; width: 100%; max-width: 850px; border-radius: 0 0 12px 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 10px; }
        #identificador-peca { padding: 12px; background: #f8fafc; text-align: center; font-weight: 900; color: #0f172a; border-bottom: 3px solid var(--gold); cursor: pointer; text-transform: uppercase; }
        
        .toolbar-liberdade { display: flex; background: #fff; flex-wrap: wrap; }
        .btn-lib { flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; font-weight: 800; font-size: 10px; color: #64748b; border-right: 1px solid #f1f5f9; }

        .paper { width: 100%; max-width: 850px; background: white; box-shadow: 0 20px 50px rgba(0,0,0,0.4); min-height: 2500px; padding: 50px; color: black; outline: none; line-height: 1.6; }

        /* PDF ocupando os outros 50% */
        #pdf-viewer { width: 0; background: #334155; transition: width 0.4s ease; display: flex; flex-direction: column; overflow: hidden; border-left: 0 solid var(--gold); }
        #pdf-viewer.active { width: 50%; border-left: 4px solid var(--gold); }

        .pdf-controls { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; color: white; font-size: 12px; font-weight: bold; align-items: center; }
        iframe { width: 100%; flex: 1; border: none; background: white; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 90%; max-width: 450px; padding: 25px; border-radius: 15px; color: black; }
        .opt-btn { width: 100%; padding: 16px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #eee; cursor: pointer; font-weight: 800; display: flex; justify-content: space-between; background: #f9fafb; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo">JOAQUIM <span>ELITE MPU</span></div>
    <div id="ex-display" style="font-size: 11px; font-weight: 900; color: var(--gold);">MPU MASTER 2026</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" onclick="window.abrirExames()"><i class="fas fa-list"></i> ESCOLHER EXAME</button>
        <button class="btn-side" onclick="window.ativarTreinoLivre()"><i class="fas fa-edit"></i> NOVO PARECER</button>
        <button class="btn-side" onclick="window.ativarModoQuestoes()"><i class="fas fa-question-circle"></i> QUESTÕES</button>
        <button class="btn-side" onclick="window.ativarModoTeses()"><i class="fas fa-gavel"></i> TREINO TESES</button>
        <hr style="opacity: 0.1">
        <button class="btn-side" onclick="window.verPDF('LP')" style="background: rgba(59, 130, 246, 0.2);"><i class="fas fa-book"></i> LEI LC 75 (LOMPU)</button>
        <button class="btn-side" onclick="window.verPDF('LM')" style="background: rgba(16, 185, 129, 0.2);"><i class="fas fa-shield-alt"></i> IMPROBIDADE (LIA)</button>
        <button class="btn-side" onclick="window.verPDF('V')" style="background: rgba(255, 255, 255, 0.1);"><i class="fas fa-balance-scale"></i> VADE MECUM MPU</button>
        <hr style="opacity: 0.1">
        <button class="btn-side" onclick="window.finalizarPeca()" style="background: var(--gold); color: black;"><i class="fas fa-save"></i> FINALIZAR / SALVAR</button>
    </aside>

    <section class="editor-container" id="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca">ESTUDO MPU</div>
            <div class="toolbar-liberdade">
                <button class="btn-lib" onclick="document.execCommand('undo')"><i class="fas fa-undo"></i> DESFAZER</button>
                <button class="btn-lib" onclick="window.limparFolha()"><i class="fas fa-eraser"></i> LIMPAR</button>
                <button class="btn-lib" style="background: #166534; color: white;" onclick="window.print()"><i class="fas fa-file-pdf"></i> GERAR PDF</button>
            </div>
        </div>
        <div class="paper" id="editor-principal" contenteditable="true">
            Selecione uma função lateral para iniciar...
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-controls">
            <span id="pdf-title">CONSULTA</span>
            <button onclick="window.fecharPDF()" style="background:red; color:white; border:none; padding:4px 10px; cursor:pointer; border-radius:4px;">FECHAR [X]</button>
        </div>
        <iframe id="pdf-frame"></iframe>
    </section>
</main>

<script type="module">
    import { db } from './firebase-config.js';
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    window.db = db;
    window.pecaAtualNome = localStorage.getItem('pecaAtualNome') || "NOVO ESTUDO";

    window.onload = () => {
        document.getElementById('identificador-peca').innerText = window.pecaAtualNome;
        carregarRascunho();
        setInterval(salvarAutomatico, 20000);
    };

    // ABRE PDF DENTRO DA SUBPASTA "pdfs/"
    window.verPDF = (tipo) => {
        const v = document.getElementById('pdf-viewer');
        const f = document.getElementById('pdf-frame');
        const container = document.getElementById('editor-container');
        
        let arquivo = "";
        if(tipo === 'LP') arquivo = "lc75.pdf";
        if(tipo === 'LM') arquivo = "lei_improbidade.pdf";
        if(tipo === 'V') arquivo = "vade_mpu.pdf";
        
        // Caminho ajustado para sua pasta pdfs/
        f.src = `pdfs/${arquivo}`;
        v.classList.add('active');
        container.classList.add('split-view');
    };

    window.fecharPDF = () => {
        document.getElementById('pdf-viewer').classList.remove('active');
        document.getElementById('editor-container').classList.remove('split-view');
    };

    window.limparFolha = () => { if(confirm("Limpar toda a folha?")) document.getElementById('editor-principal').innerHTML = ""; };

    async function salvarAutomatico() {
        const html = document.getElementById('editor-principal').innerHTML;
        await set(ref(db, `SISTEMA_MPU/RASCUNHO`), { conteudo: html, peca: window.pecaAtualNome });
    }

    async function carregarRascunho() {
        const snap = await get(ref(db, `SISTEMA_MPU/RASCUNHO`));
        if(snap.exists()) document.getElementById('editor-principal').innerHTML = snap.val().conteudo;
    }

    window.finalizarPeca = async () => {
        const html = document.getElementById('editor-principal').innerHTML;
        const id = Date.now();
        await set(ref(db, `SISTEMA_MPU/HISTORICO_OFICIAL/${id}`), {
            peca: window.pecaAtualNome,
            conteudo: html,
            data: new Date().toLocaleString()
        });
        alert("ESTUDO SALVO COM SUCESSO!");
    };

    window.ativarTreinoLivre = () => { 
        let n = prompt("Nome do Parecer:"); 
        if(n) { 
            window.pecaAtualNome = n; 
            localStorage.setItem('pecaAtualNome', n); 
            document.getElementById('identificador-peca').innerText = n;
        } 
    };
</script>

</body>
</html>
