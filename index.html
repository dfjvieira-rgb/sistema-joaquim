<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA LEGISLATIVO - SENADO FEDERAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* PALETA OFICIAL SENADO FEDERAL */
            --primary: #00274d; 
            --secondary: #1e3a8a;
            --accent: #e5e7eb; 
            --gold-senado: #c5a059; 
            --bg-paper: #f1f5f9; 
            --paper-color: #ffffff; 
            --sidebar-w: 260px;
            --perigo: #991b1b;
            --sucesso: #166534;
            --legislativo: #1e40af;
        }

        body.dark-mode { --bg-paper: #0f172a; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--primary); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            color: white;
        }

        header { 
            background: linear-gradient(90deg, var(--primary) 0%, #004080 100%); 
            height: 65px; 
            padding: 0 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--gold-senado); 
            z-index: 5000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--gold-senado); font-size: 1.5rem; }
        .logo span { color: var(--accent); font-weight: 300; }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* BARRA LATERAL */
        .sidebar { 
            width: var(--sidebar-w); 
            background: #001f3d; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            padding: 15px; 
            border-right: 1px solid rgba(255,255,255,0.1); 
            overflow-y: auto; 
        }

        .btn-side { 
            width: 100%; min-height: 45px; border: none; border-radius: 6px; 
            display: flex; align-items: center; padding: 0 15px; color: white; 
            font-weight: 600; cursor: pointer; gap: 12px; font-size: 0.75rem; 
            text-transform: uppercase; transition: 0.2s; background: rgba(255,255,255,0.05);
            border-left: 3px solid transparent;
        }
        .btn-side:hover { background: rgba(255,255,255,0.12); border-left-color: var(--gold-senado); }
        .btn-side i { width: 18px; font-size: 0.9rem; color: var(--gold-senado); }

        /* ÁREA DO EDITOR */
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .editor-container.collapsed { flex: 0.2; opacity: 0.4; pointer-events: none; }

        .sticky-tools { 
            position: sticky; top: -20px; z-index: 1000; background: #ffffff; 
            width: 100%; max-width: 900px; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        #identificador-peca { 
            padding: 14px; background: #f8fafc; text-align: left; padding-left: 20px;
            font-weight: 800; color: var(--primary); border-bottom: 2px solid #e2e8f0;
            cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
        }

        .paper { 
            width: 100%; max-width: 900px; background: white; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            min-height: 29.7cm; position: relative; padding: 40px !important;
        }

        /* VISUALIZADOR DE PDF / LEGISLAÇÃO */
        #pdf-viewer { width: 0; background: #1e293b; transition: 0.4s; display: flex; flex-direction: column; overflow: hidden; }
        #pdf-viewer.active { width: 50%; border-left: 4px solid var(--gold-senado); }
        #pdf-viewer iframe { flex: 1; border: none; background: white; }

        .pdf-controls { 
            background: var(--primary); padding: 12px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* MODAIS */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,39,77,0.9); 
            z-index: 110000; align-items: center; justify-content: center; backdrop-filter: blur(4px); 
        }
        .modal-body { 
            background: white; width: 95%; max-width: 500px; padding: 30px; 
            border-radius: 12px; color: #0f172a; border-top: 8px solid var(--gold-senado); 
        }
        .opt-btn { 
            width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; 
            border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 700; 
            display: flex; justify-content: space-between; cursor: pointer; color: var(--primary); 
        }
        .opt-btn:hover { background: var(--primary); color: white; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            #pdf-viewer.active { width: 100%; position: absolute; z-index: 8000; height: 100%; }
        }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo"><i class="fas fa-landmark"></i> SENADO <span>FEDERAL</span></div>
    <div style="background: rgba(255,255,255,0.1); padding: 6px 15px; border-radius: 4px; font-size: 11px; font-weight: bold;">
        ÁREA TÉCNICA: <span id="ex-display" style="color:var(--gold-senado)">TRABALHO & PREVIDÊNCIA</span>
    </div>
</header>

<main>
    <aside class="sidebar" id="sidebar-main">
        <div style="font-size: 10px; color: var(--gold-senado); font-weight: 900; margin-bottom: 10px; opacity: 0.8; letter-spacing: 1px;">CONSULTORIA LEGISLATIVA</div>
        
        <button class="btn-side" style="background:var(--secondary);" onclick="window.abrirPergaminho()"><i class="fas fa-scroll"></i> MODELOS DE PARECER</button>
        <button class="btn-side" style="background:var(--legislativo);" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book"></i> ESTUDO EM TELA (LEIS)</button>
        <button class="btn-side" onclick="window.gerenciadorPasta()"><i class="fas fa-folder-open"></i> GAVETAS DE ARQUIVOS</button>
        
        <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.finalizarPeca()"><i class="fas fa-save"></i> FINALIZAR E SALVAR</button>
        <button class="btn-side" style="background:#334155;" onclick="window.limparFolha()"><i class="fas fa-eraser"></i> LIMPAR TELA</button>
    </aside>

    <section class="editor-container" id="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomearTreino()">
                <i class="fas fa-file-signature"></i> <span>CARREGANDO DOCUMENTO...</span>
            </div>
            <div style="padding: 8px; display: flex; gap: 10px; background: #fff; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                <button class="btn-side" style="color:var(--primary); width: auto; background: #f1f5f9;" onclick="window.toggleRecolherEditor()"><i class="fas fa-columns"></i> DIVIDIR TELA</button>
                <button class="btn-side" style="color:var(--primary); width: auto; background: #f1f5f9;" onclick="window.print()"><i class="fas fa-print"></i> EXPORTAR PDF</button>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total"></div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-controls">
            <span id="pdf-title" style="color:white; font-size:11px; font-weight:800; text-transform: uppercase;">REFERÊNCIA TÉCNICA</span>
            <button onclick="window.fecharPDF()" style="background:var(--gold-senado); border:none; padding:5px 12px; border-radius:4px; font-weight:bold; cursor:pointer; color:var(--primary)">FECHAR X</button>
        </div>
        <iframe id="pdf-frame" src="about:blank"></iframe>
    </section>
</main>

<div class="modal" id="universal-modal">
    <div class="modal-body">
        <div id="modal-back-btn" style="display:none; margin-bottom:15px; cursor:pointer; font-weight:bold; color:var(--primary)" onclick="window.gerenciadorPasta()">← VOLTAR</div>
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--gold-senado); padding-bottom:10px; font-size:1.1rem; color:var(--primary)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('universal-modal').style.display='none'" style="width:100%; padding:15px; background:var(--primary); color:#fff; border-radius:8px; margin-top:15px; font-weight:bold; cursor:pointer; border:none;">CONCLUÍDO</button>
    </div>
</div>
<script type="module">
    import { db } from './firebase-config.js';
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { FolhaEngine } from './folha-engine.js';

    const PROJETO_ID = "SISTEMA_SENADO_FEDERAL"; 
    window.pecaAtualNome = localStorage.getItem('senado_peca_nome') || "NOVO ESTUDO";

    // --- BANCO DE DADOS DE PROVAS (LINKS DIRETOS) ---
    const BANCO_PROVAS = [
        { ano: "2022", cargo: "Consultor (Trabalho/Prev)", tipo: "Discursiva (Padrão FGV)", url: "https://conhecimento.fgv.br/concursos/senado22" },
        { ano: "2022", cargo: "Consultor (Trabalho/Prev)", tipo: "Objetiva (Gabarito)", url: "https://conhecimento.fgv.br/concursos/senado22" },
        { ano: "2012", cargo: "Analista Legislativo", tipo: "Prova Completa", url: "https://www12.senado.leg.br/institucional/concursos/concurso-2012" }
    ];

    window.onload = async () => {
        FolhaEngine.montar('folha-total');
        document.getElementById('identificador-peca').querySelector('span').innerText = window.pecaAtualNome;
        await carregarRascunho();
        setInterval(salvarAutomatico, 30000);
    };

    // --- NOVO BOTÃO: ACESSAR PROVAS ANTERIORES ---
    window.abrirProvasFGV = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📝 PROVAS ANTERIORES FGV";
        
        let html = `<p style="font-size:11px; color:gray; margin-bottom:10px;">Selecione para abrir a prova oficial e treinar no editor ao lado:</p>`;
        BANCO_PROVAS.forEach(p => {
            html += `
                <div class="opt-btn" onclick="window.open('${p.url}', '_blank'); window.prepararAmbienteTreino('${p.cargo} - ${p.ano}')">
                    <div style="flex:1">
                        <strong>${p.ano} - ${p.cargo}</strong><br>
                        <small>${p.tipo}</small>
                    </div>
                    <i class="fas fa-file-pdf"></i>
                </div>`;
        });
        content.innerHTML = html;
        modal.style.display = 'flex';
    };

    window.prepararAmbienteTreino = (nome) => {
        window.pecaAtualNome = "TREINO: " + nome;
        document.getElementById('identificador-peca').querySelector('span').innerText = window.pecaAtualNome;
        document.getElementById('pdf-viewer').classList.add('active');
        document.getElementById('editor-container').classList.add('collapsed');
        document.getElementById('pdf-title').innerText = "MODO TREINO ATIVO";
        document.getElementById('universal-modal').style.display = 'none';
    };

    // --- GESTÃO DE GAVETAS (PASTAS) ---
    window.gerenciadorPasta = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📂 MINHAS GAVETAS";
        content.innerHTML = `
            <div class="opt-btn" onclick="window.abrirSubGaveta('PROVAS')"><span>SIMULADOS DE PROVAS</span> <i class="fas fa-edit"></i></div>
            <div class="opt-btn" onclick="window.abrirSubGaveta('PARECERES')"><span>PARECERES TÉCNICOS</span> <i class="fas fa-file-contract"></i></div>
            <div class="opt-btn" onclick="window.abrirSubGaveta('RESUMOS')"><span>RESUMOS E TESES</span> <i class="fas fa-book"></i></div>
            <div class="opt-btn" style="margin-top:10px; border-color:var(--gold-senado)" onclick="window.abrirProvasFGV()"><span>ACESSAR PROVAS OFICIAIS</span> <i class="fas fa-external-link-alt"></i></div>
        `;
        modal.style.display = 'flex';
    };

    window.abrirSubGaveta = async (cat) => {
        const content = document.getElementById('modal-content');
        content.innerHTML = "Carregando...";
        const snap = await get(ref(db, `${PROJETO_ID}/HISTORICO`));
        content.innerHTML = `<strong>GAVETA: ${cat}</strong><br><br>`;
        if (snap.exists()) {
            Object.keys(snap.val()).forEach(id => {
                const item = snap.val()[id];
                if(item.categoria === cat) {
                    const d = document.createElement('div');
                    d.className = 'opt-btn';
                    d.innerHTML = `<span>${item.peca}</span>`;
                    d.onclick = () => { document.getElementById('editor-principal').innerHTML = item.conteudo; document.getElementById('universal-modal').style.display='none'; };
                    content.appendChild(d);
                }
            });
        }
    };

    // --- MODELOS PERGAMINHO (ESTRUTURAS) ---
    window.abrirPergaminho = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📜 ESTRUTURAS LEGISLATIVAS";
        content.innerHTML = `
            <div class="opt-btn" onclick="window.injetar('PARECER')">PARECER DE MÉRITO (CAS)</div>
            <div class="opt-btn" onclick="window.injetar('CONST')">PARECER CCJ (CONSTITUCIONALIDADE)</div>
            <div class="opt-btn" onclick="window.injetar('QUESTAO')">QUESTÃO DISCURSIVA (FGV)</div>
        `;
        modal.style.display = 'flex';
    };

    window.injetar = (t) => {
        const ed = document.getElementById('editor-principal');
        if(t === 'QUESTAO') ed.innerHTML = `<h3>QUESTÃO DISCURSIVA Nº __</h3><p><strong>ENUNCIADO:</strong> [Cole aqui o enunciado da prova anterior]</p><hr><p><strong>RESPOSTA TÉCNICA:</strong></p>`;
        else if(t === 'PARECER') ed.innerHTML = `<h2>PARECER Nº __</h2><p><strong>RELATÓRIO:</strong> ...</p><p><strong>ANÁLISE:</strong> ...</p><p><strong>VOTO:</strong> ...</p>`;
        document.getElementById('universal-modal').style.display='none';
    };

    // --- BIBLIOTECA VIVA ---
    window.abrirBibliotecaPDF = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📚 BIBLIOTECA";
        content.innerHTML = "";
        [
            {n: "REGIMENTO SENADO", u: "https://www25.senado.leg.br/web/atividade/regimento-interno"},
            {n: "CLT ATUALIZADA", u: "https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452.htm"},
            {n: "CONSTITUIÇÃO FEDERAL", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}
        ].forEach(i => {
            const d = document.createElement('div'); d.className = 'opt-btn'; d.innerHTML = `<span>${i.n}</span>`;
            d.onclick = () => { window.open(i.u, '_blank'); modal.style.display='none'; document.getElementById('pdf-viewer').classList.add('active'); };
            content.appendChild(d);
        });
        modal.style.display = 'flex';
    };

    // --- SISTEMA ---
    window.finalizarPeca = async () => {
        const cat = prompt("Gaveta (PROVAS / PARECERES / RESUMOS):", "PARECERES")?.toUpperCase();
        if(!cat) return;
        const id = Date.now().toString();
        await set(ref(db, `${PROJETO_ID}/HISTORICO/${id}`), {
            categoria: cat,
            peca: window.pecaAtualNome + " (" + new Date().toLocaleDateString() + ")",
            conteudo: document.getElementById('editor-principal').innerHTML
        });
        alert("Salvo na Gaveta " + cat);
    };

    window.toggleRecolherEditor = () => { document.getElementById('editor-container').classList.toggle('collapsed'); document.getElementById('pdf-viewer').classList.toggle('active'); };
    window.fecharPDF = () => { document.getElementById('pdf-viewer').classList.remove('active'); document.getElementById('editor-container').classList.remove('collapsed'); };
    window.renomearTreino = () => { const n = prompt("Nome:", window.pecaAtualNome); if(n) { window.pecaAtualNome = n; document.getElementById('identificador-peca').querySelector('span').innerText = n; } };
    window.limparFolha = () => confirm("Limpar?") && (document.getElementById('editor-principal').innerHTML = "");
    async function salvarAutomatico() { const ed = document.getElementById('editor-principal'); if(ed) set(ref(db, `${PROJETO_ID}/RASCUNHO`), { conteudo: ed.innerHTML }); }
    async function carregarRascunho() { const snap = await get(ref(db, `${PROJETO_ID}/RASCUNHO`)); if(snap.exists()) document.getElementById('editor-principal').innerHTML = snap.val().conteudo; }
</script>
