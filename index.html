<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MPU MASTER</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --paper-color: #ffffff; 
            --mentoria: #6366f1; --sidebar-w: 70px; --perigo: #ef4444;
            --sucesso: #10b981; --questoes: #3b82f6; --teses: #f97316;
        }

        body.dark-mode { --bg-paper: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }

        header { 
            background: var(--primary); height: 60px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000;
        }

        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: -1px; }
        .logo span { color: var(--gold); }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR COMPACTA */
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 10px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto;
        }

        .btn-side { 
            width: 50px; min-height: 50px; border: none; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; color: white; 
            cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.05);
            position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .btn-side i { font-size: 1.1rem; color: var(--gold); }

        .btn-side::after {
            content: attr(data-label); position: absolute; left: 60px; background: #000; color: #fff;
            padding: 6px 12px; border-radius: 6px; font-size: 10px; white-space: nowrap; opacity: 0; 
            pointer-events: none; transition: 0.2s; z-index: 6000; border: 1px solid var(--gold); font-weight: bold;
        }
        .btn-side:hover::after { opacity: 1; left: 75px; }

        .editor-container { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px;
            transition: all 0.4s ease;
        }
        .editor-container.collapsed { flex: 0.3; opacity: 0.5; }

        .sticky-tools { 
            position: sticky; top: -20px; z-index: 1000; background: white; 
            width: 100%; max-width: 850px; border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 10px;
        }

        #identificador-peca { 
            padding: 12px; background: #f8fafc; text-align: center; 
            font-weight: 900; color: #0f172a; border-bottom: 3px solid var(--gold);
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        
        .toolbar-liberdade { display: flex; background: #fff; flex-wrap: wrap; align-items: center; }
        .btn-lib { 
            flex: 1; padding: 12px; border: none; background: transparent; 
            cursor: pointer; font-weight: 800; font-size: 0.7rem; 
            text-transform: uppercase; color: #64748b; border-right: 1px solid #f1f5f9;
        }

        .highlight-box { display: flex; align-items: center; background: #f1f5f9; padding: 0 10px; gap: 8px; border-right: 1px solid #f1f5f9; height: 45px; }
        .color-dot { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-dot.active { border-color: #000; transform: scale(1.1); }

        .paper { width: 100%; max-width: 850px; background: white; box-shadow: 0 20px 50px rgba(0,0,0,0.4); min-height: 5250px; position: relative; }
        
        /* FOLHA ENGINE 150 LINHAS */
        .folha-container { display: grid; grid-template-columns: 50px 1fr; background: #fff; border: 2px solid #000; font-family: 'Courier New', monospace; }
        .num-col { background: #f1f5f9; border-right: 2px solid #000; user-select: none; }
        .num-linha { height: 35px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; border-bottom: 1px solid #cbd5e1; color: #1e293b; }
        .area-escrita { 
            outline: none; font-size: 19px; font-weight: 700; color: #000; line-height: 35px; 
            padding: 0 20px; min-height: 5250px; text-align: justify;
            background-image: linear-gradient(to bottom, transparent 34px, #e2e8f0 34px);
            background-size: 100% 35px;
        }

        #pdf-viewer { width: 0; background: #334155; transition: 0.4s; display: flex; flex-direction: column; overflow: hidden; }
        #pdf-viewer.active { width: 50%; border-left: 4px solid var(--gold); }
        #pdf-viewer.full-view { width: 100% !important; flex: 1; }
        .pdf-controls { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; color: white; font-weight: 900; font-size: 12px; align-items: center;}
        iframe { width: 100%; flex: 1; border: none; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 95%; max-width: 500px; padding: 25px; border-radius: 20px; color: #0f172a; max-height: 85vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 18px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #eee; background: #f8fafc; font-weight: 800; display: flex; justify-content: space-between; cursor: pointer; align-items: center; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo">JOAQUIM <span>ELITE MPU</span></div>
    <div style="color:var(--gold); font-size:10px; font-weight:bold;">MODO: <span id="ex-display">LOMPU</span></div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" style="background:var(--gold); color:#000" data-label="GAVETAS MPU" onclick="window.gerenciadorPasta()"><i class="fas fa-folder-open"></i></button>
        <button class="btn-side" style="background:var(--sucesso);" data-label="FINALIZAR / SALVAR" onclick="window.finalizarPeca()"><i class="fas fa-save"></i></button>
        <hr style="width:70%; opacity:0.1; margin:5px 0">
        <button class="btn-side" style="background:var(--teses);" data-label="QUAL A PEÇA MPU?" onclick="window.inteligenciaMPU()"><i class="fas fa-gavel"></i></button>
        <button class="btn-side" style="background:var(--mentoria);" data-label="PERGAMINHO (ESTRUTURAS)" onclick="window.abrirPergaminho()"><i class="fas fa-scroll"></i></button>
        <hr style="width:70%; opacity:0.1; margin:5px 0">
        <button class="btn-side" style="background:#475569;" data-label="LOMPU (LC 75)" onclick="window.verPDF('LOMPU')"><i class="fas fa-balance-scale"></i></button>
        <button class="btn-side" style="background:#475569;" data-label="PROCESSO COLETIVO" onclick="window.verPDF('PC')"><i class="fas fa-users"></i></button>
        <button class="btn-side" style="background:var(--perigo);" data-label="IMPROBIDADE" onclick="window.verPDF('IA')"><i class="fas fa-hand-paper"></i></button>
    </aside>

    <section class="editor-container" id="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomearTreino()">NOVO ESTUDO MPU <i class="fas fa-pen" style="font-size:10px; opacity:0.5"></i></div>
            <div class="toolbar-liberdade">
                <button class="btn-lib" onclick="window.desfazer()"><i class="fas fa-undo"></i> Desfazer</button>
                <div class="highlight-box">
                    <div class="color-dot active" id="dot-yellow" style="background:#fef08a;" onclick="window.setHighlightColor('#fef08a', 'dot-yellow')"></div>
                    <div class="color-dot" id="dot-green" style="background:#bbf7d0;" onclick="window.setHighlightColor('#bbf7d0', 'dot-green')"></div>
                    <div class="color-dot" id="dot-blue" style="background:#bfdbfe;" onclick="window.setHighlightColor('#bfdbfe', 'dot-blue')"></div>
                </div>
                <button class="btn-lib" onclick="window.limparFolha()"><i class="fas fa-trash"></i> Limpar</button>
                <button class="btn-lib" style="background:#22c55e; color:white" onclick="window.print()"><i class="fas fa-print"></i> PDF</button>
            </div>
        </div>
        <div class="paper">
            <div class="folha-container">
                <div class="num-col" id="coluna-numeros"></div>
                <div class="area-escrita" id="editor-principal" contenteditable="true" spellcheck="false"></div>
            </div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-controls">
            <span id="pdf-title">DOCUMENTO</span>
            <button onclick="window.fecharPDF()" style="background:var(--gold); border:none; padding:4px 10px; border-radius:4px; font-weight:bold; cursor:pointer">X</button>
        </div>
        <iframe id="pdf-frame"></iframe>
    </section>
</main>

<div class="modal" id="universal-modal">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:2px solid var(--gold)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('universal-modal').style.display='none'" style="width:100%; padding:15px; background:#000; color:#fff; border-radius:10px; margin-top:15px; font-weight:bold; cursor:pointer;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- PARTE 2: LÓGICA E MOTOR ---

    // Inicialização da Folha 150 Linhas
    const col = document.getElementById('coluna-numeros');
    for(let i=1; i<=150; i++) {
        const d = document.createElement('div');
        d.className = 'num-linha'; d.innerText = i;
        col.appendChild(d);
    }

    window.currentColor = '#fef08a';
    window.historicoUndo = [];
    window.pecaAtualNome = "NOVO ESTUDO MPU";

    // Marca-Texto Funcional
    window.setHighlightColor = (color, id) => {
        window.currentColor = color;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    document.getElementById('editor-principal').onmouseup = () => {
        const sel = window.getSelection();
        if(sel.toString().length > 0) document.execCommand('backColor', false, window.currentColor);
    };

    // Inteligência de Peças MPU
    window.inteligenciaMPU = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "🧠 QUAL O INSTRUMENTO MPU?";
        content.innerHTML = `
            <div class="opt-btn" onclick="alert('Fundamento: Art. 129, III, CF + Lei 7.347/85')">AÇÃO CIVIL PÚBLICA</div>
            <div class="opt-btn" onclick="alert('Fundamento: Art. 8º, §1º, Lei 7.347/85')">INQUÉRITO CIVIL</div>
            <div class="opt-btn" onclick="alert('Fundamento: Art. 6º, XX, LC 75/93')">RECOMENDAÇÃO</div>
        `;
        modal.style.display = 'flex';
    };

    // Pergaminho: Estruturas Prontas
    window.abrirPergaminho = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📜 ESTRUTURAS NÚCLEO DURO";
        content.innerHTML = `
            <div class="opt-btn" onclick="window.injetar('ACP')">AÇÃO CIVIL PÚBLICA</div>
            <div class="opt-btn" onclick="window.injetar('PARECER')">PARECER MINISTERIAL</div>
        `;
        modal.style.display = 'flex';
    };

    window.injetar = (tipo) => {
        const ed = document.getElementById('editor-principal');
        if(tipo === 'ACP') ed.innerHTML = "<b>EXCELENTÍSSIMO SENHOR JUIZ FEDERAL DA ... VARA FEDERAL...</b><br><br>O <b>MINISTÉRIO PÚBLICO FEDERAL</b>...";
        if(tipo === 'PARECER') ed.innerHTML = "<b>PROCESSO Nº:</b> ...<br><b>EMENTA:</b> ...<br><br><b>1. RELATÓRIO</b>...";
        document.getElementById('universal-modal').style.display = 'none';
    };

    // Sistema de Gavetas (Firebase)
    window.finalizarPeca = async () => {
        const nome = prompt("Nome do Estudo:", window.pecaAtualNome);
        if(!nome) return;
        const gaveta = prompt("Gaveta (PARECERES, LOMPU, DISCURSIVAS):", "PARECERES").toUpperCase();
        const html = document.getElementById('editor-principal').innerHTML;
        
        await set(ref(db, `SISTEMA_MPU/GAVETAS/${gaveta}/${Date.now()}`), {
            nome: nome.toUpperCase(),
            conteudo: btoa(unescape(encodeURIComponent(html))),
            data: new Date().toLocaleString()
        });
        alert("✓ Guardado na Gaveta!");
    };

    window.gerenciadorPasta = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "📂 MINHAS GAVETAS";
        content.innerHTML = ["PARECERES", "LOMPU", "DISCURSIVAS"].map(g => `
            <div class="opt-btn" onclick="window.listarGaveta('${g}')"><span>${g}</span> <i class="fas fa-folder"></i></div>
        `).join('');
        modal.style.display = 'flex';
    };

    window.listarGaveta = async (gaveta) => {
        const content = document.getElementById('modal-content');
        content.innerHTML = "Buscando...";
        const snap = await get(ref(db, `SISTEMA_MPU/GAVETAS/${gaveta}`));
        if(!snap.exists()) { content.innerHTML = "Vazia."; return; }
        
        let h = "";
        Object.entries(snap.val()).forEach(([id, item]) => {
            h += `<div class="opt-btn" onclick="window.abrirDoc('${gaveta}','${id}')">${item.nome}</div>`;
        });
        content.innerHTML = h;
    };

    window.abrirDoc = async (gaveta, id) => {
        const snap = await get(ref(db, `SISTEMA_MPU/GAVETAS/${gaveta}/${id}`));
        const data = snap.val();
        document.getElementById('editor-principal').innerHTML = decodeURIComponent(escape(atob(data.conteudo)));
        document.getElementById('identificador-peca').innerText = data.nome;
        document.getElementById('universal-modal').style.display = 'none';
    };

    // Interface PDF
    window.verPDF = (t) => {
        const f = document.getElementById('pdf-frame');
        const tit = document.getElementById('pdf-title');
        let url = "vade.pdf";
        if(t === 'LOMPU') url = "lc75.pdf";
        if(t === 'PC') url = "processo_coletivo.pdf";
        if(t === 'IA') url = "improbidade.pdf";
        f.src = url; tit.innerText = url.toUpperCase();
        document.getElementById('pdf-viewer').classList.add('active');
        document.getElementById('editor-container').classList.add('collapsed');
    };

    window.fecharPDF = () => {
        document.getElementById('pdf-viewer').classList.remove('active');
        document.getElementById('editor-container').classList.remove('collapsed');
    };

    window.desfazer = () => { if(window.historicoUndo.length > 0) document.getElementById('editor-principal').innerHTML = window.historicoUndo.pop(); };
    window.limparFolha = () => confirm("Limpar?") && (document.getElementById('editor-principal').innerHTML = "");
    window.renomearTreino = () => { const n = prompt("Nome:"); if(n) document.getElementById('identificador-peca').innerText = n.toUpperCase(); };

</script>
</body>
</html>
