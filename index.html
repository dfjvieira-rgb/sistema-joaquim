<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MPU ELITE | DASHBOARD DE TREINO</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --mpu-green: #064e3b; --mpu-blue: #0c4a6e; --mpu-gold: #b45309;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; /* Sidebar reduzida para focar no conteúdo */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; height: 100vh; display: flex; overflow: hidden; }

        /* SIDEBAR MINIMALISTA */
        .sidebar { 
            width: var(--sidebar-w); background: #020617; display: flex; flex-direction: column; 
            align-items: center; padding: 20px 0; border-right: 1px solid var(--mpu-gold); 
        }
        .icon-btn { 
            color: white; font-size: 1.2rem; margin-bottom: 25px; cursor: pointer; 
            transition: 0.3s; position: relative; 
        }
        .icon-btn:hover { color: var(--mpu-gold); }

        /* ÁREA DE CONTEÚDO PRINCIPAL */
        .main-content { flex: 1; display: flex; flex-direction: column; }

        /* ÁREA SUPERIOR: DUAL PDF */
        #top-dual-viewer { 
            height: 60%; /* Ocupa 60% da tela */
            display: flex; gap: 5px; background: #334155; padding: 5px;
        }
        .pdf-box { flex: 1; background: white; border-radius: 4px; display: flex; flex-direction: column; }
        .pdf-header { 
            background: #f1f5f9; padding: 4px 10px; font-size: 10px; 
            font-weight: 800; color: var(--mpu-blue); display: flex; justify-content: space-between; 
        }

        /* ÁREA INFERIOR: FOLHA DE RESPOSTAS */
        #bottom-editor { 
            height: 40%; /* Ocupa 40% para escrita */
            background: white; border-top: 4px solid var(--mpu-gold); 
            padding: 20px; overflow-y: auto; color: #1e293b;
        }
        
        iframe { width: 100%; height: 100%; border: none; }
        #rascunho-estudo { outline: none; min-height: 100%; font-size: 15px; line-height: 1.6; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 450px; padding: 20px; border-radius: 8px; color: black; }
        .opt-btn { 
            width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; 
            display: flex; justify-content: space-between; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .opt-btn:hover { background: var(--mpu-blue); color: white; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="icon-btn" onclick="window.abrirBiblioteca()" title="Biblioteca"><i class="fas fa-book-open"></i></div>
        <div class="icon-btn" onclick="window.limparRascunho()" title="Limpar"><i class="fas fa-eraser"></i></div>
        <div class="icon-btn" onclick="window.salvarEstudo()" title="Salvar"><i class="fas fa-save"></i></div>
    </nav>

    <div class="main-content">
        <section id="top-dual-viewer">
            <div class="pdf-box">
                <div class="pdf-header"><span>PROVA / QUESTÕES</span> <span id="name-l">-</span></div>
                <iframe id="frame-l" src="about:blank"></iframe>
            </div>
            <div class="pdf-box">
                <div class="pdf-header"><span>GABARITO / REFERÊNCIA</span> <span id="name-r">-</span></div>
                <iframe id="frame-r" src="about:blank"></iframe>
            </div>
        </section>

        <section id="bottom-editor">
            <div id="rascunho-estudo" contenteditable="true" spellcheck="false">
                <b>📝 CADERNO DE ERROS E FUNDAMENTAÇÃO:</b>
                <p>Use este espaço para marcar suas respostas e colar as fundamentações dos artigos enquanto analisa a prova acima.</p>
                <hr style="margin: 10px 0;">
            </div>
        </section>
    </div>

    <div class="modal" id="modal-pdf">
        <div class="modal-body">
            <h3 style="margin-bottom:15px; border-bottom:2px solid var(--mpu-gold)">BIBLIOTECA MPU</h3>
            <div id="lista-pdfs"></div>
            <button onclick="document.getElementById('modal-pdf').style.display='none'" style="margin-top:15px; width:100%; padding:10px; background:black; color:white; border:none; cursor:pointer;">FECHAR</button>
        </div>
    </div>

<script>
    window.LISTA_PDF_BIBLIOTECA = [
        { nome: "PROVA ANALISTA MPU (FGV)", url: "AnalistaMPU.pdf" },
        { nome: "GABARITO ANALISTA (FGV)", url: "AnalistaMPU_Gabarito.pdf" },
        { nome: "PROVA ANALISTA (CESPE)", url: "mpu10_045.pdf" },
        { nome: "GABARITO ANALISTA (CESPE)", url: "gabaritos_mpu45.pdf" },
        { nome: "LINHA DO TEMPO", url: "LINHA DO TEMPO - Identificação de Peças_231123_182636.pdf" }
    ];

    window.abrirBiblioteca = () => {
        const lista = document.getElementById('lista-pdfs');
        lista.innerHTML = "";
        window.LISTA_PDF_BIBLIOTECA.forEach(pdf => {
            const item = document.createElement('div');
            item.className = 'opt-btn';
            item.innerHTML = `<span>${pdf.nome}</span> 
                <div>
                    <button onclick="window.load(1, '${pdf.url}', '${pdf.nome}')" style="padding:2px 5px; font-size:9px; cursor:pointer;">ESQ</button>
                    <button onclick="window.load(2, '${pdf.url}', '${pdf.nome}')" style="padding:2px 5px; font-size:9px; cursor:pointer;">DIR</button>
                </div>`;
            lista.appendChild(item);
        });
        document.getElementById('modal-pdf').style.display = 'flex';
    };

    window.load = (side, url, nome) => {
        if(side === 1) {
            document.getElementById('frame-l').src = url;
            document.getElementById('name-l').innerText = nome;
        } else {
            document.getElementById('frame-r').src = url;
            document.getElementById('name-r').innerText = nome;
        }
    };

    window.limparRascunho = () => confirm("Limpar anotações?") && (document.getElementById('rascunho-estudo').innerHTML = "<b>📝 CADERNO DE ERROS:</b><br>");
    window.salvarEstudo = () => {
        alert("Conteúdo salvo localmente no navegador!");
        localStorage.setItem('estudo_mpu', document.getElementById('rascunho-estudo').innerHTML);
    };

    // Carregar último estudo se houver
    window.onload = () => {
        const salvo = localStorage.getItem('estudo_mpu');
        if(salvo) document.getElementById('rascunho-estudo').innerHTML = salvo;
    };
</script>
</body>
</html>
