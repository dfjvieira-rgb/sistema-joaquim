<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA LEGISLATIVO - SENADO FEDERAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* NOVA PALETA SENADO FEDERAL */
            --primary: #00274d; /* Azul Marinho Senado */
            --secondary: #1e3a8a;
            --accent: #e5e7eb; /* Prata/Cinza Claro */
            --gold-senado: #c5a059; /* Dourado Brasão */
            --bg-paper: #f1f5f9; 
            --paper-color: #ffffff; 
            --sidebar-w: 260px;
            --perigo: #991b1b;
            --sucesso: #166534;
            --questoes: #0369a1;
            --legislativo: #1e40af;
        }

        body.dark-mode { --bg-paper: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--primary); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            color: white;
        }

        header { 
            background: linear-gradient(90deg, var(--primary) 0%, #004080 100%); 
            height: 65px; 
            padding: 0 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--gold-senado); 
            z-index: 5000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--gold-senado); font-size: 1.5rem; }
        .logo span { color: var(--accent); font-weight: 300; }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { 
            width: var(--sidebar-w); 
            background: #001f3d; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            padding: 15px; 
            border-right: 1px solid rgba(255,255,255,0.1); 
            overflow-y: auto; 
            transition: all 0.3s ease;
        }

        /* BOTÕES LATERAIS ESTILO INSTITUCIONAL */
        .btn-side { 
            width: 100%; min-height: 42px; border: none; border-radius: 6px; 
            display: flex; align-items: center; padding: 0 15px; color: white; 
            font-weight: 600; cursor: pointer; gap: 12px; font-size: 0.75rem; 
            text-transform: uppercase; transition: 0.2s; background: rgba(255,255,255,0.05);
            border-left: 3px solid transparent;
        }
        .btn-side:hover { background: rgba(255,255,255,0.12); border-left-color: var(--gold-senado); }
        .btn-side i { width: 18px; font-size: 0.9rem; color: var(--gold-senado); }

        .editor-container { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px;
            transition: all 0.4s ease;
        }

        .editor-container.collapsed { flex: 0.2; opacity: 0.4; pointer-events: none; }

        .sticky-tools { 
            position: sticky; top: -20px; z-index: 1000; background: #ffffff; 
            width: 100%; max-width: 900px; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        #identificador-peca { 
            padding: 14px; background: #f8fafc; text-align: left; padding-left: 20px;
            font-weight: 800; color: var(--primary); border-bottom: 2px solid #e2e8f0;
            cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
        }
        
        .toolbar-liberdade { display: flex; background: #fff; flex-wrap: wrap; align-items: center; padding: 5px; }
        .btn-lib { 
            padding: 10px 15px; border: none; background: transparent; 
            cursor: pointer; font-weight: 700; font-size: 0.65rem; 
            text-transform: uppercase; color: #475569; border-radius: 4px;
        }
        .btn-lib:hover { background: #f1f5f9; }

        .highlight-box { display: flex; align-items: center; background: #f8fafc; padding: 5px 12px; gap: 8px; border-radius: 20px; margin: 0 10px; border: 1px solid #e2e8f0; }
        .color-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-dot.active { border-color: var(--primary); transform: scale(1.2); }

        .paper { 
            width: 100%; max-width: 900px; background: white; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            min-height: 29.7cm; /* Padrão A4 aproximado */
            position: relative; padding: 40px !important;
        }

        #pdf-viewer { width: 0; background: #1e293b; transition: 0.4s; display: flex; flex-direction: column; overflow: hidden; }
        #pdf-viewer.active { width: 50%; border-left: 4px solid var(--gold-senado); }
        #pdf-viewer.full-view { width: 100% !important; }

        .pdf-controls { background: var(--primary); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);}
        
        #mobile-hub { display: none; position: fixed; bottom: 30px; right: 25px; z-index: 99999; flex-direction: column-reverse; gap: 12px; }
        .fab-main { width: 60px; height: 60px; border-radius: 50%; background: var(--gold-senado); border: none; font-size: 1.5rem; box-shadow: 0 8px 25px rgba(0,0,0,0.4); cursor: pointer; color: white; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,39,77,0.85); z-index: 110000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-body { background: white; width: 95%; max-width: 450px; padding: 30px; border-radius: 12px; color: #0f172a; border-top: 8px solid var(--gold-senado); }
        .opt-btn { width: 100%; padding: 15px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; align-items: center; color: var(--primary); }
        .opt-btn:hover { background: var(--primary); color: white; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            #mobile-hub { display: flex; }
            #pdf-viewer.active { width: 100%; position: absolute; z-index: 8000; height: 100%; }
        }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo"><i class="fas fa-landmark"></i> SENADO <span>FEDERAL</span></div>
    <div style="background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; letter-spacing: 1px;">
        SISTEMA DE APOIO LEGISLATIVO: <span id="ex-display" style="color:var(--gold-senado)">MODO SENADO</span>
    </div>
</header>

<main>
    <aside class="sidebar" id="sidebar-main">
        <div style="font-size: 10px; color: var(--gold-senado); font-weight: 900; margin-bottom: 10px; opacity: 0.7;">MENU ADMINISTRATIVO</div>
        
        <button class="btn-side" style="background:var(--secondary);" onclick="window.ativarModoQuestoes()"><i class="fas fa-tasks"></i> QUESTÕES FGV</button>
        <button class="btn-side" style="background:#0f172a;" onclick="window.ativarTreinoLivre()"><i class="fas fa-file-alt"></i> NOVO PARECER</button>
        <button class="btn-side" style="background:var(--legislativo);" onclick="window.ativarModoTeses()"><i class="fas fa-gavel"></i> REGIMENTO INTERNO</button>
        
        <hr style="opacity:0.1; margin:10px 0">
        
        <button class="btn-side" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book"></i> VADE MECUM SENADO</button>
        <button class="btn-side" onclick="window.gerenciadorPasta()"><i class="fas fa-archive"></i> GAVETAS DE ARQUIVOS</button>
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.finalizarPeca()"><i class="fas fa-check-double"></i> FINALIZAR E SALVAR</button>
        
        <hr style="opacity:0.1; margin:10px 0">
        
        <button class="btn-side" style="background:#334155;" onclick="window.abrirPergaminho()"><i class="fas fa-scroll"></i> MODELOS TÉCNICOS</button>
        <button class="btn-side" style="background:#475569;" onclick="window.abrirMentoria()"><i class="fas fa-robot"></i> CONSULTOR IA</button>
        
        <div style="margin-top: auto; padding: 10px; font-size: 9px; opacity: 0.5; text-align: center;">
            SISTEMA JOAQUIM ELITE v2.0<br>SENADO FEDERAL 2026
        </div>
    </aside>

    <section class="editor-container" id="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomearTreino()">
                <i class="fas fa-file-signature"></i> <span>CARREGANDO DOCUMENTO...</span>
            </div>
            <div class="toolbar-liberdade">
                <button class="btn-lib" onclick="window.desfazer()"><i class="fas fa-undo"></i> Desfazer</button>
                
                <div class="highlight-box">
                    <button class="btn-lib" id="btn-highlight" onclick="window.toggleMarcaTexto()" style="padding: 5px;">
                        <i class="fas fa-highlighter"></i>
                    </button>
                    <div class="color-dot active" id="dot-yellow" style="background:#fef08a;" onclick="window.setHighlightColor('#fef08a', 'dot-yellow')"></div>
                    <div class="color-dot" id="dot-green" style="background:#bbf7d0;" onclick="window.setHighlightColor('#bbf7d0', 'dot-green')"></div>
                    <div class="color-dot" id="dot-orange" style="background:#fed7aa;" onclick="window.setHighlightColor('#fed7aa', 'dot-orange')"></div>
                    <div class="color-dot none" id="dot-none" style="background:#fff; border:1px solid #ddd; position:relative" onclick="window.setHighlightColor('transparent', 'dot-none')">
                        <div style="width: 100%; height: 1px; background: red; transform: rotate(45deg); position: absolute; top: 8px;"></div>
                    </div>
                </div>

                <button class="btn-lib" onclick="window.limparFolha()"><i class="fas fa-eraser"></i> Limpar</button>
                <button class="btn-lib" id="btn-foco" onclick="window.toggleRecolherEditor()"><i class="fas fa-columns"></i> DIVIDIR TELA</button>
                <button class="btn-lib" style="background:var(--primary); color:white; margin-left: auto;" onclick="window.print()"><i class="fas fa-print"></i> EXPORTAR PDF</button>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total"></div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div class="pdf-controls">
            <div>
                <button onclick="window.toggleRecolherEditor()" style="background:none; border:1px solid var(--gold-senado); color:var(--gold-senado); padding:5px 10px; border-radius:4px; font-size:10px; cursor:pointer;">
                    <i class="fas fa-expand-alt"></i> EDITOR FULL
                </button>
                <span id="pdf-title" style="margin-left:15px; font-size:11px; font-weight:800; color:white">REFERÊNCIA TÉCNICA</span>
            </div>
            <button onclick="window.fecharPDF()" style="background:var(--gold-senado); border:none; padding:5px 12px; border-radius:4px; font-weight:bold; cursor:pointer; color:var(--primary)">FECHAR X</button>
        </div>
        <iframe id="pdf-frame"></iframe>
    </section>

    <div id="mobile-hub">
        <button class="fab-main" onclick="window.toggleFoguete()"><i class="fas fa-briefcase"></i></button>
        <button class="fab-sub" style="background:var(--primary);" onclick="window.gerenciadorPasta()"><i class="fas fa-folder"></i></button>
        <button class="fab-sub" style="background:var(--legislativo);" onclick="window.ativarModoTeses()"><i class="fas fa-book"></i></button>
        <button class="fab-sub" style="background:var(--questoes);" onclick="window.ativarModoQuestoes()"><i class="fas fa-pencil-alt"></i></button>
        <button class="fab-sub" style="background:var(--gold-senado);" onclick="window.abrirPergaminho()"><i class="fas fa-scroll"></i></button>
    </div>
</main>

<div class="modal" id="universal-modal">
    <div class="modal-body">
        <div id="modal-back-btn" style="display:none; margin-bottom:15px; cursor:pointer; font-weight:bold; color:var(--primary)" onclick="window.gerenciadorPasta()">← VOLTAR</div>
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--gold-senado); padding-bottom:10px; font-size:1.2rem; color:var(--primary)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('universal-modal').style.display='none'" style="width:100%; padding:15px; background:#001f3d; color:#fff; border-radius:8px; margin-top:15px; font-weight:bold; cursor:pointer; border:none;">CONCLUÍDO</button>
    </div>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { FolhaEngine } from './folha-engine.js';

    // ================================================================
    // IDENTIDADE EXCLUSIVA DO PROJETO
    // ================================================================
    const PROJETO_ID = "SISTEMA_SENADO_FEDERAL"; 
    const PASTA_RAIZ = "C:/SistemaJoaquim/"; 

    window.db = db;
    // Chaves de memória exclusivas para não afetar o projeto OAB
    window.activeEx = localStorage.getItem('senado_activeEx') || "OFICIAL";
    window.modoQuestoes = localStorage.getItem('senado_modoQuestoes') === "true";
    window.modoTeses = localStorage.getItem('senado_modoTeses') === "true"; 
    window.pecaAtualNome = localStorage.getItem('senado_pecaAtualNome') || "NOVO PARECER";

    window.historicoUndo = [];
    let debounceTimer = null;
    window.marcaTextoAtivo = false;
    window.currentColor = '#fef08a';

    // BIBLIOTECA FOCO: SENADO FEDERAL (Busca na C:/SistemaJoaquim/)
    window.LISTA_PDF_BIBLIOTECA = [
        { nome: "REGIMENTO INTERNO - SENADO", url: PASTA_RAIZ + "regimento_interno.pdf" },
        { nome: "CONSTITUIÇÃO FEDERAL 1988", url: PASTA_RAIZ + "cf88.pdf" },
        { nome: "LEI 8.112/90 (ESTATUTO)", url: PASTA_RAIZ + "lei8112.pdf" },
        { nome: "PROCESSO LEGISLATIVO FGV", url: PASTA_RAIZ + "processo_legislativo.pdf" },
        { nome: "MANUAL DE REDAÇÃO LEGISLATIVA", url: PASTA_RAIZ + "manual_redacao.pdf" }
    ];

    window.onload = async () => {
        atualizarDisplayModo();
        FolhaEngine.montar('folha-total');
        
        setTimeout(() => {
            const ed = document.getElementById('editor-principal');
            if(ed) {
                ed.addEventListener('input', () => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        const html = ed.innerHTML;
                        if(window.historicoUndo[window.historicoUndo.length -1] !== html) {
                            window.historicoUndo.push(html);
                        }
                    }, 800);
                });
            }
        }, 1000);

        await carregarRascunho();
        setInterval(salvarAutomatico, 30000);
    };

    // --- GAVETAS INDEPENDENTES (SENADO) ---
    window.gerenciadorPasta = () => {
        const modal = document.getElementById('universal-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-back-btn').style.display = "none";
        document.getElementById('modal-title').innerText = "📂 GAVETAS: SENADO FEDERAL";
        content.innerHTML = `
            <div class="opt-btn" onclick="window.abrirGavetaEspecifica('QUESTÕES')"><span>QUESTÕES FGV</span> <i class="fas fa-question-circle" style="color:var(--questoes)"></i></div>
            <div class="opt-btn" onclick="window.abrirGavetaEspecifica('DISCURSIVAS')"><span>PARECERES / MINUTAS</span> <i class="fas fa-edit" style="color:#facc15"></i></div>
            <div class="opt-btn" onclick="window.abrirGavetaEspecifica('REGIMENTO')"><span>RESUMOS REGIMENTO</span> <i class="fas fa-scroll" style="color:var(--teses)"></i></div>
        `;
        modal.style.display = 'flex';
    };

    window.abrirGavetaEspecifica = async (tipoGaveta) => {
        const content = document.getElementById('modal-content');
        document.getElementById('modal-back-btn').style.display = "block";
        document.getElementById('modal-title').innerText = `📂 GAVETA: ${tipoGaveta}`;
        content.innerHTML = "<div style='text-align:center; padding:20px;'>Buscando arquivos do Senado...</div>";
        
        try {
            // AQUI É A CHAVE DA INDEPENDÊNCIA: Busca na pasta do Senado no Firebase
            const snap = await get(ref(db, `${PROJETO_ID}/HISTORICO`));
            content.innerHTML = "";
            if (snap.exists()) {
                const dados = snap.val();
                const filtrados = Object.keys(dados)
                    .map(k => ({ id: k, ...dados[k] }))
                    .filter(item => String(item.categoria) === String(tipoGaveta));
                
                if(filtrados.length === 0) { content.innerHTML = "Gaveta vazia."; return; }

                filtrados.reverse().forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'opt-btn';
                    div.style.marginBottom = "8px";
                    div.innerHTML = `<div onclick="window.carregarPecaPasta('${item.id}')" style="flex:1"><strong>${item.peca}</strong></div>
                                     <i class="fas fa-trash" style="color:red" onclick="window.deletarPecaPasta('${item.id}', '${tipoGaveta}')"></i>`;
                    content.appendChild(div);
                });
            } else { content.innerHTML = "Vazio."; }
        } catch (e) { content.innerHTML = "Erro ao conectar."; }
    };

    // --- SALVAMENTO BLINDADO NO FIREBASE DO SENADO ---
    window.finalizarPeca = async () => {
        const ed = document.getElementById('editor-principal');
        if(!ed) return;
        
        const categoria = window.modoQuestoes ? "QUESTÕES" : (window.modoTeses ? "REGIMENTO" : "DISCURSIVAS");
        const nomeAlvo = window.pecaAtualNome;
        
        if(!confirm(`Salvar "${nomeAlvo}" no projeto SENADO FEDERAL?`)) return;

        try {
            const idFinal = Date.now().toString();
            const dataF = new Date().toLocaleString('pt-BR');
            
            await set(ref(db, `${PROJETO_ID}/HISTORICO/${idFinal}`), {
                categoria: categoria,
                peca: `${nomeAlvo} (${dataF})`,
                conteudo: ed.innerHTML
            });
            alert("✅ ARQUIVO SALVO NO PROJETO SENADO!");
        } catch (e) { alert("Erro ao salvar."); }
    };

    window.carregarPecaPasta = async (id) => {
        const snap = await get(ref(db, `${PROJETO_ID}/HISTORICO/${id}`));
        if(snap.exists()){
            document.getElementById('editor-principal').innerHTML = snap.val().conteudo;
            window.pecaAtualNome = snap.val().peca.split(' (')[0];
            document.getElementById('universal-modal').style.display='none';
            persistirMemoria();
            atualizarDisplayModo();
        }
    };

    // --- FUNÇÕES DE INTERFACE ---
    window.verPDF = (t) => {
        const v = document.getElementById('pdf-viewer');
        const f = document.getElementById('pdf-frame');
        // Mapeia para os nomes reais dos seus arquivos na pasta C:/SistemaJoaquim/
        let arquivo = t === 'P' ? "prova_senado.pdf" : (t === 'G' ? "gabarito_senado.pdf" : "vade_mecum.pdf");
        f.src = PASTA_RAIZ + arquivo;
        v.classList.add('active');
        window.toggleRecolherEditor();
    };

    window.atualizarDisplayModo = () => {
        document.getElementById('ex-display').innerText = "SENADO FEDERAL";
        document.getElementById('identificador-peca').innerHTML = `${window.pecaAtualNome} <i class="fas fa-pen"></i>`;
    };

    function persistirMemoria() {
        localStorage.setItem('senado_activeEx', window.activeEx);
        localStorage.setItem('senado_modoQuestoes', window.modoQuestoes);
        localStorage.setItem('senado_modoTeses', window.modoTeses);
        localStorage.setItem('senado_pecaAtualNome', window.pecaAtualNome);
    }

    async function salvarAutomatico() { 
        const ed = document.getElementById('editor-principal'); 
        if(ed) await set(ref(db, `${PROJETO_ID}/RASCUNHO_LIVE`), { conteudo: ed.innerHTML }); 
    }

    async function carregarRascunho() { 
        const snap = await get(ref(db, `${PROJETO_ID}/RASCUNHO_LIVE`)); 
        if(snap.exists()) document.getElementById('editor-principal').innerHTML = snap.val().conteudo; 
    }

    // Mantendo as funções de utilidade do seu projeto original
    window.renomearTreino = () => { const n = prompt("Nome do Estudo:", window.pecaAtualNome); if(n) { window.pecaAtualNome=n; persistirMemoria(); atualizarDisplayModo(); } };
    window.toggleRecolherEditor = () => { document.getElementById('editor-container').classList.toggle('collapsed'); document.getElementById('pdf-viewer').classList.toggle('full-view'); };
    window.fecharPDF = () => { document.getElementById('pdf-viewer').classList.remove('active', 'full-view'); document.getElementById('editor-container').classList.remove('collapsed'); };
    window.toggleFoguete = () => document.getElementById('mobile-hub').classList.toggle('active');
    window.limparFolha = () => { if(confirm("Limpar tudo?")) document.getElementById('editor-principal').innerHTML = ""; };
    window.abrirBibliotecaPDF = () => { /* ... lógica de biblioteca simplificada já inclusa acima ... */ };
    
</script>
