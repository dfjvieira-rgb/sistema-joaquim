<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MASTER GAVETAS</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --juris: #4338ca;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: var(--primary); height: 55px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000; 
        }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR */
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 12px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .btn-side { 
            width: 48px; height: 48px; border: none; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); transform: scale(1.05); }
        .btn-side i { font-size: 1.2rem; color: var(--gold); }
        .btn-side::after {
            content: attr(data-label); position: absolute; left: 65px; background: #000; 
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 10px; 
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000;
            border: 1px solid var(--gold); font-weight: bold;
        }
        .btn-side:hover::after { opacity: 1; }

        /* MARCA TEXTO TOOLS */
        .highlighter-tools {
            display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 5px;
            background: rgba(0,0,0,0.2); border-radius: 10px;
        }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-dot.active { border-color: white; transform: scale(1.2); }

        /* EDITOR WRAPPER */
        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); 
            overflow-y: auto; align-items: center; padding: 25px;
        }

        .sticky-header {
            width: 100%; max-width: 900px; background: #f8fafc; padding: 12px;
            border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0;
            color: #020617; font-weight: 900; text-align: center;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* FOLHA ENGINE ESTILOS INTEGRADOS */
        .folha-moldura { width: 100%; max-width: 900px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); margin-bottom: 50px; }
        
        /* O CSS da sua FolhaEngine injetado via Style */
        .folha-container { display: grid; grid-template-columns: 50px 1fr; background: #fff; font-family: 'Courier New', Courier, monospace; border: 2px solid #000; position: relative; }
        .numeracao { background: #f1f5f9; border-right: 2px solid #000; user-select: none; }
        .num-mecanico { height: 35px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; border-bottom: 1px solid #cbd5e1; color: #1e293b; box-sizing: border-box; }
        .area-editor { 
            outline: none; font-size: 19px !important; font-weight: 700 !important; color: #000 !important; 
            line-height: 35px !important; padding: 0 20px !important; white-space: pre-wrap; word-wrap: break-word; 
            min-height: 1500px; background-image: linear-gradient(to bottom, transparent 34px, #e2e8f0 34px);
            background-size: 100% 35px; background-repeat: repeat-y; background-position: 0 -1px; text-align: justify;
        }

        /* MODAIS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 92%; max-width: 550px; padding: 25px; border-radius: 20px; color: #0f172a; max-height: 85vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 14px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #1e293b; }
        .opt-btn:hover { background: var(--gold); }
        .item-historico { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; margin-bottom: 10px; color: #1e293b; }
        .item-actions { display: flex; gap: 15px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        .btn-action { cursor: pointer; font-size: 11px; font-weight: bold; color: var(--info); }
        .btn-action.del { color: var(--perigo); }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:900;">JOAQUIM <span style="color:var(--gold)">ELITE</span> 2026</div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold);">00:00:00</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="SALVAR NA GAVETA" style="background:var(--sucesso);" onclick="window.modalSalvar()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="MINHAS GAVETAS" onclick="window.abrirGavetas()"><i class="fas fa-box-open"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <div class="highlighter-tools">
            <div class="color-dot" id="dot-yellow" style="background:#fef08a;" onclick="window.setHighlightColor('#fef08a', 'dot-yellow')"></div>
            <div class="color-dot" id="dot-green" style="background:#bbf7d0;" onclick="window.setHighlightColor('#bbf7d0', 'dot-green')"></div>
            <div class="color-dot" id="dot-blue" style="background:#bfdbfe;" onclick="window.setHighlightColor('#bfdbfe', 'dot-blue')"></div>
            <button class="btn-side" id="btn-highlighter" data-label="MARCA TEXTO" onclick="window.toggleHighlight()" style="height:35px; width:35px; margin-top:5px;"><i class="fas fa-highlighter"></i></button>
        </div>

        <button class="btn-side" data-label="ESTRUTURAS (PERGAMINHO)" onclick="window.abrirGavetas()"><i class="fas fa-scroll"></i></button>
        <button class="btn-side" data-label="LIMPAR TELA" style="background:var(--perigo); margin-top:auto" onclick="window.limpar()"><i class="fas fa-eraser"></i></button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container">
            <div class="sticky-header">
                <span id="info-pasta" style="font-size: 10px; color: #64748b;">GAVETA: CADERNO</span>
                <span id="txt-titulo-topo">NOVO DOCUMENTO</span>
                <i class="fas fa-edit" style="cursor:pointer; font-size:12px;" onclick="window.renomearAtual()"></i>
            </div>
            
            <div class="folha-moldura" id="engine-container">
                </div>
        </section>
    </div>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--gold); padding-bottom:10px;"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; margin-top:20px; padding:15px; background:black; color:white; border-radius:10px; cursor:pointer;">FECHAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- INTEGRANDO A SUA FOLHA ENGINE ---
    const FolhaEngine = {
        montar: (containerId) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = "";
            const folha = document.createElement('div');
            folha.className = 'folha-container';
            const numCol = document.createElement('div');
            numCol.className = 'numeracao';
            for(let i=1; i<=150; i++) {
                const n = document.createElement('div');
                n.className = 'num-mecanico';
                n.innerText = i;
                numCol.appendChild(n);
            }
            const editor = document.createElement('div');
            editor.className = 'area-editor';
            editor.id = 'editor-principal';
            editor.contentEditable = "true";
            editor.spellcheck = false;
            folha.appendChild(numCol);
            folha.appendChild(editor);
            container.appendChild(folha);

            // Tab fix
            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const sel = window.getSelection();
                    const range = sel.getRangeAt(0);
                    const tabNode = document.createTextNode("    ");
                    range.insertNode(tabNode);
                    range.setStartAfter(tabNode);
                    range.setEndAfter(tabNode);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            });
        }
    };

    // Inicializa a folha
    FolhaEngine.montar('engine-container');

    const GAVETAS = ["PECAS", "TESES", "PRELIMINARES", "QUESTOES", "CADERNO"];
    window.currentColor = '#fef08a';
    window.highlightActive = false;

    // --- MARCA TEXTO ---
    window.setHighlightColor = (color, id) => {
        window.currentColor = color;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.toggleHighlight(true);
    };

    window.toggleHighlight = (force = null) => {
        window.highlightActive = force !== null ? force : !window.highlightActive;
        const btn = document.getElementById('btn-highlighter');
        btn.style.background = window.highlightActive ? window.currentColor : 'transparent';
        btn.style.color = window.highlightActive ? 'black' : 'var(--gold)';
    };

    document.addEventListener('mouseup', () => {
        if(window.highlightActive) {
            const sel = window.getSelection();
            if(sel.toString().length > 0) document.execCommand('backColor', false, window.currentColor);
        }
    });

    // --- GESTÃO DE ARQUIVOS ---
    window.modalSalvar = () => {
        const content = document.getElementById('modal-content');
        const titulo = document.getElementById('txt-titulo-topo').innerText;
        document.getElementById('modal-title').innerText = "SALVAR NA GAVETA";
        content.innerHTML = `
            <input type="text" id="save-name" placeholder="NOME DO ARQUIVO" value="${titulo}" style="width:100%; padding:15px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc; font-weight:bold;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                ${GAVETAS.map(g => `<button class="opt-btn" onclick="window.executarSalvar('${g}')">${g}</button>`).join('')}
            </div>
        `;
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.executarSalvar = async (gaveta) => {
        const nome = document.getElementById('save-name').value.toUpperCase() || "SEM TITULO";
        const html = document.getElementById('editor-principal').innerHTML;
        const path = `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}`;
        
        const snap = await get(ref(db, path));
        let idFinal = Date.now().toString();

        if(snap.exists()) {
            const existente = Object.entries(snap.val()).find(([id, data]) => data.nome === nome);
            if(existente) {
                if(!confirm("Arquivo já existe. Sobrescrever?")) return;
                idFinal = existente[0];
            }
        }

        await set(ref(db, `${path}/${idFinal}`), {
            nome: nome,
            conteudo: btoa(unescape(encodeURIComponent(html))),
            data: new Date().toLocaleString('pt-BR')
        });

        document.getElementById('txt-titulo-topo').innerText = nome;
        document.getElementById('info-pasta').innerText = `GAVETA: ${gaveta}`;
        alert("Salvo com sucesso!");
        document.getElementById('modal-base').style.display = 'none';
    };

    window.abrirGavetas = () => {
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "MINHAS GAVETAS";
        content.innerHTML = GAVETAS.map(g => `
            <div class="opt-btn" onclick="window.listarArquivos('${g}')">
                <span>${g}</span> <i class="fas fa-chevron-right"></i>
            </div>
        `).join('');
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.listarArquivos = async (gaveta) => {
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = `GAVETA: ${gaveta}`;
        content.innerHTML = "Carregando...";
        
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}`));
        if(!snap.exists()) { content.innerHTML = "Gaveta vazia."; return; }

        let html = "";
        Object.entries(snap.val()).reverse().forEach(([id, item]) => {
            html += `
                <div class="item-historico">
                    <div style="cursor:pointer; font-weight:bold;" onclick="window.carregarArquivo('${gaveta}', '${id}')">${item.nome}</div>
                    <div style="font-size:10px; color:#666;">${item.data}</div>
                    <div class="item-actions">
                        <span class="btn-action" onclick="window.renomearHistorico('${gaveta}', '${id}', '${item.nome}')">RENOMEAR</span>
                        <span class="btn-action" onclick="window.moverArquivo('${gaveta}', '${id}')">MOVER</span>
                        <span class="btn-action del" onclick="window.excluirArquivo('${gaveta}', '${id}')">EXCLUIR</span>
                    </div>
                </div>
            `;
        });
        content.innerHTML = html;
    };

    window.carregarArquivo = async (gaveta, id) => {
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}/${id}`));
        if(snap.exists()){
            const data = snap.val();
            document.getElementById('editor-principal').innerHTML = decodeURIComponent(escape(atob(data.conteudo)));
            document.getElementById('txt-titulo-topo').innerText = data.nome;
            document.getElementById('info-pasta').innerText = `GAVETA: ${gaveta}`;
            document.getElementById('modal-base').style.display = 'none';
        }
    };

    window.renomearHistorico = async (gaveta, id, antigo) => {
        const novo = prompt("Novo nome:", antigo);
        if(novo) {
            await update(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}/${id}`), { nome: novo.toUpperCase() });
            window.listarArquivos(gaveta);
        }
    };

    window.moverArquivo = async (origem, id) => {
        const dest = prompt(`Mover para: ${GAVETAS.join(', ')}`).toUpperCase();
        if(GAVETAS.includes(dest)) {
            const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${origem}/${id}`));
            await set(ref(db, `SISTEMA_JOAQUIM/GAVETAS/${dest}/${id}`), snap.val());
            await remove(ref(db, `SISTEMA_JOAQUIM/GAVETAS/${origem}/${id}`));
            window.listarArquivos(origem);
        }
    };

    window.excluirArquivo = async (gaveta, id) => {
        if(confirm("Excluir arquivo?")) {
            await remove(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}/${id}`));
            window.listarArquivos(gaveta);
        }
    };

    window.renomearAtual = () => {
        const n = prompt("Nome do documento:", document.getElementById('txt-titulo-topo').innerText);
        if(n) document.getElementById('txt-titulo-topo').innerText = n.toUpperCase();
    };

    window.limpar = () => confirm("Limpar tela?") && (document.getElementById('editor-principal').innerHTML = "");
    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);

</script>
</body>
</html>
