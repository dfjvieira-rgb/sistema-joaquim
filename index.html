<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA LEGISLATIVO TOTAL | PMDF & SENADO</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00274d; --secondary: #1e3a8a; --accent: #e5e7eb; 
            --gold-senado: #c5a059; --bg-paper: #cbd5e1; --sidebar-w: 260px;
            --sucesso: #166534; --legislativo: #1e40af; --perigo: #991b1b;
        }
        body.dark-mode { --bg-paper: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        header { background: linear-gradient(90deg, var(--primary) 0%, #004080 100%); height: 60px; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold-senado); z-index: 5000; }
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: var(--sidebar-w); background: #001f3d; display: flex; flex-direction: column; gap: 8px; padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; }
        .btn-side { width: 100%; min-height: 42px; border: none; border-radius: 6px; display: flex; align-items: center; padding: 0 15px; color: white; font-weight: 600; cursor: pointer; gap: 12px; font-size: 0.7rem; text-transform: uppercase; transition: 0.2s; background: rgba(255,255,255,0.05); }
        .btn-side:hover { background: rgba(255,255,255,0.12); border-left: 3px solid var(--gold-senado); }
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 20px 10px; }
        .sticky-tools { position: sticky; top: -20px; z-index: 1000; background: #fff; width: 100%; max-width: 850px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 15px; }
        #identificador-peca { padding: 12px; background: #f8fafc; text-align: left; padding-left: 20px; font-weight: 800; color: var(--primary); border-bottom: 2px solid var(--gold-senado); cursor: pointer; font-size: 0.85rem; }
        .paper { width: 100%; max-width: 850px; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.2); min-height: 1000px; padding: 50px; color: #1e293b; }
        #folha-total { outline: none; min-height: 900px; line-height: 1.6; font-size: 16px; }
        #pdf-viewer { width: 0; background: #1e293b; transition: 0.4s; display: flex; flex-direction: column; overflow: hidden; visibility: hidden; }
        #pdf-viewer.active { width: 50%; visibility: visible; border-left: 4px solid var(--gold-senado); }
        #pdf-viewer iframe { flex: 1; border: none; background: white; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 110000; align-items: center; justify-content: center; padding: 20px; }
        .modal-body { background: white; width: 100%; max-width: 550px; padding: 25px; border-radius: 12px; color: #0f172a; max-height: 90vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 10px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #ddd; background: #f8fafc; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; font-size: 0.75rem; align-items: center; color: var(--primary); }
        .opt-btn:hover { background: var(--primary); color: white; }
        .tag-lei { font-size: 9px; background: #00274d; color: #fff; padding: 2px 6px; border-radius: 4px; min-width: 70px; text-align: center; margin-right: 10px; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo"><i class="fas fa-balance-scale"></i> ARSENAL <span>LEGISLATIVO TOTAL</span></div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold-senado);"></div>
</header>

<main>
    <aside class="sidebar">
        <div style="font-size: 10px; color: var(--gold-senado); font-weight: 900; margin-bottom: 10px; letter-spacing: 1px;">SISTEMA OPERACIONAL</div>
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.salvarNasGavetas()"><i class="fas fa-sync"></i> SINCRONIZAR GAVETA</button>
        <button class="btn-side" style="background:var(--secondary);" onclick="window.abrirGavetas()"><i class="fas fa-box-archive"></i> ABRIR ARQUIVOS</button>
        
        <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        
        <button class="btn-side" style="background:var(--legislativo);" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book-atlas"></i> VADE MECUM TOTAL</button>
        <button class="btn-side" style="background:var(--perigo);" onclick="window.limparTela()"><i class="fas fa-eraser"></i> LIMPAR TELA</button>
    </aside>

    <section class="editor-container">
        <div class="sticky-tools">
            <div id="identificador-peca" onclick="window.renomear()">
                <i class="fas fa-file-signature"></i> <span>ESTUDO SEM TÍTULO</span>
            </div>
        </div>
        <div class="paper">
            <div id="folha-total" contenteditable="true" spellcheck="false">
                <b>ESTADO DE PRONTIDÃO:</b> Legislação completa e sistema de gavetas sincronizado.<br><br>
            </div>
        </div>
    </section>

    <section id="pdf-viewer">
        <div style="background:var(--primary); padding:10px; display:flex; justify-content:space-between; align-items:center;">
            <span id="pdf-title" style="color:white; font-size:10px; font-weight:bold;">REFERÊNCIA LEGISLATIVA</span>
            <button onclick="window.fecharPDF()" style="background:var(--gold-senado); border:none; padding:4px 10px; border-radius:4px; font-weight:bold; cursor:pointer;">X FECHAR</button>
        </div>
        <iframe id="pdf-frame" src=""></iframe>
    </section>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:15px; border-bottom:2px solid var(--gold-senado); padding-bottom:10px; font-size:1rem; color:var(--primary)"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; padding:10px; background:black; color:white; border-radius:6px; margin-top:15px; cursor:pointer; border:none;">VOLTAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1",
        storageBucket: "masteroab-db5e1.appspot.com",
        messagingSenderId: "620234160245",
        appId: "1:620234160245:web:8651817c66144e59f42668"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const BASE_PATH = "SISTEMA_MENTORIA_LEGISLATIVA/GAVETAS";

    window.pecaNome = "ESTUDO SEM TÍTULO";

    const CATEGORIAS = [
        { id: "PARECERES", nome: "Peças e Pareceres", icon: "fa-file-contract" },
        { id: "DISCURSIVAS", nome: "Questões Discursivas", icon: "fa-pen-to-square" },
        { id: "RESUMOS", nome: "Resumos de Lei", icon: "fa-book-open" },
        { id: "SIMULADOS", nome: "Simulados e Provas", icon: "fa-list-check" }
    ];

    const LEIS_ACERVO = [
        { n: "CP", t: "Código Penal", u: "https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm" },
        { n: "CPP", t: "Código de Processo Penal", u: "https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689.htm" },
        { n: "CF/88", t: "Constituição Federal", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" },
        { n: "L. 9.882", t: "ADPF", u: "https://www.planalto.gov.br/ccivil_03/leis/l9882.htm" },
        { n: "L. 9.868", t: "ADI/ADC", u: "https://www.planalto.gov.br/ccivil_03/leis/l9868.htm" },
        { n: "L. 7.960", t: "Prisão Temporária", u: "https://www.planalto.gov.br/ccivil_03/leis/l7960.htm" },
        { n: "L. 9.099", t: "JECRIM", u: "https://www.planalto.gov.br/ccivil_03/leis/l9099.htm" },
        { n: "L. 9.296", t: "Interceptação", u: "https://www.planalto.gov.br/ccivil_03/leis/l9296.htm" },
        { n: "L. 11.340", t: "Maria da Penha", u: "https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11340.htm" },
        { n: "L. 12.850", t: "Orcrim", u: "https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/lei/l12850.htm" },
        { n: "L. 12.037", t: "Id. Criminal", u: "https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/lei/l12037.htm" },
        { n: "RISF", t: "Regimento Senado", u: "https://www25.senado.leg.br/web/atividade/regimento-interno" }
    ];

    window.salvarNasGavetas = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "SINCRONIZAR NA GAVETA";
        content.innerHTML = `<p style="font-size:11px; margin-bottom:10px;">Arquivo: <b>${window.pecaNome}</b></p>`;

        CATEGORIAS.forEach(cat => {
            const btn = document.createElement('div');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas ${cat.icon}"></i> &nbsp; ${cat.nome}</span>`;
            btn.onclick = async () => {
                const conteudo = document.getElementById('folha-total').innerHTML;
                const path = `${BASE_PATH}/${cat.id}`;
                const snap = await get(ref(db, path));
                let keyEncontrada = null;
                if (snap.exists()) {
                    const dados = snap.val();
                    keyEncontrada = Object.keys(dados).find(key => dados[key].nome === window.pecaNome);
                }
                const finalKey = keyEncontrada || Date.now().toString();
                await set(ref(db, `${path}/${finalKey}`), { nome: window.pecaNome, data: new Date().toLocaleString(), conteudo: conteudo });
                alert(keyEncontrada ? "Versão Atualizada!" : "Novo Arquivo Salvo!");
                modal.style.display = 'none';
            };
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.abrirGavetas = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "ABRIR GAVETA";
        content.innerHTML = "";
        CATEGORIAS.forEach(cat => {
            const btn = document.createElement('div');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span><i class="fas ${cat.icon}"></i> &nbsp; ${cat.nome}</span>`;
            btn.onclick = () => window.listarArquivos(cat.id, cat.nome);
            content.appendChild(btn);
        });
        modal.style.display = 'flex';
    };

    window.listarArquivos = async (catId, catNome) => {
        const content = document.getElementById('modal-content');
        content.innerHTML = "Lendo base de dados...";
        const snap = await get(ref(db, `${BASE_PATH}/${catId}`));
        content.innerHTML = `<div onclick="window.abrirGavetas()" style="cursor:pointer; color:var(--secondary); font-weight:bold; margin-bottom:10px;">← Voltar</div>`;
        if (snap.exists()) {
            Object.keys(snap.val()).reverse().forEach(k => {
                const item = snap.val()[k];
                const d = document.createElement('div');
                d.className = 'opt-btn';
                d.innerHTML = `<span>${item.nome} <br><small style="font-size:9px; opacity:0.7">${item.data}</small></span>`;
                d.onclick = () => {
                    document.getElementById('folha-total').innerHTML = item.conteudo;
                    window.pecaNome = item.nome;
                    document.getElementById('identificador-peca').querySelector('span').innerText = item.nome;
                    document.getElementById('modal-base').style.display = 'none';
                };
                content.appendChild(d);
            });
        } else { content.innerHTML += "<p>Gaveta Vazia.</p>"; }
    };

    window.abrirBibliotecaPDF = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "ACERVO LEGISLATIVO";
        content.innerHTML = "";
        LEIS_ACERVO.forEach(lei => {
            const d = document.createElement('div');
            d.className = 'opt-btn';
            d.innerHTML = `<span><span class="tag-lei">${lei.n}</span> ${lei.t}</span>`;
            d.onclick = () => {
                document.getElementById('pdf-frame').src = lei.u;
                document.getElementById('pdf-title').innerText = lei.n;
                document.getElementById('pdf-viewer').classList.add('active');
                modal.style.display = 'none';
            };
            content.appendChild(d);
        });
        modal.style.display = 'flex';
    };

    window.fecharPDF = () => document.getElementById('pdf-viewer').classList.remove('active');
    window.renomear = () => { const n = prompt("NOME DO TRABALHO:", window.pecaNome); if(n) { window.pecaNome = n.toUpperCase(); document.getElementById('identificador-peca').querySelector('span').innerText = n; } };
    window.limparTela = () => confirm("Deseja limpar?") && (document.getElementById('folha-total').innerHTML = "");
    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString('pt-BR'); }, 1000);
</script>
</body>
</html>
