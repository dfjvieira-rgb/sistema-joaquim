<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MPU SIMULADOR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 70px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --juris: #4338ca; --fgv-blue: #004a8d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        header { background: var(--primary); height: 55px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); z-index: 5000; }
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: var(--sidebar-w); background: #1e293b; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .btn-side { width: 48px; height: 48px; border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.05); position: relative; }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); transform: scale(1.05); }
        .btn-side i { font-size: 1.2rem; color: var(--gold); }
        .btn-side::after { content: attr(data-label); position: absolute; left: 65px; background: #000; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 10px; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000; border: 1px solid var(--gold); font-weight: bold; }
        .btn-side:hover::after { opacity: 1; }
        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); overflow-y: auto; align-items: center; padding: 25px; }
        .sticky-header { width: 100%; max-width: 850px; background: #f8fafc; padding: 15px; border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0; color: #020617; font-weight: 900; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .paper { width: 100%; max-width: 850px; background: white; min-height: 1200px; padding: 60px; color: #1e293b; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        #folha-total { outline: none; min-height: 1000px; line-height: 1.6; font-size: 15px; text-align: justify; color: #000; }
        
        /* Estilização da Prova Injetada */
        .prova-header { border: 2px solid #000; padding: 15px; text-align: center; margin-bottom: 30px; }
        .questao-box { margin-bottom: 25px; page-break-inside: avoid; }
        .q-num { font-weight: bold; color: var(--fgv-blue); margin-right: 8px; }
        .alternativas { list-style: none; margin-left: 20px; margin-top: 10px; }
        .alternativas li { margin-bottom: 5px; }
        .redacao-area { border-top: 2px dashed #000; margin-top: 40px; padding-top: 20px; }
        .linha-redacao { border-bottom: 1px solid #ccc; height: 30px; margin-bottom: 5px; }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:900; letter-spacing: 1px;">JOAQUIM <span style="color:var(--gold)">MPU ELITE</span></div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold);">00:00:00</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="INJETAR PROVA PDF" style="background:var(--redacao);" onclick="window.injetarProva()"><i class="fas fa-file-import"></i></button>
        
        <div style="height:1px; width:30px; background:rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="btn-side" data-label="SALVAR ATUALIZAR" style="background:var(--sucesso);" onclick="window.modalSalvar()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="ABRIR GAVETAS" onclick="window.abrirGavetas()"><i class="fas fa-folder-open"></i></button>
        <button class="btn-side" data-label="LIMPAR TELA" style="background:var(--perigo);" onclick="window.limpar()"><i class="fas fa-eraser"></i></button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container" id="container-folha">
            <div class="sticky-header">
                <i class="fas fa-pen-nib"></i> <span id="txt-titulo-topo">AMBIENTE DE PROVA SIMULADO</span>
            </div>
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p style="text-align: center; color: #666;">Clique no ícone de Importar (Laranja) para carregar o conteúdo do AnalistaMPU.pdf aqui...</p>
                </div>
            </div>
        </section>
    </div>
</main>

<script>
    window.injetarProva = () => {
        const area = document.getElementById('folha-total');
        area.innerHTML = `
            <div class="prova-header">
                <h2 style="margin:0">MINISTÉRIO PÚBLICO DA UNIÃO</h2>
                <h3 style="margin:5px 0">ANALISTA DO MPU - DIREITO | TIPO 1-BRANCA</h3>
                <p style="font-size:12px">Tempo disponível: 4 horas e 30 minutos [cite: 11, 20]</p>
            </div>

            <h4 style="background:#eee; padding:5px; border-left:5px solid #000; margin-bottom:15px;">MÓDULO I - LÍNGUA PORTUGUESA</h4>

            <div class="questao-box">
                <span class="q-num">01.</span> Leia o texto abaixo: <br>
                "O problema em matéria de audição vem do fato de que o cérebro é um órgão muito rápido e que se pensa muito mais depressa do que se fala. Assim que escutamos uma pessoa, solicitamos ao cérebro que trabalhe muito mais lentamente em comparação com sua capacidade..." [cite: 41-42]
                <br><br>Levando em consideração que o conteúdo temático do texto é de difícil acesso pelo leitor comum, o processo utilizado para tornar esse conteúdo mais claro foi:
                <ul class="alternativas">
                    <li>(A) indicar a estruturação do texto no início da leitura;</li>
                    <li>(B) acrescentar exemplos práticos ao texto;</li>
                    <li>(C) reformular as informações já dadas;</li>
                    <li>(D) utilizar sinônimos mais comuns para termos difíceis;</li>
                    <li>(E) repetir informações com os mesmos termos.</li>
                </ul>
            </div>

            <div class="questao-box">
                <span class="q-num">16.</span> Em relação aos princípios, normas e regras estabelecidos no Art. 225 da Constituição Federal sobre Meio Ambiente, é correto afirmar que: [cite: 182-183]
                <ul class="alternativas">
                    <li>(A) será inferior à dos combustíveis fósseis o regime fiscal para os biocombustíveis...</li>
                    <li>(B) são consideradas cruéis as práticas desportivas que utilizem animais...</li>
                    <li>(C) são patrimônio nacional os biomas da floresta amazônica, mata atlântica, caatinga... [cite: 186]</li>
                    <li>(D) incumbe ao poder público o dever de preservar e manter os processos ecológicos...</li>
                    <li>(E) incumbe ao poder público definir os espaços territoriais especialmente protegidos... [cite: 188]</li>
                </ul>
            </div>

            <div class="redacao-area">
                <h3 style="text-align:center">PROVA DISCURSIVA - REDAÇÃO</h3>
                <p style="font-size:13px; margin:10px 0;">Utilize as linhas abaixo para a transcrição definitiva da sua redação. Não assine nem rubrique fora do local apropriado[cite: 18, 27].</p>
                ${Array(30).fill('<div class="linha-redacao"></div>').join('')}
            </div>
        `;
        document.getElementById('txt-titulo-topo').innerText = "PROVA CARREGADA: ANALISTA MPU";
        alert("Conteúdo integral injetado na folha de treino!");
    };

    window.limpar = () => confirm("Deseja limpar a folha?") && (document.getElementById('folha-total').innerHTML = "");
    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
