<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA JURÍDICO | MPU ELITE MOBILE</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --mpu-green: #064e3b; --mpu-blue: #0c4a6e; --mpu-gold: #b45309;
            --bg-paper: #cbd5e1; --sidebar-w: 260px; --sucesso: #166534; --perigo: #991b1b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--mpu-blue); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: linear-gradient(90deg, #001a33 0%, var(--mpu-green) 100%); 
            height: 60px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid var(--mpu-gold); z-index: 5000; 
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo { font-size: 0.8rem; font-weight: bold; }
        #toggle-menu { background: none; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px; border-radius: 4px; cursor: pointer; }
        
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR MOBILE-FRIENDLY */
        .sidebar { 
            width: var(--sidebar-w); background: #020617; display: flex; flex-direction: column; gap: 8px; 
            padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; z-index: 6000;
            transition: transform 0.4s ease; position: absolute; height: 100%;
        }
        .sidebar.collapsed { transform: translateX(-100%); }
        
        .btn-side { 
            width: 100%; min-height: 45px; border: none; border-radius: 6px; 
            display: flex; align-items: center; padding: 0 15px; 
            color: white; font-weight: 600; cursor: pointer; gap: 10px; font-size: 0.75rem;
            background: rgba(255,255,255,0.05); margin-bottom: 5px;
        }

        /* CONTENT WRAPPER */
        .content-wrapper { flex: 1; display: flex; width: 100%; position: relative; overflow: hidden; }

        /* EDITOR CONTAINER */
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); 
            overflow-y: auto; align-items: center; padding: 10px; transition: 0.3s;
            width: 100%;
        }

        /* PAPER OTIMIZADA PARA MOBILE */
        .paper { 
            width: 100%; max-width: 850px; background: white; min-height: 1200px; 
            padding: 30px 20px; color: #1e293b; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            line-height: 28px;
        }
        #folha-total { outline: none; min-height: 800px; font-family: 'Courier New', monospace; font-size: 16px; }

        /* PDF VIEWER - 100% NO MOBILE */
        #pdf-viewer { 
            position: absolute; right: 0; top: 0; width: 0%; height: 100%;
            background: white; transition: all 0.4s ease; 
            display: flex; flex-direction: column; overflow: hidden; z-index: 4000;
        }
        /* Quando ativo no Mobile, ele cobre 100% */
        .content-wrapper.dual-active #pdf-viewer { width: 100%; }
        
        /* Ajuste para Desktop (Telas acima de 1024px mantém o 50/50) */
        @media (min-width: 1024px) {
            .sidebar { position: relative; transform: none; }
            .sidebar.collapsed { margin-left: -260px; transform: none; }
            .content-wrapper.dual-active #pdf-viewer { width: 50%; border-left: 4px solid var(--mpu-gold); }
            .content-wrapper.dual-active .editor-container { flex: 0 0 50%; }
        }

        /* BOTÃO FLUTUANTE DE ALTERNÂNCIA (Aparece só quando PDF está aberto) */
        #btn-switch-view {
            display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            background: var(--mpu-gold); color: white; border: none; width: 60px; height: 60px;
            border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-size: 20px; cursor: pointer;
        }
        .dual-active #btn-switch-view { display: flex; align-items: center; justify-content: center; }

        #pdf-frame { flex: 1; border: none; }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <button id="toggle-menu" onclick="window.alternarSidebar()"><i class="fas fa-bars"></i></button>
        <div class="logo">ARSENAL MPU</div>
    </div>
    <div id="timer-box"><span id="sessao-timer">00:00</span></div>
</header>

<main>
    <aside class="sidebar collapsed" id="sidebar-menu">
        <button class="btn-side" style="background:var(--sucesso);" onclick="window.salvarNasGavetas()"><i class="fas fa-save"></i> SALVAR</button>
        <button class="btn-side" onclick="window.abrirGavetas()"><i class="fas fa-box-archive"></i> ARQUIVOS</button>
        <div style="margin: 5px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        <button class="btn-side" onclick="window.abrirBibliotecaPDF()"><i class="fas fa-book-atlas"></i> VADE MECUM</button>
        <button class="btn-side" style="background:#4338ca;" onclick="window.abrirJurisprudencia()"><i class="fas fa-gavel"></i> JURIS</button>
        <button class="btn-side" style="background:#c2410c;" onclick="window.abrirRedacao()"><i class="fas fa-pen-nib"></i> DISCURSIVA</button>
        <button class="btn-side" style="background:#0369a1;" onclick="window.inteligenciaNaoConfunda()"><i class="fas fa-lightbulb"></i> DICAS</button>
        <button class="btn-side" style="background:var(--perigo);" onclick="window.limparTela()"><i class="fas fa-eraser"></i> LIMPAR</button>
    </aside>

    <div class="content-wrapper" id="master-wrapper">
        <section class="editor-container" id="section-editor">
            <div class="paper">
                <div id="folha-total" contenteditable="true" spellcheck="false">
                    <p style="text-align: center;"><b>MINISTÉRIO PÚBLICO DA UNIÃO</b></p>
                    <hr style="margin: 15px 0;">
                </div>
            </div>
        </section>

        <section id="pdf-viewer">
            <div style="background:#001a33; padding:12px; display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid var(--mpu-gold);">
                <span id="pdf-title" style="font-size:10px; font-weight:bold; color:white;">CONSULTA</span>
                <button onclick="window.fecharPDF()" style="background:var(--perigo); border:none; padding:5px 10px; border-radius:4px; color:white; font-size:10px;">SAIR X</button>
            </div>
            <iframe id="pdf-frame" src=""></iframe>
        </section>
    </div>
</main>

<button id="btn-switch-view" onclick="window.switchMobileView()"><i class="fas fa-exchange-alt"></i></button>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="color:var(--mpu-blue); font-size:1rem; margin-bottom:15px;"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; padding:12px; background:#000; color:white; border-radius:6px; margin-top:15px; border:none;">FECHAR</button>
    </div>
</div>

<script type="module">
    // (Configuração do Firebase mantida conforme as versões anteriores)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1",
        storageBucket: "masteroab-db5e1.appspot.com",
        messagingSenderId: "620234160245",
        appId: "1:620234160245:web:8651817c66144e59f42668"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const BASE_PATH = "SISTEMA_MPU_ELITE/GAVETAS";

    window.pecaNome = "ESTUDO MPU";

    // LÓGICA DE ALTERNÂNCIA MOBILE
    let viewingPDF = true;
    window.switchMobileView = () => {
        const pdf = document.getElementById('pdf-viewer');
        if (viewingPDF) {
            pdf.style.transform = "translateX(100%)"; // Esconde o PDF à direita
        } else {
            pdf.style.transform = "translateX(0%)"; // Traz o PDF de volta
        }
        viewingPDF = !viewingPDF;
    };

    window.alternarSidebar = () => document.getElementById('sidebar-menu').classList.toggle('collapsed');

    window.abrirBibliotecaPDF = () => {
        const modal = document.getElementById('modal-base');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "VADE MECUM";
        content.innerHTML = "";
        
        const leis = [
            { n: "CF/88", u: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" },
            { n: "LC 75/93", u: "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp75.htm" },
            { n: "L. 8.429", u: "https://www.planalto.gov.br/ccivil_03/leis/l8429.htm" }
        ];

        leis.forEach(l => {
            const d = document.createElement('div'); d.className = 'opt-btn';
            d.innerHTML = `<span>${l.n}</span>`;
            d.onclick = () => {
                document.getElementById('pdf-frame').src = l.u;
                document.getElementById('pdf-title').innerText = l.n;
                document.getElementById('master-wrapper').classList.add('dual-active');
                document.getElementById('sidebar-menu').classList.add('collapsed');
                viewingPDF = true;
                document.getElementById('pdf-viewer').style.transform = "translateX(0%)";
                modal.style.display = 'none';
            };
            content.appendChild(d);
        });
        modal.style.display = 'flex';
    };

    window.fecharPDF = () => {
        document.getElementById('master-wrapper').classList.remove('dual-active');
        document.getElementById('pdf-frame').src = "";
    };

    // (Demais funções Salvar/Abrir permanecem idênticas para manter a compatibilidade)
    window.limparTela = () => confirm("Limpar tudo?") && (document.getElementById('folha-total').innerHTML = "");

    let seg = 0;
    setInterval(() => {
        seg++;
        const m = Math.floor(seg/60).toString().padStart(2,'0');
        const s = (seg%60).toString().padStart(2,'0');
        document.getElementById('sessao-timer').innerText = `${m}:${s}`;
    }, 1000);
</script>
</body>
</html>
