<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOAQUIM ELITE 2026 - MPU MASTER</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #020617; --gold: #fbbf24; --gold-dark: #d97706;
            --bg-paper: #cbd5e1; --sidebar-w: 75px; --sucesso: #166534; --perigo: #ef4444;
            --info: #3b82f6; --mentoria: #6366f1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        header { 
            background: var(--primary); height: 55px; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); z-index: 5000; 
        }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR - NÚCLEO DURO MPU */
        .sidebar { 
            width: var(--sidebar-w); background: #1e293b; display: flex; 
            flex-direction: column; align-items: center; gap: 10px; 
            padding: 15px 0; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .btn-side { 
            width: 52px; height: 52px; border: none; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; cursor: pointer; transition: 0.3s; 
            background: rgba(255,255,255,0.05); position: relative;
        }
        .btn-side:hover { background: rgba(255,255,255,0.15); border-left: 3px solid var(--gold); transform: scale(1.05); }
        .btn-side i { font-size: 1.3rem; color: var(--gold); }
        
        /* Labels Flutuantes */
        .btn-side::after {
            content: attr(data-label); position: absolute; left: 75px; background: #000; 
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 10px; 
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10000;
            border: 1px solid var(--gold); font-weight: bold;
        }
        .btn-side:hover::after { opacity: 1; }

        /* EDITOR WRAPPER */
        .content-wrapper { flex: 1; display: flex; transition: all 0.4s ease; }
        .editor-container { 
            flex: 1; display: flex; flex-direction: column; background: var(--bg-paper); 
            overflow-y: auto; align-items: center; padding: 25px; position: relative;
        }

        /* TOOLBAR MARCA TEXTO FLUTUANTE */
        .floating-toolbar {
            position: sticky; top: 0; z-index: 1000; background: #fff; 
            padding: 8px 15px; border-radius: 30px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px;
            border: 2px solid var(--gold); color: #000;
        }
        .color-dot { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid #ddd; }
        .color-dot.active { border-color: #000; transform: scale(1.1); }

        .sticky-header {
            width: 100%; max-width: 900px; background: #f8fafc; padding: 12px;
            border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0;
            color: #020617; font-weight: 900; text-align: center;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* FOLHA ENGINE 150 LINHAS */
        .folha-moldura { width: 100%; max-width: 900px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); margin-bottom: 50px; }
        .folha-container { display: grid; grid-template-columns: 50px 1fr; background: #fff; border: 2px solid #000; }
        .numeracao { background: #f1f5f9; border-right: 2px solid #000; user-select: none; }
        .num-mecanico { height: 35px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; border-bottom: 1px solid #cbd5e1; color: #1e293b; }
        .area-editor { 
            outline: none; font-size: 19px !important; font-weight: 700 !important; color: #000 !important; 
            line-height: 35px !important; padding: 0 20px !important; white-space: pre-wrap; word-wrap: break-word; 
            min-height: 1500px; background-image: linear-gradient(to bottom, transparent 34px, #e2e8f0 34px);
            background-size: 100% 35px; background-repeat: repeat-y; background-position: 0 -1px; text-align: justify;
            font-family: 'Courier New', Courier, monospace;
        }

        /* MODAIS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 110000; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 92%; max-width: 550px; padding: 25px; border-radius: 20px; color: #0f172a; max-height: 85vh; overflow-y: auto; }
        .opt-btn { width: 100%; padding: 14px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #1e293b; transition: 0.2s; }
        .opt-btn:hover { background: var(--gold); border-color: #000; }
        .item-historico { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; margin-bottom: 10px; color: #1e293b; }
        .item-actions { display: flex; gap: 15px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        .btn-action { cursor: pointer; font-size: 11px; font-weight: bold; color: var(--info); text-transform: uppercase; }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:900;">JOAQUIM <span style="color:var(--gold)">ELITE</span> 2026</div>
    <div id="relogio" style="font-family: monospace; font-weight: bold; color: var(--gold);">00:00:00</div>
</header>

<main>
    <aside class="sidebar">
        <button class="btn-side" data-label="SALVAR NA GAVETA" style="background:var(--sucesso);" onclick="window.modalSalvar()"><i class="fas fa-save"></i></button>
        <button class="btn-side" data-label="MINHAS GAVETAS" onclick="window.abrirGavetas()"><i class="fas fa-box-open"></i></button>
        
        <div style="height:1px; width:35px; background:rgba(255,255,255,0.1); margin:5px 0;"></div>
        
        <button class="btn-side" data-label="QUAL A PEÇA?" onclick="window.alert('Em desenvolvimento: Qual a Peça')"><i class="fas fa-gavel"></i></button>
        <button class="btn-side" data-label="TESES" onclick="window.alert('Em desenvolvimento: Teses')"><i class="fas fa-balance-scale"></i></button>
        <button class="btn-side" data-label="INTELIGÊNCIA NÃO CONFUNDA" onclick="window.alert('Em desenvolvimento: Inteligência')"><i class="fas fa-brain"></i></button>
        <button class="btn-side" data-label="ESTRUTURAS (PERGAMINHO)" onclick="window.abrirGavetas()"><i class="fas fa-scroll"></i></button>
        
        <button class="btn-side" data-label="LIMPAR TELA" style="background:var(--perigo); margin-top:auto" onclick="window.limpar()"><i class="fas fa-eraser"></i></button>
    </aside>

    <div class="content-wrapper">
        <section class="editor-container">
            
            <div class="floating-toolbar">
                <i class="fas fa-highlighter" style="margin-right:5px"></i>
                <div class="color-dot active" id="dot-yellow" style="background:#fef08a;" onclick="window.setHighlightColor('#fef08a', 'dot-yellow')"></div>
                <div class="color-dot" id="dot-green" style="background:#bbf7d0;" onclick="window.setHighlightColor('#bbf7d0', 'dot-green')"></div>
                <div class="color-dot" id="dot-blue" style="background:#bfdbfe;" onclick="window.setHighlightColor('#bfdbfe', 'dot-blue')"></div>
                <div style="width:1px; height:20px; background:#ddd; margin:0 5px"></div>
                <button id="toggle-marker" onclick="window.toggleHighlight()" style="background:none; border:none; cursor:pointer; font-weight:bold; font-size:11px">DESATIVAR</button>
            </div>

            <div class="sticky-header">
                <span id="info-pasta" style="font-size: 10px; color: #64748b;">GAVETA: CADERNO</span>
                <span id="txt-titulo-topo">NOVO DOCUMENTO</span>
                <i class="fas fa-pen" style="cursor:pointer; font-size:12px; opacity:0.5" onclick="window.renomearAtual()"></i>
            </div>
            
            <div class="folha-moldura" id="engine-container"></div>
        </section>
    </div>
</main>

<div class="modal" id="modal-base">
    <div class="modal-body">
        <h2 id="modal-title" style="margin-bottom:20px; border-bottom:3px solid var(--gold); padding-bottom:10px; font-size:18px;"></h2>
        <div id="modal-content"></div>
        <button onclick="document.getElementById('modal-base').style.display='none'" style="width:100%; margin-top:20px; padding:15px; background:black; color:white; border-radius:10px; cursor:pointer; font-weight:bold;">VOLTAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmigODFK8R9c0-fWtagdxLWu9xkODfKYQ",
        authDomain: "masteroab-db5e1.firebaseapp.com",
        databaseURL: "https://masteroab-db5e1-default-rtdb.firebaseio.com",
        projectId: "masteroab-db5e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- FOLHA ENGINE FIXA ---
    const FolhaEngine = {
        montar: (containerId) => {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="folha-container"><div class="numeracao" id="num-col"></div><div class="area-editor" id="editor-principal" contenteditable="true" spellcheck="false"></div></div>`;
            const numCol = document.getElementById('num-col');
            for(let i=1; i<=150; i++) {
                const n = document.createElement('div'); n.className = 'num-mecanico'; n.innerText = i;
                numCol.appendChild(n);
            }
            const editor = document.getElementById('editor-principal');
            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    document.execCommand('insertText', false, '    ');
                }
            });
        }
    };
    FolhaEngine.montar('engine-container');

    const GAVETAS = ["PECAS", "TESES", "PRELIMINARES", "QUESTOES", "CADERNO"];
    window.currentColor = '#fef08a';
    window.highlightActive = true;

    // --- LÓGICA MARCA TEXTO ---
    window.setHighlightColor = (color, id) => {
        window.currentColor = color;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.highlightActive = true;
        document.getElementById('toggle-marker').innerText = "ATIVO";
    };

    window.toggleHighlight = () => {
        window.highlightActive = !window.highlightActive;
        document.getElementById('toggle-marker').innerText = window.highlightActive ? "ATIVO" : "DESATIVADO";
    };

    document.addEventListener('mouseup', () => {
        if(window.highlightActive) {
            const sel = window.getSelection();
            if(sel.toString().length > 0) document.execCommand('backColor', false, window.currentColor);
        }
    });

    // --- LÓGICA GAVETAS (FIREBASE) ---
    window.modalSalvar = () => {
        const content = document.getElementById('modal-content');
        const titulo = document.getElementById('txt-titulo-topo').innerText;
        document.getElementById('modal-title').innerText = "SALVAR EM:";
        content.innerHTML = `
            <input type="text" id="save-name" value="${titulo}" style="width:100%; padding:15px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc; font-weight:bold; text-transform: uppercase;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                ${GAVETAS.map(g => `<button class="opt-btn" onclick="window.executarSalvar('${g}')">${g}</button>`).join('')}
            </div>`;
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.executarSalvar = async (gaveta) => {
        const nome = document.getElementById('save-name').value.toUpperCase() || "SEM TITULO";
        const html = document.getElementById('editor-principal').innerHTML;
        const path = `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}`;
        const snap = await get(ref(db, path));
        let idFinal = Date.now().toString();

        if(snap.exists()){
            const jaExiste = Object.entries(snap.val()).find(([id, d]) => d.nome === nome);
            if(jaExiste && !confirm(`Substituir "${nome}"?`)) return;
            if(jaExiste) idFinal = jaExiste[0];
        }

        await set(ref(db, `${path}/${idFinal}`), {
            nome: nome,
            conteudo: btoa(unescape(encodeURIComponent(html))),
            data: new Date().toLocaleString('pt-BR')
        });

        document.getElementById('txt-titulo-topo').innerText = nome;
        document.getElementById('info-pasta').innerText = `GAVETA: ${gaveta}`;
        alert("Salvo com sucesso!");
        document.getElementById('modal-base').style.display = 'none';
    };

    window.abrirGavetas = () => {
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = "GAVETAS MPU";
        content.innerHTML = GAVETAS.map(g => `
            <div class="opt-btn" onclick="window.listarArquivos('${g}')">
                <span><i class="fas fa-folder" style="color:var(--gold)"></i> &nbsp; ${g}</span>
                <i class="fas fa-chevron-right"></i>
            </div>`).join('');
        document.getElementById('modal-base').style.display = 'flex';
    };

    window.listarArquivos = async (gaveta) => {
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = `GAVETA: ${gaveta}`;
        content.innerHTML = "Carregando...";
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}`));
        if(!snap.exists()) { content.innerHTML = "Vazio."; return; }

        let h = "";
        Object.entries(snap.val()).reverse().forEach(([id, item]) => {
            h += `
                <div class="item-historico">
                    <div style="cursor:pointer; font-weight:bold;" onclick="window.abrirEstudo('${gaveta}', '${id}')">${item.nome}</div>
                    <div style="font-size:9px; color:#999">${item.data}</div>
                    <div class="item-actions">
                        <span class="btn-action" onclick="window.removerArquivo('${gaveta}', '${id}')">Excluir</span>
                    </div>
                </div>`;
        });
        content.innerHTML = h;
    };

    window.abrirEstudo = async (gaveta, id) => {
        const snap = await get(ref(db, `SISTEMA_MPU_ELITE/GAVETAS/${gaveta}/${id}`));
        if(snap.exists()){
            const item = snap.val();
            document.getElementById('editor-principal').innerHTML = decodeURIComponent(escape(atob(item.conteudo)));
            document.getElementById('txt-titulo-topo').innerText = item.nome;
            document.getElementById('info-pasta').innerText = `GAVETA: ${gaveta}`;
            document.getElementById('modal-base').style.display = 'none';
        }
    };

    window.renomearAtual = () => {
        const n = prompt("Novo nome:", document.getElementById('txt-titulo-topo').innerText);
        if(n) document.getElementById('txt-titulo-topo').innerText = n.toUpperCase();
    };

    window.limpar = () => confirm("Limpar tela?") && (document.getElementById('editor-principal').innerHTML = "");
    setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);

</script>
</body>
</html>
